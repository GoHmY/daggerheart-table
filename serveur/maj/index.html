ntelé",1,"minion",9,0,0,1,1,-2,"2 phys.","Mêlée","Fuir, profiter, fumigènes",[["Sbire (3)","P","Vaincu dès qu’il subit des dégâts. Tous les 3 dégâts qu’un PJ lui inflige, un autre sbire à portée que l’attaque aurait touché est aussi vaincu."],["Attaque groupée","A","**Dépensez 1 Peur**, choisissez une cible et activez tous les sbires de ce type à courte portée d’elle. Ils se placent au corps à corps et font un seul jet d’attaque commun. En cas de réussite, chacun inflige 2 dégâts physiques ; additionnez-les."]]],["Jagged Knife Lieutenant","Lieutenant du Couteau dentelé",1,"leader",13,7,14,6,3,2,"1d8+3 phys.","Courte","Brutaliser, commander, renforcer",[["Tacticien","A","Quand vous activez le Lieutenant, **marquez 1 Stress** pour activer aussi deux alliés à courte portée."],["Il y en a d’autres","A","Invoque trois Larbins du Couteau dentelé, qui apparaissent à longue portée."],["Coup de grâce","A","**Dépensez 1 Peur** pour attaquer une cible Vulnérable à courte portée. En cas de réussite, elle subit **2d6+12** dégâts physiques et marque 1 Stress."],["Élan","R","Quand l’adversaire réussit une attaque contre un PJ, vous gagnez 1 Peur."]]],["Jagged Knife Shadow","Ombre du Couteau dentelé",1,"skulk",12,4,8,3,3,1,"1d4+4 phys.","Mêlée","Embusquer, se cacher, diviser",[["Coup dans le dos","P","Quand l’Ombre réussit une attaque standard avec avantage, elle inflige **1d6+6** dégâts physiques au lieu de ses dégâts standards."],["Dissimulé","A","L’Ombre devient Cachée jusqu’après sa prochaine attaque. Les attaques faites en étant Cachée grâce à cette capacité ont l’avantage."]]],["Jagged Knife Sniper","Tireur du Couteau dentelé",1,"ranged",13,4,7,3,2,-1,"1d10+2 phys.","Longue","Embusquer, se cacher, se repositionner",[["Frappe invisible","P","Si le Tireur est Caché quand il réussit une attaque standard, il inflige **1d10+4** dégâts physiques au lieu de ses dégâts standards."]]],["Juvenile Flickerfly","Scintilleur juvénile",2,"solo",14,13,26,10,5,3,"2d10+4 phys.","Très courte","Collectionner, chasser, piquer",[["Implacable (3)","P","Peut être activé jusqu’à 3 fois par tour du MJ. Dépensez de la Peur comme d’habitude pour l’activer."],["Précision inégalée","P","Avant chaque attaque du Scintilleur, lancez **1d6**. Sur 4 ou plus, l’Esquive de la cible est divisée par deux contre cette attaque."],["Danse mentale","A","**Marquez 1 Stress** : le Scintilleur crée un spectacle magique éblouissant qui happe l’esprit des ennemis proches. Toutes les cibles à courte portée font un jet de réaction d’Instinct. Pour chaque échec, vous gagnez 1 Peur et le Scintilleur apprend l’une des peurs de la cible."],["Souffle hallucinogène · Compte à rebours (boucle 1d6)","R","Lancez le compte à rebours la première fois que le Scintilleur subit des dégâts. Quand il se déclenche, il souffle un gaz hallucinogène sur toutes les cibles devant lui jusqu’à longue portée. Elles doivent réussir un jet de réaction d’Instinct ou être tourmentées par des visions terrifiantes (désavantage si le Scintilleur connaît leurs peurs). En cas d’échec, elles marquent 1 Stress et perdent 1 Espoir."]]],["Knight of the Realm","Chevalier du royaume",2,"leader",15,13,26,6,4,4,"2d10+4 phys.","Mêlée","Charger, gloire, dominer",[["Cavalier","P","Quand le Chevalier est monté, il a un bonus de +2 à sa Difficulté. S’il subit des dégâts Graves, il est désarçonné et perd ce bonus jusqu’à sa prochaine activation."],["Lourdement cuirassé","P","Quand le Chevalier subit des dégâts physiques, réduisez-les de 3."],["Charge de cavalerie","A","Si le Chevalier est monté, il se déplace jusqu’à longue portée et porte une attaque standard contre une cible. En cas de réussite, elle subit **2d8+4** dégâts physiques et marque 1 Stress."],["Pour le royaume !","A","**Marquez 1 Stress** pour activer **1d4+1** alliés. Leurs attaques pendant cette activation infligent la moitié des dégâts."]]],["Kraken","Kraken",4,"solo",20,35,70,11,8,7,"4d12+10 phys.","Courte","Dévorer, broyer, noyer, saisir",[["Implacable (3)","P","Peut être activé jusqu’à 3 fois par tour du MJ. Dépensez de la Peur comme d’habitude pour l’activer."],["Tentacules multiples","P","Tant que le Kraken a 7 PV marqués ou moins, il peut porter son attaque standard contre deux cibles à portée."],["Saisir et noyer","A","Jet d’attaque contre une cible à courte portée. En cas de réussite, **marquez 1 Stress** : le Kraken la saisit d’un tentacule et l’entraîne sous l’eau. Elle est Bloquée et Vulnérable jusqu’à ce qu’elle se libère avec un jet de Force réussi ou que le Kraken subisse des dégâts Majeurs ou pire. Dans cet état, elle marque 1 Stress à chaque jet d’action."],["Jet bouillant","A","**Dépensez 1 Peur** pour cracher un jet d’eau bouillante sur autant de cibles que voulu, alignées jusqu’à longue portée. Elles doivent réussir un jet de réaction d’Agilité ou subir **4d6+9** dégâts physiques. Une cible qui marque une case d’armure pour réduire ces dégâts marque aussi 1 Stress."],["Élan","R","Quand l’adversaire réussit une attaque contre un PJ, vous gagnez 1 Peur."]]],["Masked Thief","Voleur masqué",2,"skulk",14,8,17,4,5,3,"2d8+3 phys.","Mêlée","Fuir, se cacher, chaparder",[["Doigts agiles","A","Attaque contre une cible au corps à corps. En cas de réussite, elle subit **1d8+2** dégâts physiques et le Voleur lui dérobe un objet ou un consommable de son inventaire."],["Plan d’évasion","A","**Marquez 1 Stress** pour révéler un collet que le Voleur a posé n’importe où sur le champ de bataille. Toutes les cibles à très courte portée du piège doivent réussir un jet de réaction d’Agilité (13) ou être soulevées et suspendues la tête en bas : elles sont Bloquées et Vulnérables jusqu’à ce qu’elles se libèrent (fin des deux états) avec un jet de Finesse ou de Force (13) réussi."]]],["Master Assassin","Maître assassin",2,"leader",15,12,25,7,5,5,"2d10+2 phys.","Courte","Embusquer, tuer, tout prévoir",[["Personne ne le voit venir","P","L’Assassin inflige des dégâts directs tant qu’il est Caché."],["Frapper d’un seul geste","A","**Marquez 1 Stress** pour activer autant d’autres Assassins que le Maître a de cases de Stress non marquées."],["La lame subtile","R","Quand l’Assassin réussit une attaque standard contre une cible Vulnérable, vous pouvez **dépenser 1 Peur** pour infliger des dégâts Graves au lieu de ses dégâts standards."],["Élan","R","Quand l’adversaire réussit une attaque contre un PJ, vous gagnez 1 Peur."]]],["Merchant Baron","Baron marchand",2,"social",15,9,19,5,3,-2,"1d6+2 phys.","Mêlée","Abuser du pouvoir, rassembler, mobiliser",[["Tout le monde a un prix","A","**Dépensez 1 Peur** pour proposer à une cible un marché dangereux contre une chose qu’elle désire ou dont elle a besoin. Contre un PJ, il fait un jet de réaction de Présence (17) : en cas d’échec, il doit marquer 2 Stress ou accepter le marché."],["Les meilleurs gros bras","A","Une fois par scène, **marquez 1 Stress** pour invoquer **1d4+1** adversaires de rang 1, qui apparaissent à longue portée pour faire respecter la volonté du Baron."]]],["Merchant","Marchand",1,"social",12,4,8,3,3,-4,"1d4+1 phys.","Mêlée","Acheter bas, vendre cher, gonfler les prix",[["Traitement de faveur","P","Un PJ qui réussit un jet de Présence contre le Marchand obtient une remise. Un PJ qui échoue paie plus cher et a le désavantage à ses futurs jets de Présence contre lui."],["Mener en bateau","P","Quand un PJ obtient 14 ou moins à un jet de Présence contre le Marchand, il marque 1 Stress."]]],["Minor Chaos Elemental","Élémentaire de chaos mineur",1,"solo",14,7,14,7,3,3,"1d12+6 mag.","Courte","Déconcerter, déstabiliser, transmuer",[["Forme arcanique","P","L’Élémentaire est résistant aux dégâts magiques."],["Flux nauséeux","A","**Marquez 1 PV** pour obliger toutes les cibles à courte portée à marquer 1 Stress et devenir Vulnérables jusqu’à leur prochain repos ou jusqu’à ce qu’elles récupèrent 1 PV."],["Refaçonner le réel","A","**Dépensez 1 Peur** pour transformer la zone à très courte portée en un autre milieu naturel. Toutes les cibles dans la zone subissent **2d6+3** dégâts magiques directs."],["Reflet magique","R","Quand l’Élémentaire subit des dégâts d’une attaque à courte portée, l’attaquant subit la moitié des dégâts qu’il a infligés."],["Élan","R","Quand l’adversaire réussit une attaque contre un PJ, vous gagnez 1 Peur."]]],["Minor Demon","Démon mineur",1,"solo",14,8,15,8,4,3,"1d8+6 phys.","Mêlée","Agir de façon erratique, tourmenter",[["Implacable (2)","P","Peut être activé jusqu’à 2 fois par tour du MJ. Dépensez de la Peur comme d’habitude pour l’activer."],["Tout doit tomber","P","Quand un PJ à courte portée du Démon obtient un échec avec Peur, il perd 1 Espoir."],["Feu infernal","A","**Dépensez 1 Peur** pour faire pleuvoir un feu infernal à longue portée. Toutes les cibles dans la zone font un jet de réaction d’Agilité. En cas d’échec, elles subissent **1d20+3** dégâts magiques ; en cas de réussite, la moitié."],["Faucheur","R","Avant de lancer les dégâts d’une attaque du Démon, vous pouvez **marquer 1 Stress** pour ajouter aux dégâts un bonus égal au nombre de PV qu’il a marqués."],["Élan","R","Quand l’adversaire réussit une attaque contre un PJ, vous gagnez 1 Peur."]]],["Minor Fire Elemental","Élémentaire de feu mineur",1,"solo",13,7,15,9,3,3,"1d10+4 mag.","Longue","Encercler, grandir, intimider, incendier",[["Implacable (2)","P","Peut être activé jusqu’à 2 fois par tour du MJ. Dépensez de la Peur comme d’habitude pour l’activer."],["Terre brûlée","A","**Marquez 1 Stress** et choisissez un point à longue portée. Le sol à très courte portée de ce point s’embrase. Toutes les créatures dans la zone font un jet de réaction d’Agilité. En cas d’échec, elles subissent **2d8** dégâts magiques ; en cas de réussite, la moitié."],["Explosion","A","**Dépensez 1 Peur** : l’Élémentaire explose. Attaque contre toutes les cibles à courte portée. Les cibles touchées subissent **1d8** dégâts magiques et sont repoussées à longue portée."],["Dévorer le combustible","R","Trois fois par scène, quand l’Élémentaire passe sur des objets très inflammables, il les consume pour récupérer 1 PV ou 1 Stress."],["Élan","R","Quand l’adversaire réussit une attaque contre un PJ, vous gagnez 1 Peur."]]],["Minor Treant","Sylvanien mineur",1,"minion",10,0,0,1,1,-2,"4 phys.","Mêlée","Écraser, submerger, protéger",[["Sbire (5)","P","Vaincu dès qu’il subit des dégâts. Tous les 5 dégâts qu’un PJ lui inflige, un autre sbire à portée que l’attaque aurait touché est aussi vaincu."],["Attaque groupée","A","**Dépensez 1 Peur**, choisissez une cible et activez tous les sbires de ce type à courte portée d’elle. Ils se placent au corps à corps et font un seul jet d’attaque commun. En cas de réussite, chacun inflige 4 dégâts physiques ; additionnez-les."]]],["Minotaur Wrecker","Minotaure destructeur",2,"bruiser",16,14,27,7,5,2,"2d8+5 phys.","Très courte","Encorner, écraser, poursuivre",[["Montée en puissance","P","Vous devez **dépenser 1 Peur** pour activer le Minotaure. Quand il est activé, il peut porter son attaque standard contre toutes les cibles à portée."],["Charge du taureau","A","**Marquez 1 Stress** : le Minotaure charge à travers un groupe à courte portée et attaque toutes les cibles sur son passage. Les cibles touchées subissent **2d6+8** dégâts physiques et sont projetées à très longue portée. Une cible projetée contre un objet solide ou une autre créature subit **1d6** dégâts de plus (à additionner)."],["Encorner","A","Attaque contre une cible à très courte portée ; le Minotaure se place à son corps à corps. En cas de réussite, il inflige **2d8** dégâts physiques directs."]]],["Monarch","Monarque",3,"social",16,16,32,6,5,0,"3d6+3 phys.","Mêlée","Contrôler ses vassaux, détruire ses rivaux, bâtir un héritage",[["Qu’on les exécute !","A","**Dépensez 1 Peur par PJ du groupe** pour faire condamner le groupe pour des crimes réels ou imaginaires. Un PJ qui réussit un jet de Présence peut exiger un duel judiciaire ou une autre forme de procès particulière."],["Garde de la couronne","A","Une fois par scène, **marquez 1 Stress** pour invoquer six sbires de rang 3, qui apparaissent à courte portée pour faire respecter la volonté du Monarque."],["Casus belli · Compte à rebours long (8)","R","**Dépensez 1 Peur** pour lancer ce compte à rebours une fois que le désir de guerre du Monarque a été révélé. Quand il se déclenche, le Monarque a une raison de mener la nation à la guerre et les soutiens pour le faire. Vous gagnez **1d4** Peur."]]],["Mortal Hunter","Chasseur de mortels",2,"leader",16,15,27,6,4,5,"2d12+1 phys.","Très courte","Dévorer, chasser, pister",[["Terrifiant","P","Quand il réussit une attaque, tous les PJ à longue portée perdent 1 Espoir et vous gagnez 1 Peur."],["Sceau de mort","A","**Dépensez 1 Peur** pour maudire une cible à très courte portée d’un Sceau de mort nécrotique jusqu’à la fin de la scène. Les attaques du Chasseur contre elle infligent des dégâts directs. Il ne peut maintenir qu’un seul Sceau à la fois."],["Mort inévitable","A","**Marquez 1 Stress** pour activer **1d4** alliés. Leurs attaques pendant cette activation infligent la moitié des dégâts."],["Saccage · Compte à rebours (boucle 1d6)","R","Lancez le compte à rebours la première fois que le Chasseur est activé. Quand il se déclenche, déplacez le Chasseur en ligne droite jusqu’à un point à longue portée et attaquez toutes les cibles sur son passage. Les cibles touchées subissent **2d8+2** dégâts physiques."]]],["Oak Treant","Sylvanien de chêne",3,"bruiser",17,22,40,7,4,2,"3d8+2 phys.","Très courte","Se fondre dans le décor, préserver la forêt, s’enraciner, frapper",[["Juste un arbre","P","Avant sa première attaque d’un combat, ou après être devenu Caché, le Sylvanien est impossible à distinguer des autres arbres jusqu’à sa prochaine action ou jusqu’à ce qu’un PJ le repère avec un jet d’Instinct réussi."],["Barrage de graines","A","**Marquez 1 Stress** et attaquez jusqu’à trois cibles à courte portée en les bombardant de glands géants. Les cibles touchées subissent **2d10+5** dégâts physiques."],["S’enraciner","A","**Marquez 1 Stress** pour Enraciner le Sylvanien. Enraciné, il est Bloqué mais a la résistance aux dégâts physiques. Il peut mettre fin à cet effet au lieu de se déplacer quand il est activé."]]],["Oracle of Doom","Oracle du malheur",4,"solo",20,38,68,11,10,8,"4d8+9 mag.","Longue","Changer le terrain, condamner, décourager, balayer",[["Terrifiant","P","Quand il réussit une attaque, tous les PJ à longue portée perdent 1 Espoir et vous gagnez 1 Peur."],["Les murs se resserrent","P","Quand une créature à très longue portée de l’Oracle obtient un échec, elle marque 1 Stress."],["Prononcer le destin","A","**Dépensez 1 Peur** pour montrer à une cible à longue portée une vision de son cauchemar personnel. Elle fait un jet de réaction de Savoir. En cas d’échec, elle perd tout son Espoir et subit **2d20+4** dégâts magiques directs ; en cas de réussite, la moitié des dégâts et elle perd 1 Espoir."],["Invoquer les tourmenteurs","A","Une fois par jour, **dépensez 2 Peur** pour invoquer **2d4** sbires de rang 2 ou moins liés au cauchemar personnel d’un PJ. Ils apparaissent à courte portée de ce PJ."],["Savoir sinistre","R","Quand l’Oracle voit une créature mortelle, il connaît aussitôt l’un de ses cauchemars personnels."],["Destin vengeur","R","Quand l’Oracle marque des PV à cause d’une attaque à très courte portée, vous pouvez **marquer 1 Stress** pour repousser l’attaquant à longue portée et lui infliger **2d10+4** dégâts physiques."]]],["Outer Realms Abomination","Abomination des Royaumes extérieurs",4,"bruiser",19,35,71,7,5,5,"4d6+13 mag.","Très courte","Démolir, dévorer, saper",[["Forme chaotique","P","Quand l’Abomination attaque, lancez **2d4** : le résultat est son modificateur d’attaque."],["Présence déroutante","P","Quand une cible subit des dégâts de l’Abomination, elle fait un jet de réaction d’Instinct. En cas d’échec, elle a le désavantage à son prochain jet d’action et vous gagnez 1 Peur."],["Séisme du réel","A","**Dépensez 1 Peur** pour ébranler les limites de la réalité à longue portée de l’Abomination. Toutes les cibles dans la zone doivent réussir un jet de réaction de Savoir ou être Décrochées du réel jusqu’à la fin de la scène. Une cible Décrochée qui dépense de l’Espoir ou marque des cases d’armure, des PV ou du Stress en dépense ou en marque le double."],["Forme irréelle","R","Quand l’Abomination subit des dégâts, réduisez-les de **1d20**. Si elle marque 1 PV ou moins à cause d’une attaque réussie, vous gagnez 1 Peur."]]],["Outer Realms Corruptor","Corrupteur des Royaumes extérieurs",4,"support",19,27,47,4,3,7,"4d8+5 mag.","Très courte","Troubler, distraire, submerger",[["Toucher brise-volonté","P","Quand un PJ subit des dégâts du Corrupteur, il perd 1 Espoir."],["Régurgiter des débris de réalité","A","**Marquez 1 Stress** pour cracher des fragments à demi digérés de réalités dévorées sur toutes les cibles à courte portée. Elles doivent réussir un jet de réaction de Savoir ou marquer 2 Stress."]]],["Outer Realms Thrall","Esclave des Royaumes extérieurs",4,"minion",17,0,0,1,1,3,"11 phys.","Très courte","Détruire, dégoûter, désorienter, intimider",[["Sbire (13)","P","Vaincu dès qu’il subit des dégâts. Tous les 13 dégâts qu’un PJ lui inflige, un autre sbire à portée que l’attaque aurait touché est aussi vaincu."],["Attaque groupée","A","**Dépensez 1 Peur**, choisissez une cible et activez tous les sbires de ce type à courte portée d’elle. Ils se placent au corps à corps et font un seul jet d’attaque commun. En cas de réussite, chacun inflige 11 dégâts physiques ; additionnez-les."]]],["Patchwork Zombie Hulk","Colosse zombie rapiécé",1,"solo",13,8,15,10,3,4,"1d20 phys.","Très courte","Absorber des cadavres, terrifier",[["Destructible","P","Quand le Zombie subit des dégâts Majeurs ou pire, il marque 1 PV supplémentaire."],["Membres battants","P","Quand le Zombie porte une attaque standard, il peut attaquer toutes les cibles à très courte portée."],["Un de plus pour le tas","A","Quand le Zombie est à très courte portée d’un cadavre, il peut l’intégrer à son corps pour récupérer 1 PV et 1 Stress."],["Hurlements tourmentés","A","**Marquez 1 Stress** : tous les PJ à longue portée font un jet de réaction de Présence (13). Ceux qui échouent perdent 1 Espoir et vous gagnez 1 Peur pour chacun. Ceux qui réussissent marquent 1 Stress."]]],["Perfected Zombie","Zombie perfectionné",4,"bruiser",20,40,70,9,4,4,"4d12+15 phys.","Très courte","Dévorer, traquer, mutiler, terrifier",[["Terrifiant","P","Quand il réussit une attaque, tous les PJ à longue portée perdent 1 Espoir et vous gagnez 1 Peur."],["Présence effroyable","P","Les PJ ne peuvent pas dépenser d’Espoir pour utiliser des capacités contre le Zombie."],["Frappe parfaite","A","**Marquez 1 Stress** pour porter une attaque standard contre toutes les cibles à très courte portée. Les cibles touchées sont Vulnérables jusqu’à leur prochain repos."],["Opportuniste habile","R","Quand un autre adversaire inflige des dégâts à une cible à très courte portée du Zombie, vous pouvez **dépenser 1 Peur** pour ajouter les dégâts de l’attaque standard du Zombie au jet de dégâts."]]],["Petty Noble","Petit noble",1,"social",14,6,10,3,5,-3,"1d6+1 phys.","Mêlée","Abuser du pouvoir, rassembler, mobiliser",[["Mes terres, mes règles","P","Sur les terres du Noble, toutes les actions sociales contre lui ont le désavantage."],["Gardes, saisissez-les !","A","Une fois par scène, **marquez 1 Stress** pour invoquer **1d4** Gardes armés, qui apparaissent à longue portée pour faire respecter la volonté du Noble."],["Exil","A","**Dépensez 1 Peur** et ciblez un PJ. Le Noble proclame que la cible et ses alliés sont bannis de son territoire. Tant qu’ils sont exilés, ils ont le désavantage dans les situations sociales sur le domaine du Noble."]]],["Pirate Captain","Capitaine pirate",1,"leader",14,7,14,7,5,4,"1d12+2 phys.","Mêlée","Commander, piller, faire marcher sur la planche",[["Bretteur","P","Quand le Capitaine marque 2 PV ou moins à cause d’une attaque au corps à corps, l’attaquant marque 1 Stress."],["Renforts","A","Une fois par scène, **marquez 1 Stress** pour invoquer une horde de Pillards pirates, qui apparaît à longue portée."],["Pas de quartier","A","**Dépensez 1 Peur** et choisissez une cible qui a au moins trois Pirates au corps à corps. Le Capitaine mène les Pirates qui la couvrent de menaces et lui promettent une tombe liquide. La cible fait un jet de réaction de Présence : en cas d’échec, elle marque **1d4+1** Stress ; en cas de réussite, 1 Stress."],["Élan","R","Quand l’adversaire réussit une attaque contre un PJ, vous gagnez 1 Peur."]]],["Pirate Raiders","Pillards pirates",1,"horde",12,5,11,4,3,1,"1d8+2 phys.","Mêlée","Encercler, piller, attaquer",[["Horde (1d4+1)","P","Quand la horde a marqué la moitié de ses PV ou plus, son attaque standard inflige **1d4+1** dégâts physiques à la place."],["Bretteurs","P","Quand les Pillards marquent 2 PV ou moins à cause d’une attaque au corps à corps, l’attaquant marque 1 Stress."]]],["Pirate Tough","Pirate costaud",1,"bruiser",13,8,15,5,3,1,"2d6 phys.","Mêlée","Piller, fracasser, terroriser",[["Bretteur","P","Quand le Costaud marque 2 PV ou moins à cause d’une attaque au corps à corps, l’attaquant marque 1 Stress."],["Dégager le pont","A","Attaque contre une cible à très courte portée. En cas de réussite, **marquez 1 Stress** : le Costaud fonce au corps à corps de la cible, lui inflige **3d4** dégâts physiques et la repousse à courte portée."]]],["Red Ooze","Gelée rouge",1,"skulk",10,6,11,5,3,1,"1d8+3 mag.","Mêlée","Se camoufler, absorber, incendier",[["Feu rampant","P","La Gelée ne se déplace que dans sa très courte portée lors d’un mouvement normal. Elle enflamme tout objet inflammable qu’elle touche."],["Embraser","A","Attaque contre une cible à très courte portée. En cas de réussite, elle subit **1d8** dégâts magiques et prend feu jusqu’à être éteinte par un jet de Finesse (14) réussi. Tant qu’elle brûle, elle subit **1d4** dégâts magiques à chaque jet d’action."],["Division","R","Quand la Gelée a 3 PV marqués ou plus, vous pouvez **dépenser 1 Peur** pour la diviser en deux Petites gelées rouges (sans PV ni Stress marqués). Activez-les immédiatement toutes les deux."]]],["Rotted Zombie","Zombie pourri",1,"minion",8,0,0,1,1,-3,"2 phys.","Mêlée","Dévorer, encercler",[["Sbire (3)","P","Vaincu dès qu’il subit des dégâts. Tous les 3 dégâts qu’un PJ lui inflige, un autre sbire à portée que l’attaque aurait touché est aussi vaincu."],["Attaque groupée","A","**Dépensez 1 Peur**, choisissez une cible et activez tous les sbires de ce type à courte portée d’elle. Ils se placent au corps à corps et font un seul jet d’attaque commun. En cas de réussite, chacun inflige 2 dégâts physiques ; additionnez-les."]]],["Royal Advisor","Conseiller royal",2,"social",14,8,15,3,3,-3,"1d4+3 phys.","Longue","Plaire, fabriquer des preuves, intriguer",[["Réplique cinglante","P","Un PJ qui obtient moins de 17 à un jet d’action visant le Conseiller marque 1 Stress."],["Souffler à l’oreille","A","**Marquez 1 Stress** pour influencer un PNJ au corps à corps par des mots chuchotés. Son avis sur un sujet penche vers celui du Conseiller, sauf si cela va directement contre ses motivations."],["Bouc émissaire","A","**Dépensez 1 Peur** pour convaincre une foule ou une personnalité qu’une personne ou un groupe est responsable d’un problème qui la touche. La cible devient hostile au bouc émissaire jusqu’à ce qu’on la convainque de son innocence par un jet de Présence (17) réussi."]]],["Secret-Keeper","Gardien des secrets",2,"leader",16,13,26,7,4,3,"2d12 mag.","Longue","Accumuler du pouvoir, comploter",[["Saisissez votre chance","A","**Dépensez 2 Peur** pour activer **1d4** alliés. Leurs attaques pendant cette activation infligent la moitié des dégâts."],["La volonté du maître","R","Quand vous activez un allié à longue portée, **marquez 1 Stress** pour gagner 1 Peur."],["Rituel d’invocation · Compte à rebours (6)","R","Lancez le compte à rebours la première fois que le Gardien est activé. Chaque fois qu’il marque des PV, réduisez le compte d’autant. Quand il se déclenche, invoquez un Démon mineur qui apparaît à courte portée."],["Chiens des Déchus","R","Une fois par scène, quand le Gardien marque 2 PV ou plus, vous pouvez **marquer 1 Stress** pour invoquer une Meute de chiens démoniaques, qui apparaît à courte portée et est activée immédiatement."]]],["Sellsword","Mercenaire",1,"minion",10,0,0,1,1,3,"3 phys.","Mêlée","Charger, lacérer, submerger",[["Sbire (4)","P","Vaincu dès qu’il subit des dégâts. Tous les 4 dégâts qu’un PJ lui inflige, un autre sbire à portée que l’attaque aurait touché est aussi vaincu."],["Attaque groupée","A","**Dépensez 1 Peur**, choisissez une cible et activez tous les sbires de ce type à courte portée d’elle. Ils se placent au corps à corps et font un seul jet d’attaque commun. En cas de réussite, chacun inflige 3 dégâts physiques ; additionnez-les."]]],["Shambling Zombie","Zombie titubant",1,"standard",10,4,6,4,1,0,"1d6+1 phys.","Mêlée","Dévorer, encercler, déchiqueter",[["Trop nombreux","P","Quand le Zombie est au corps à corps d’une créature et qu’au moins un autre Zombie est à courte portée, toutes les attaques contre cette créature ont l’avantage."],["Horrifiant","P","Les cibles qui marquent des PV à cause des attaques du Zombie marquent aussi 1 Stress."]]],["Shark","Requin",2,"bruiser",14,14,28,7,3,2,"2d12+1 phys.","Très courte","Sentir le sang, isoler, viser les faibles",[["Terrifiant","P","Quand il réussit une attaque, tous les PJ à longue portée perdent 1 Espoir et vous gagnez 1 Peur."],["Morsure déchirante","P","Quand le Requin réussit une attaque, la cible doit marquer une case d’armure sans en tirer d’effet (elle peut quand même utiliser son armure pour réduire les dégâts). Si elle ne peut pas, elle marque 1 PV supplémentaire."],["Du sang dans l’eau","R","Quand une créature à courte portée du Requin marque des PV à cause de l’attaque d’une autre créature, vous pouvez **marquer 1 Stress** pour activer immédiatement le Requin : il se place au corps à corps de la cible et porte une attaque standard."]]],["Siren","Sirène",2,"skulk",14,9,18,5,3,2,"2d6+3 phys.","Mêlée","Dévorer, attirer, chanter",[["Public captif","P","Si la Sirène porte une attaque standard contre une cible Envoûtée par son chant, elle inflige **2d10+1** dégâts au lieu de ses dégâts standards."],["Chant envoûtant","A","**Dépensez 1 Peur** : la Sirène chante et affecte toutes les cibles à courte portée. Elles doivent réussir un jet de réaction d’Instinct ou être Envoûtées jusqu’à ce qu’elles marquent 2 Stress. Les autres Sirènes à courte portée de la cible peuvent chacune **marquer 1 Stress** pour ajouter +1 à la Difficulté du jet. Une cible Envoûtée ne peut pas agir et est Vulnérable."]]],["Skeleton Archer","Squelette archer",1,"ranged",9,4,7,3,2,2,"1d8+1 phys.","Longue","Cribler, faire le mort",[["Opportuniste","P","Quand au moins deux adversaires sont à très courte portée d’une créature, tous les dégâts que l’Archer inflige à cette créature sont doublés."],["Tir mortel","A","Attaque contre une cible Vulnérable à longue portée. En cas de réussite, **marquez 1 Stress** pour infliger **3d4+8** dégâts physiques."]]],["Skeleton Dredge","Squelette rampant",1,"minion",8,0,0,1,1,-1,"1 phys.","Mêlée","S’effondrer, submerger, faire le mort",[["Sbire (4)","P","Vaincu dès qu’il subit des dégâts. Tous les 4 dégâts qu’un PJ lui inflige, un autre sbire à portée que l’attaque aurait touché est aussi vaincu."],["Attaque groupée","A","**Dépensez 1 Peur**, choisissez une cible et activez tous les sbires de ce type à courte portée d’elle. Ils se placent au corps à corps et font un seul jet d’attaque commun. En cas de réussite, chacun inflige 1 dégâts physiques ; additionnez-les."]]],["Skeleton Knight","Chevalier squelette",1,"bruiser",13,7,13,5,2,2,"1d10+2 phys.","Mêlée","Faucher les vivants, semer le chaos",[["Terrifiant","P","Quand il réussit une attaque, tous les PJ à courte portée perdent 1 Espoir et vous gagnez 1 Peur."],["Jusqu’à l’os","A","**Marquez 1 Stress** pour attaquer toutes les cibles à très courte portée. Les cibles touchées subissent **1d8+2** dégâts physiques et marquent 1 Stress."],["Creuser deux tombes","R","Quand le Chevalier est vaincu, il attaque une cible à très courte portée (en priorité celle qui l’a abattu). En cas de réussite, elle subit **1d4+8** dégâts physiques et perd **1d4** Espoir."]]],["Skeleton Warrior","Squelette guerrier",1,"standard",10,4,8,3,2,0,"1d6+2 phys.","Mêlée","Feindre la mort, encercler",[["Que des os","P","Le Guerrier est résistant aux dégâts physiques."],["Ne reste pas mort","R","Quand le Guerrier est vaincu, vous pouvez l’activer et lancer **1d6**. Sur un 6, s’il reste d’autres adversaires sur le champ de bataille, le Guerrier se reforme sans PV marqués."]]],["Spectral Archer","Archer spectral",2,"ranged",13,6,14,3,3,3,"2d10+2 phys.","Longue","Traverser les murs, rester à l’écart",[["Fantôme","P","L’Archer a la résistance aux dégâts physiques. **Marquez 1 Stress** pour se déplacer jusqu’à courte portée à travers les objets solides."],["Choisir sa cible","A","**Dépensez 1 Peur** pour attaquer, à longue portée, un PJ qui se trouve à très courte portée d’au moins deux autres PJ. En cas de réussite, il subit **2d8+12** dégâts physiques."]]],["Spectral Captain","Capitaine spectral",2,"leader",16,13,26,6,4,3,"2d10+3 phys.","Longue","Traverser les murs, rallier",[["Fantôme","P","Le Capitaine a la résistance aux dégâts physiques. **Marquez 1 Stress** pour se déplacer jusqu’à courte portée à travers les objets solides."],["Bataille sans fin","A","**Dépensez 2 Peur** pour ramener au combat jusqu’à **1d4+1** alliés spectraux vaincus, à l’endroit où ils sont apparus (sans PV ni Stress marqués)."],["Tenez bon","R","Quand les alliés spectraux du Capitaine doivent faire un jet de réaction, vous pouvez **marquer 1 Stress** pour leur donner un bonus de +2 à ce jet."],["Élan","R","Quand l’adversaire réussit une attaque contre un PJ, vous gagnez 1 Peur."]]],["Spectral Guardian","Gardien spectral",2,"standard",15,7,15,4,3,1,"2d8+1 phys.","Très courte","Traverser les murs, protéger un trésor",[["Fantôme","P","Le Gardien a la résistance aux dégâts physiques. **Marquez 1 Stress** pour se déplacer jusqu’à courte portée à travers les objets solides."],["Lame funèbre","A","**Dépensez 1 Peur** pour attaquer une cible à très courte portée. En cas de réussite, elle subit **2d10+6** dégâts physiques et marque 1 Stress."]]],["Spellblade","Lame ensorcelée",1,"leader",14,8,14,6,3,3,"1d8+4 phys./mag","Mêlée","Exploser, commander, tenir",[["Acier arcanique","P","Les dégâts de l’attaque standard de la Lame ensorcelée sont à la fois physiques et magiques."],["Salve de suppression","A","**Marquez 1 Stress** et ciblez un groupe à longue portée. Toutes les cibles doivent réussir un jet de réaction d’Agilité ou subir **1d8+2** dégâts magiques. Vous gagnez 1 Peur par cible qui marque des PV."],["Agir en unité","A","**Dépensez 2 Peur** pour activer jusqu’à cinq alliés à longue portée."],["Élan","R","Quand l’adversaire réussit une attaque contre un PJ, vous gagnez 1 Peur."]]],["Spy","Espion",2,"social",15,8,17,4,3,-2,"2d6+3 phys.","Mêlée","Fuir, se déguiser, écouter",[["Collecte de secrets","A","**Dépensez 1 Peur** et décrivez comment l’Espion connaît un secret sur un PJ présent dans la scène."],["Petite souris","R","Quand un PJ ou un groupe parle d’un sujet sensible, vous pouvez **marquer 1 Stress** pour révéler que l’Espion est là et les observe. S’il quitte la scène pour rapporter ce qu’il sait, vous gagnez **1d4** Peur."]]],["Stag Knight","Chevalier cerf",3,"standard",17,19,36,7,5,3,"3d8+3 phys.","Mêlée","Isoler, manœuvrer, protéger la forêt, chasser les intrus",[["Par en haut","P","Quand le Chevalier réussit une attaque standard depuis une position au-dessus de sa cible, il inflige **3d12+3** dégâts physiques au lieu de ses dégâts standards."],["Lame de la forêt","A","**Dépensez 1 Peur** pour attaquer toutes les cibles à très courte portée. Les cibles touchées subissent des dégâts physiques égaux à **3d4** + leur seuil Majeur."],["Armure d’épines","R","Quand le Chevalier subit des dégâts d’une attaque au corps à corps, vous pouvez **marquer 1 Stress** pour infliger **1d10+5** dégâts physiques à l’attaquant."]]],["Stonewraith","Spectre de pierre",2,"skulk",13,11,22,6,3,3,"2d8+6 phys.","Mêlée","Défendre, isoler, traquer",[["Marche-pierre","P","Le Spectre traverse la pierre et la terre aussi facilement que l’air. Tant qu’il est dans la pierre ou la terre, il est Caché et immunisé à tous les dégâts."],["Embuscade rocheuse","A","Tant qu’il est Caché, **marquez 1 Stress** : le Spectre bondit au corps à corps d’une cible à très courte portée. Elle doit réussir un jet de réaction d’Agilité ou d’Instinct (15) ou subir **2d8** dégâts physiques et être temporairement Bloquée."],["Rugissement d’éboulement","A","**Dépensez 1 Peur** : dans une grotte, le Spectre rugit et provoque un éboulement. Toutes les cibles à courte portée doivent réussir un jet de réaction d’Agilité (14) ou subir **2d10** dégâts physiques. Les gravats se dégagent avec un compte à rebours de progression (8)."],["Élan","R","Quand l’adversaire réussit une attaque contre un PJ, vous gagnez 1 Peur."]]],["Swarm of Rats","Essaim de rats",1,"horde",10,6,10,6,2,-3,"1d8+2 phys.","Mêlée","Dévorer, masquer, grouiller",[["Horde (1d4+1)","P","Quand la horde a marqué la moitié de ses PV ou plus, son attaque standard inflige **1d4+1** dégâts physiques à la place."],["En pleine figure","P","Toutes les cibles au corps à corps de l’Essaim ont le désavantage pour attaquer une autre cible que lui."]]],["Sylvan Soldier","Soldat sylvestre",1,"standard",11,6,11,4,2,0,"1d8+1 phys.","Mêlée","Embusquer, se cacher, protéger, pister",[["Tactique de meute","P","Si le Soldat porte une attaque standard et qu’un autre Soldat sylvestre est au corps à corps de la cible, il inflige **1d8+5** dégâts physiques au lieu de ses dégâts standards."],["Maîtrise de la forêt","A","**Dépensez 1 Peur** pour abattre un arbre à courte portée. Une créature frappée par l’arbre doit réussir un jet de réaction d’Agilité (15) ou subir **1d10** dégâts physiques."],["Se fondre","R","Quand le Soldat réussit une attaque, vous pouvez **marquer 1 Stress** pour qu’il devienne Caché jusqu’à sa prochaine attaque ou jusqu’à ce qu’un PJ le repère avec un jet d’Instinct (14) réussi."]]],["Tangle Bramble Swarm","Essaim de ronces",1,"horde",12,6,11,6,3,0,"1d6+3 phys.","Mêlée","Digérer, enchevêtrer, immobiliser",[["Horde (1d4+2)","P","Quand la horde a marqué la moitié de ses PV ou plus, son attaque standard inflige **1d4+2** dégâts physiques à la place."],["Broyer","A","**Marquez 1 Stress** pour infliger **2d6+8** dégâts physiques directs à une cible qui porte au moins 3 jetons de ronce."],["Entraver","R","Quand l’Essaim réussit une attaque, donnez un jeton de ronce à la cible. Une cible avec au moins 1 jeton est Bloquée ; avec 3 jetons ou plus, elle est aussi Vulnérable. Tous les jetons sont retirés par un jet de Finesse réussi (12 + nombre de jetons) ou en infligeant des dégâts Majeurs ou pire à l’Essaim. Si les jetons sont retirés par un jet de Finesse, autant de Ronces étrangleuses (sbires) apparaissent au corps à corps que de jetons retirés."]]],["Tangle Bramble","Ronce étrangleuse",1,"minion",11,0,0,1,1,-1,"2 phys.","Mêlée","Fusionner, drainer, enchevêtrer",[["Sbire (4)","P","Vaincu dès qu’il subit des dégâts. Tous les 4 dégâts qu’un PJ lui inflige, un autre sbire à portée que l’attaque aurait touché est aussi vaincu."],["Attaque groupée","A","**Dépensez 1 Peur**, choisissez une cible et activez tous les sbires de ce type à courte portée d’elle. Ils se placent au corps à corps et font un seul jet d’attaque commun. En cas de réussite, chacun inflige 2 dégâts physiques ; additionnez-les."],["Drainer et proliférer","R","Quand une attaque de la Ronce fait marquer des PV à une cible et qu’au moins trois Ronces étrangleuses (sbires) sont à courte portée, vous pouvez les fusionner en une horde d’Essaim de ronces. Ses PV sont égaux au nombre de sbires fusionnés."]]],["Tiny Green Ooze","Petite gelée verte",1,"skulk",14,4,0,2,1,-1,"1d4+1 mag.","Mêlée","Se camoufler, s’approcher",[["Corps acide","P","Quand la Gelée réussit une attaque, la cible doit marquer une case d’armure sans en tirer d’effet (elle peut quand même utiliser son armure pour réduire les dégâts). Si elle ne peut pas, elle marque 1 PV supplémentaire."]]],["Tiny Red Ooze","Petite gelée rouge",1,"skulk",11,5,0,2,1,-1,"1d4+2 mag.","Mêlée","Brûler, se camoufler",[["Brûlante","R","Quand une créature au corps à corps inflige des dégâts à la Gelée, elle subit **1d6** dégâts magiques directs."]]],["Treant Sapling","Pousse de sylvanien",3,"minion",14,0,0,1,1,0,"8 phys.","Mêlée","Se fondre, préserver la forêt, frapper, encercler",[["Sbire (6)","P","Vaincu dès qu’il subit des dégâts. Tous les 6 dégâts qu’un PJ lui inflige, un autre sbire à portée que l’attaque aurait touché est aussi vaincu."],["Attaque groupée","A","**Dépensez 1 Peur**, choisissez une cible et activez tous les sbires de ce type à courte portée d’elle. Ils se placent au corps à corps et font un seul jet d’attaque commun. En cas de réussite, chacun inflige 8 dégâts physiques ; additionnez-les."]]],["Vampire","Vampire",3,"standard",16,18,35,5,4,3,"3d8 phys.","Mêlée","Mordre, charmer, tromper, se nourrir, intimider",[["Morsure drainante","A","Attaque contre une cible au corps à corps. En cas de réussite, elle subit **5d4** dégâts physiques. Si elle marque des PV, elle perd 1 Espoir et marque 1 Stress, et le Vampire récupère 1 PV."],["Forme de brume","R","Quand le Vampire subit des dégâts physiques, vous pouvez **dépenser 1 Peur** pour qu’il n’en subisse que la moitié."]]],["Vault Guardian Gaoler","Gardien du caveau geôlier",3,"support",16,19,33,5,3,2,"3d6+2 phys.","Très courte","Emporter, piéger, protéger, marteler",[["Bouclier bloquant","P","Les créatures au corps à corps du Geôlier ont le désavantage à leurs jets d’attaque contre lui. Les créatures enfermées à l’intérieur ne sont pas concernées."],["Enfermer","A","**Marquez 1 Stress** pour attaquer une cible à très courte portée. En cas de réussite, elle est Bloquée à l’intérieur du Geôlier jusqu’à ce qu’elle se libère avec un jet de Force (18) réussi. Tant qu’elle est enfermée, elle ne peut attaquer que le Geôlier."]]],["Vault Guardian Sentinel","Sentinelle gardienne du caveau",3,"bruiser",17,21,40,6,3,3,"2d12+1 phys.","Très courte","Détruire à tout prix, expulser, protéger",[["Impact cinétique","P","Les cibles qui subissent des dégâts de l’attaque standard de la Sentinelle sont repoussées à très courte portée."],["Acculer","A","**Marquez 1 Stress** et choisissez une cible à très courte portée sur laquelle la Sentinelle se concentre. Cette cible a le désavantage à ses jets d’attaque tant qu’elle est à très courte portée de la Sentinelle. Une seule cible à la fois."],["Trait de mana","A","**Dépensez 1 Peur** pour projeter une magie explosive sur un point à longue portée. Toutes les cibles à très courte portée de ce point font un jet de réaction d’Agilité. En cas d’échec, elles subissent **2d8+20** dégâts magiques et sont repoussées à courte portée ; en cas de réussite, la moitié des dégâts, sans recul."],["Élan","R","Quand l’adversaire réussit une attaque contre un PJ, vous gagnez 1 Peur."]]],["Vault Guardian Turret","Tourelle gardienne du caveau",3,"ranged",16,20,32,5,4,3,"3d10+3 mag.","Longue","Concentrer le tir, verrouiller, marquer, protéger",[["Tir lent","P","Quand vous activez la Tourelle et qu’elle n’a pas de jeton sur sa fiche, elle ne peut pas porter d’attaque standard : placez un jeton et décrivez ce qu’elle prépare. Quand vous l’activez et qu’elle a un jeton, retirez-le : elle peut attaquer."],["Marquer la cible","A","**Dépensez 1 Peur** pour Marquer une cible à longue portée jusqu’à la destruction de la Tourelle ou jusqu’à ce que la cible devienne Cachée. Tant qu’elle est Marquée, son Esquive est divisée par deux."],["Tir concentré","R","Quand un autre adversaire inflige des dégâts à une cible à longue portée de la Tourelle, vous pouvez **marquer 1 Stress** pour ajouter les dégâts de l’attaque standard de la Tourelle au jet de dégâts."],["Détonation","R","Quand la Tourelle est détruite, elle explose. Toutes les cibles à courte portée font un jet de réaction d’Agilité. En cas d’échec, elles subissent **3d20** dégâts physiques ; en cas de réussite, la moitié."]]],["Volcanic Dragon: Ashen Tyrant","Dragon volcanique : Tyran de cendres",4,"solo",18,29,55,8,5,10,"4d12+15 phys.","Courte","Étouffer, voler, intimider, tuer ou mourir",[["Implacable (4)","P","Peut être activé jusqu’à 4 fois par tour du MJ. Dépensez de la Peur comme d’habitude pour l’activer."],["Acculé","P","**Marquez 1 Stress** au lieu de dépenser 1 Peur pour activer le Tyran de cendres."],["Ailes blessées","P","En vol, le Tyran a un bonus de +1 à sa Difficulté."],["Tu retourneras en cendres","P","Quand un PJ à courte portée du Tyran obtient un échec, il perd 1 Espoir et vous gagnez 1 Peur. S’il ne peut pas perdre d’Espoir, il marque 1 PV."],["Saccage désespéré","A","**Marquez 1 Stress** pour attaquer toutes les cibles à courte portée. Les cibles touchées subissent **2d20+2** dégâts physiques, sont projetées à courte portée de leur position et marquent 1 Stress."],["Nuage de cendres","A","**Dépensez 1 Peur** : le Tyran frappe le sol et soulève des cendres à longue portée. Dans le nuage, une cible a le désavantage à ses jets d’action. Le nuage se dissipe à la prochaine activation d’un adversaire."],["Convulsions apocalyptiques · Compte à rebours (1d12)","A","**Dépensez 1 Peur** pour lancer le compte à rebours. Il diminue chaque fois qu’un PJ obtient un résultat avec Peur. Quand il se déclenche, le Tyran se débat et provoque des dégâts environnementaux (séisme, avalanche, murs qui s’effondrent…). Toutes les cibles à longue portée font un jet de réaction de Force. En cas d’échec, **2d10+ async function mdPrep(f){/* redresse, agrandit et contraste la photo pour une meilleure lecture */
 const bm=await createImageBitmap(f,{imageOrientation:"from-image"}).catch(()=>null);if(!bm)return f;const W=Math.min(2400,Math.max(1600,bm.width)),r=W/bm.width,c=document.createElement("canvas");c.width=W;c.height=Math.round(bm.height*r);const g=c.getContext("2d");g.drawImage(bm,0,0,c.width,c.height);
 const d=g.getImageData(0,0,c.width,c.height),a=d.data,hist=new Uint32Array(256);for(let i=0;i<a.length;i+=4){const y=(a[i]*299+a[i+1]*587+a[i+2]*114)/1000|0;a[i]=y;hist[y]++}
 let lo=0,hi=255,acc=0,tot=a.length/4;for(;lo<255;lo++){acc+=hist[lo];if(acc>tot*.02)break}acc=0;for(;hi>0;hi--){acc+=hist[hi];if(acc>tot*.02)break}const k=255/Math.max(1,hi-lo);
 for(let i=0;i<a.length;i+=4){const y=Math.max(0,Math.min(255,(a[i]-lo)*k));a[i]=a[i+1]=a[i+2]=y}g.putImageData(d,0,0);return c}
async function mdOcr(inp){const f=inp.files&&inp.files[0];if(!f)return;const st=document.getElementById("mdocr");const say=x=>{const e=document.getElementById("mdocr");if(e)e.textContent=x};say("Préparation de la photo…");

  const img=await mdPrep(f);const r=await Tesseract.recognize(img,"fra+eng",{logger:m=>{if(m.status==="recognizing text")say("Lecture de la page : "+Math.round(m.progress*100)+" %")}});

 <div class="flexgap" style="margin-top:10px"><button class="btn pri" data-act="mdsave">Enregistrer dans le bestiaire</button><button class="btn" data-act="mdenc">Ajouter directement à la rencontre</button><button class="btn sm" data-act="mdreset">Vider</button></div>
 ${mine.length?`<h3 style="margin-top:14px">Mes créations (${mine.length})</h3>${mine.map(m=>`<div class="flexgap" style="justify-content:space-between;border-top:1px solid var(--line,#333);padding:6px 0"><span><b>${esc(m.name)}</b> <span class="chip">Rang ${m.tier}</span> <span class="chip">${BEST_TYPES[m.type]||m.type}</span></span><span class="flexgap"><button class="btn sm" data-act="mdedit" data-k="${m.id}">Modifier</button><button class="btn sm danger" data-act="mddel" data-k="${m.id}">✕</button></span></div>`).join("")}`:""}</section>`}

const ADV_X={"Acid Burrower":["Griffes","Perception des vibrations +2","Un insecte fouisseur de la taille d’un cheval, carapace luisante et griffes taillées pour creuser. Il sent les vibrations du sol, surgit sous ses proies puis les entraîne dans ses galeries. Son sang acide ronge les armes et les armures de ceux qui le blessent de près."],"Adult Flickerfly":["Coup d’aile","","Un insecte géant grand comme une maison, couvert d’écailles irisées qui changent de couleur à chaque battement d’ailes, trop rapides pour l’œil. Il collectionne tout ce qui brille et défend son nid avec acharnement. Son souffle provoque des hallucinations qui sèment la panique dans un groupe."],"Apprentice Assassin":["Dague de lancer","Infiltration +2","Un jeune apprenti de la guilde, encore maladroit mais pressé de faire ses preuves. Il prend des risques inutiles pour impressionner ses maîtres et frappe toujours en groupe. Parfait pour accompagner un assassin plus expérimenté."],"Arch-Necromancer":["Décharge nécrotique","Savoir interdit +3, Sagesse des siècles +3","Un mage en décomposition drapé de robes sombres en lambeaux, la peau collée aux os. Il commande des légions de morts et revient toujours, même après une défaite. Il fuit dès que le combat tourne mal pour mieux préparer sa revanche."],"Archer Guard":["Arc long","Connaissance des lieux +3","Un grand garde au service d’une ville, arc long à la main et flèches empennées aux couleurs de la cité. Il reste à distance, derrière les murs ou les gardes en armure. Il tire pour immobiliser plutôt que pour tuer."],"Archer Squadron":["Arc long","","Un groupe d’archers entraînés qui avancent en formation serrée, armés d’arcs immenses. Ils couvrent une zone entière de flèches et rendent toute approche dangereuse. Les séparer est la meilleure façon de les vaincre."],"Assassin Poisoner":["Dague de lancer empoisonnée","Infiltration +2","Un fourbe rusé, expert en poisons comme en embuscades, toujours payé d’avance. Il frappe depuis l’ombre, enduit ses lames de venin et disparaît dans un nuage de fumée. Ses cibles se croient en sécurité jusqu’au dernier moment."],"Battle Box":["Coup puissant","Camouflage +2","Une créature artificielle en forme de cube, gravée d’une rune différente sur chacune de ses six faces. Elle change de tactique à chaque tour en roulant sur une nouvelle face, imprévisible. Quand elle est détruite, elle explose dans un dernier fracas."],"Bear":["Griffes","Embuscade +3, Sens aiguisés +2","Un grand ours à l’épaisse fourrure et aux griffes puissantes, dangereux dès qu’on approche de son territoire ou de ses petits. Il charge, renverse et broie ses adversaires. Blessé, il devient encore plus féroce."],"Bladed Guard":["Épée longue","Connaissance des lieux +3","Un garde en armure, épée et bouclier peints aux couleurs de la ville. Il tient une position, protège les passages et ses alliés derrière lui. Discipliné, il appelle des renforts dès que la situation dégénère."],"Brawny Zombie":["Coup puissant","Dégâts collatéraux +2, Lancer +4","Un grand cadavre gonflé par la pourriture, aux muscles encore puissants sous la chair morte. Il avance en titubant mais frappe avec une force terrible et agrippe ses victimes. Plus lent que les vivants, il ne se fatigue jamais."],"Cave Ogre":["Massue","Lancer +2","Un humanoïde massif qui vit dans les grottes et voit en tout être pensant un repas. Il frappe avec une massue ou ses poings, projetant ses ennemis contre les parois. Pas très malin, il peut être berné, mais jamais intimidé."],"Chaos Skull":["Décharge d’énergie","","Un crâne humain flottant, animé par une magie scintillante qui crépite autour de lui. Il ricane, se nourrit de magie et vole l’énergie des lanceurs de sorts. Insaisissable, il flotte hors de portée des épées."],"Conscript":["Lances","","Un civil mal formé, enrôlé de force dans une guerre qui n’est pas la sienne. Seul il fuit vite, mais en nombre il encercle et submerge. Idéal pour montrer le coût humain d’un conflit."],"Construct":["Coup de poing","","Un être vaguement humain de pierre et d’acier, assemblé et animé par magie pour une seule tâche. Il obéit sans réfléchir, piétine tout sur son passage et encaisse énormément. Il ne s’arrête que lorsque son ordre est accompli ou qu’il est en pièces."],"Courtesan":["Dague","Manipulation +3, Mondanités +3","Une manipulatrice accomplie, maîtresse des arts mondains et des confidences sur l’oreiller. Elle séduit, déstabilise et sait toujours qui protège qui. Une alliée précieuse ou une ennemie redoutable dans une intrigue de cour."],"Courtier":["Dagues","Mondanités +3","Un mondain ambitieux, vêtu avec ostentation, qui vit de rumeurs et de faveurs. Il humilie en public, trahit en privé et cherche toujours un meilleur protecteur. Ses mots blessent plus que ses armes."],"Cult Adept":["Sceptre runique","Savoir des Déchus +2, Rituels +2","Un mage aguerri du culte, qui manie l’ombre et la peur comme d’autres l’épée. Il protège ses fidèles, enchaîne ses ennemis dans les ténèbres et se nourrit de leur terreur. Il cherche à percer les secrets qui le rapprocheront de ses dieux."],"Cult Fang":["Long couteau","","Un tueur professionnel devenu adepte du culte, rapide et silencieux. Il marche sur les murs, saute d’ombre en ombre et isole les traînards pour les capturer. Il rêve de monter en grade en offrant des victimes."],"Cult Initiate":["Dague rituelle","","Un sectateur de bas rang en robe simple, avide de pouvoir et prêt à tout pour être remarqué. Seul, il ne pèse pas lourd ; en groupe, il entoure et harcèle. Il obéit aveuglément aux adeptes."],"Deeproot Defender":["Lianes","Immense +3","Un costaud fait de racines et de végétaux, aux lianes qui agrippent et serrent. Il protège la forêt et entraîne les intrus vers le sol. Lent mais tenace, il ne lâche jamais une prise."],"Demon of Avarice":["Gueule affamée","Manipulation +3","Une monstruosité royale encapuchonnée, aux cornes enroulées couvertes de bijoux volés. Elle attise la cupidité, achète les loyautés et sème la discorde dans un groupe. On peut la combattre en lui jetant de l’or… à ses risques."],"Demon of Despair":["Trait de miasme","Manipulation +3","Un démon encapuchonné aux longs membres, d’où suintent des ombres glacées. Il reste en retrait et sape le moral, transformant chaque échec en désespoir collectif. Contre lui, l’Espoir devient une arme précieuse."],"Demon of Hubris":["Lance parfaite","Manipulation +2","Un démon d’une beauté parfaite et d’une cruauté infinie, lance brillante et robes élégantes. Il méprise ses adversaires, crie victoire trop tôt et cherche à prouver sa supériorité. Son orgueil est aussi sa faille."],"Demon of Jealousy":["Assaut psychique","Manipulation +3","Une créature capricieuse aux membres grêles et aux désirs insatiables. Elle profite des succès des autres, vole leurs avantages et garde rancune pour toujours. Elle s’attaque d’abord au héros qui brille le plus."],"Demon of Wrath":["Poings","Intimidation +2","Un démon colossal aux poings gros comme des rochers, mû par une rage sans fin. Il attise la colère, impressionne et ravage tout ce qui l’entoure. Le frapper de près déclenche ses représailles immédiates."],"Demonic Hound Pack":["Griffes et crocs","Pistage à l’odeur +3","Une meute de chiens contre nature, éclairés de l’intérieur par un feu infernal. Leur hurlement glace le sang et fait vaciller les plus braves. Ils servent souvent un démon ou un culte."],"Dire Bat":["Griffes et dents","Assoiffée de sang +3","Une chauve-souris aux ailes immenses, fidèle à jamais à son maître vampire. Elle pique depuis l’obscurité, pousse des cris assourdissants et s’interpose pour protéger son maître."],"Dire Wolf":["Griffes","Sens aiguisés +3","Un grand loup aux crocs menaçants, rarement seul. Il chasse en meute, encercle sa proie et la mord aux jarrets pour l’abattre. Là où il y en a un, d’autres rôdent."],"Dryad":["Arc court de bois mort","Savoir sylvestre +4","Un esprit de la nature à forme d’arbre humanoïde, gardienne d’une forêt ancienne. Elle fait pousser des ronces, réveille de jeunes sylvaniens et se régénère quand ses alliés tombent. Elle chasse sans pitié ceux qui abîment son domaine."],"Electric Eels":["Morsure électrique","","Un banc d’anguilles qui encerclent et électrocutent tout ce qui entre dans leur eau. Elles fuient les gros prédateurs mais n’hésitent pas devant un nageur imprudent. Chaque décharge nourrit la peur."],"Elemental Spark":["Jets de feu","","Une étincelle ardente de feu élémentaire, vive et instable. Elle explose, consume et grossit au contact des flammes. Rarement seule, elle accompagne de plus grands élémentaires."],"Elite Soldier":["Lance","","Un écuyer en armure ou un roturier aguerri qui veut monter en grade. Discipliné et loyal, il rejoint ses alliés pour attaquer ensemble et se jette devant son seigneur pour le protéger."],"Failed Experiment":["Morsure et griffes","Imitation +3","Une expérience nécromantique ratée, tordue et maladroite, faite de morceaux mal assemblés. Affamée, elle piste ses proies et submerge celles qui sont entourées. Sa chair difforme encaisse les coups."],"Fallen Shock Troop":["Hache maudite","","Une âme maudite, liée à la volonté des Dieux déchus et envoyée en première ligne. Ces troupes écrasent leurs ennemis par le nombre et répandent une aura qui fait perdre espoir."],"Fallen Sorcerer":["Bâton corrompu","Savoir ancien +2","Un mage puissant, enchaîné par les pactes conclus de son vivant. Il domine, tourmente et enferme ses ennemis dans leurs pires cauchemars. Insaisissable, il se téléporte dès qu’on le touche."],"Fallen Warlord: Realm-Breaker":["Fouet barbelé","Conquête +3, Histoire +2, Intimidation +3","Un dieu déchu drapé de rage et de rancœur, qui brise depuis des millénaires le courage des héros. Son armure brûle de haine et son fouet fauche tout autour de lui. C’est la première phase d’un combat final."],"Fallen Warlord: Undefeated Champion":["Épée brise-cœur","Conquête +3, Histoire +2, Intimidation +3","Ce que seuls les êtres les plus redoutés ont l’occasion de redouter : la forme invaincue du seigneur déchu. Il invoque des légions sans fin et corrompt le sol autour de lui. La seconde phase d’un combat final."],"Giant Beastmaster":["Arc long","Dressage +3","Un guerrier géant vêtu de cuir, armé d’un fouet et d’un arc immense, entouré de ses bêtes. Il commande et protège sa ménagerie, agissant en même temps qu’elle. Le séparer de ses animaux affaiblit tout le groupe."],"Giant Brawler":["Marteau de guerre","Infiltration +2","Un géant particulièrement musclé, armé d’un marteau plus grand qu’un humain. Il gagne sa vie en cognant, renverse ses adversaires et brise les obstacles d’un coup d’épaule."],"Giant Eagle":["Serres et bec","","Un rapace géant aux serres tachées de sang. Il fond sur ses proies depuis le ciel, les emporte dans les airs puis les lâche de très haut. Difficile à atteindre tant qu’il vole."],"Giant Mosquitoes":["Trompe","Camouflage +2","Des dizaines de moustiques gros comme le poing, qui volent en nuée pour se protéger. Ils piquent, boivent le sang et vident leurs proies de leurs forces."],"Giant Rat":["Griffes","Sens aiguisés +3","Un rongeur de la taille d’un chat, doué pour fouiller les poubelles et survivre partout. Seul il est une nuisance ; en nombre, il devient un vrai danger dans les égouts et les caves."],"Giant Recruit":["Marteau de guerre","","Un combattant géant dans une armure empruntée, trop petite pour lui. Peu expérimenté, il compense par sa taille et sa force. Il accompagne souvent des géants plus aguerris."],"Giant Scorpion":["Pinces","Camouflage +2","Un arachnide de taille humaine, aux pinces déchirantes et à la queue venimeuse. Il saisit sa proie, la pique et l’emporte dans son terrier. Ses piqûres affaiblissent durablement."],"Glass Snake":["Crocs de verre","","Un serpent transparent à la tête énorme, qui laisse derrière lui une traînée d’éclats de verre. Ses écailles tranchent ceux qui le frappent de près, et il crache des éclats en cône."],"Gorgon":["Arc court brûle-soleil","Discrétion +3","Un humanoïde écailleux à tête de serpents, armé d’un arc doré, furieux qu’on trouble sa paix. Ses flèches font briller ses cibles et son regard pétrifie qui ose le défier."],"Greater Earth Elemental":["Poing de roc","","Un glissement de terre vivant, fait de rochers et de poussière, grand comme une maison. Lent mais inébranlable, il martèle ses ennemis et ensevelit le terrain sous les éboulis."],"Greater Water Elemental":["Vague déferlante","","Une vague vivante immense qui s’abat sur ses ennemis. Elle disperse les groupes, renverse et noie ceux qu’elle enveloppe. Redoutable près d’une rivière ou d’une côte."],"Green Ooze":["Pseudopode","Camouflage +3","Un monticule mouvant de gelée verte translucide qui dissout tout ce qu’il touche. Il se camoufle, approche sans bruit et enveloppe ses victimes. Trop blessé, il se divise en deux."],"Hallowed Archer":["Arc long sanctifié","","Des soldats esprits aux arcs consacrés, au service d’une armée divine. Ils obéissent, se replacent et punissent avec férocité ceux que leur chef a déclarés coupables."],"Hallowed Soldier":["Épée et bouclier","","Des âmes de fidèles, élevées et armées d’armes divines. Elles volent en formation, débordent les lignes ennemies et submergent les impies par le nombre."],"Harrier":["Javeline","Camouflage +2","Un combattant agile armé de javelots, qui harcèle et ne reste jamais au contact. Il frappe puis se replie, attirant ses ennemis hors de leur position."],"Head Guard":["Masse d’armes","Commandement +2, Connaissance des lieux +2","Un garde chevronné, avec une masse, un sifflet et une voix tonitruante. Il coordonne ses hommes, appelle des renforts et ne lâche jamais une poursuite."],"Head Vampire":["Rapière","Aristocrate +3","Un mort-vivant captivant, vêtu d’atours aristocratiques. Il charme d’un regard, se nourrit de ses fidèles et lance la chasse avec sa progéniture. Le combattre, c’est affronter tout son clan."],"High Seraph":["Épée sainte","Savoir divin +3","Un champion divin, à la tête d’une armée sacrée qui impose la volonté de son dieu. Il juge, déclare ses ennemis coupables et fait pleuvoir des rayons de lumière divine."],"Huge Green Ooze":["Pseudopode","Se fondre dans le décor +3","Un monticule d’acide vert translucide, plus haut que la plupart des humains. Il engloutit ses proies et les dissout lentement. Blessé, il se scinde en gelées plus petites."],"Hydra":["Morsure","","Une bête écailleuse à quatre pattes, aux multiples têtes sur de longs cous, toutes hérissées de crocs. Couper une tête en fait repousser deux, et chaque tête attaque. La magie est sa faiblesse."],"Jagged Knife Bandit":["Dagues","Voleur +2","Un criminel rusé en cape, armé d’un des fameux couteaux dentelés de la bande. Il attaque en groupe, vole ce qu’il peut et fuit dans la fumée quand le vent tourne."],"Jagged Knife Hexer":["Bâton","Savoir magique +2","Un bandit au bâton, cape couverte de babioles magiques, qui harcèle ses ennemis de malédictions. Il reste à l’arrière et soutient ses complices par ses sortilèges."],"Jagged Knife Kneebreaker":["Massue","Voleur +2, Menaces voilées +3","Un cogneur imposant de la bande, armé d’un gros gourdin. Il immobilise les victimes pendant que les autres les dépouillent, et brise les genoux de ceux qui résistent."],"Jagged Knife Lackey":["Dagues","Voleur +2","Un voleur en habits simples, petites dagues en main, pressé de faire ses preuves auprès de la bande. Faible seul, il attaque en nombre et fuit au premier revers."],"Jagged Knife Lieutenant":["Javeline","Connaissance des lieux +2","Un bandit chevronné en cuir de qualité, à la voix forte et au regard rusé. Il dirige les attaques, envoie ses hommes au bon endroit et négocie quand il le faut."],"Jagged Knife Shadow":["Dagues","Infiltration +3","Un fourbe agile au couteau cruel, qui isole ses cibles grâce à la magie des ombres. Il frappe là où on ne l’attend pas et disparaît aussitôt."],"Jagged Knife Sniper":["Arc court","Discrétion +2","Un bandit dégingandé qui tire à l’arc court depuis un abri. Il vise les isolés et les lanceurs de sorts, et change de cachette après chaque tir."],"Juvenile Flickerfly":["Coup d’aile","","Un insecte de la taille d’un cheval, aux écailles irisées et aux ailes de cristal trop rapides pour l’œil. Il collectionne les objets brillants et éblouit ses ennemis par sa danse."],"Knight of the Realm":["Épée longue","Savoir ancien +3, Haute société +2, Tactique +2","Un soldat décoré, en armure lourde, sur un puissant destrier. Il charge à travers les lignes, galvanise ses alliés et cherche la gloire au service de son royaume."],"Kraken":["Tentacules","Nage +3","Une bête légendaire des mers, plus grande que le plus grand galion, aux tentacules à ventouses et à la gueule terrifiante. Il saisit les marins, les entraîne sous l’eau et broie les coques. Un combat contre lui est une scène à part entière."],"Masked Thief":["Épée à un tranchant","Acrobaties +3","Un voleur rusé et acrobate, au goût prononcé pour la mise en scène. Il chaparde en pleine foule, se cache et a toujours un plan d’évasion préparé à l’avance."],"Master Assassin":["Dague dentelée","Commandement +3, Infiltration +3","Un tueur chevronné à la voix menaçante et à la lame mortelle. Il prépare tout, frappe caché et coordonne d’autres assassins pour une attaque parfaite."],"Merchant Baron":["Rapière","Noblesse +2, Commerce +2","Un marchand accompli, à la tête d’une grande entreprise et d’une armée de gros bras. Il abuse de son pouvoir, achète les gens et mobilise ses hommes dès qu’on le menace."],"Merchant":["Massue","Négociateur rusé +3","Un négociant bien habillé, à l’œil aiguisé pour le profit. Il marchande, cherche les bonnes affaires et peut devenir un allié précieux ou un témoin gênant."],"Minor Chaos Elemental":["Décharge de distorsion","","Une masse scintillante de magie incontrôlable, qui change de forme sans cesse. Elle déforme la réalité autour d’elle et rend les sorts imprévisibles."],"Minor Demon":["Griffes","","Une créature écarlate venue des Cercles inférieurs, dévorée de rage contre tous les mortels. Elle attaque sans relâche et sert souvent un démon ou un culte plus puissant."],"Minor Fire Elemental":["Décharge élémentaire","","Une flamme vivante de la taille d’un grand feu de camp. Elle embrase tout ce qu’elle touche et grandit au contact du combustible."],"Minor Treant":["Branche griffue","","Un jeune arbre qui marche, dressé pour défendre sa forêt. Seul il est fragile, mais ces sylvaniens arrivent toujours en nombre autour d’un gardien plus ancien."],"Minotaur Wrecker":["Hache de bataille","Orientation +2","Un firbolg massif à tête de taureau, au tempérament explosif. Il encorne, écrase et poursuit sans relâche, chargeant à travers les groupes."],"Monarch":["Marteau de guerre","Histoire +3, Noblesse +3","Le souverain d’une nation, drapé dans les privilèges de la tradition, au pouvoir sans égal sur son domaine. Il contrôle ses vassaux, élimine ses rivaux et peut condamner tout un groupe d’un seul mot."],"Mortal Hunter":["Arracher la chair","Limier +3","Un mort-vivant en lourd manteau de cuir, au regard scrutateur et à la cruauté désinvolte. Il traque sa proie sans fin, terrifie et maudit ceux qu’il a marqués."],"Oak Treant":["Branche","Savoir sylvestre +3","Un vieil arbre robuste et animé, que l’on prend pour un arbre ordinaire jusqu’à ce qu’il frappe. Il s’enracine pour tenir sa position et fait pleuvoir des graines sur ses ennemis."],"Oracle of Doom":["Attaque psychique","Savoir sans limites +4","Un immortel gigantesque, incarnation du destin, condamné à ne voir que les malheurs à venir. Il connaît les cauchemars de chacun, prononce des destins funestes et invoque des tourmenteurs."],"Outer Realms Abomination":["Pseudopode massif","","Une parodie chaotique de la vie, en mutation permanente, venue des Royaumes extérieurs. Sa forme irréelle encaisse les coups et sa présence fait trembler la réalité."],"Outer Realms Corruptor":["Pseudopode corrosif","","Une masse informe et changeante, comme faite de lumière chromatique. Son toucher brise la volonté et elle projette des fragments de mondes qu’elle a dévorés."],"Outer Realms Thrall":["Griffes et dents","","Une forme vaguement humaine, vidée de sa mémoire et de son identité. Ces esclaves avancent en masse, désorientent et terrifient ceux qui les croisent."],"Patchwork Zombie Hulk":["Trop de bras","Intimidation +2, Tout mettre en pièces +2","Un amas de cadavres géant qui bouge comme un seul corps, aux membres gros comme des torses. Il écrase tout et arrache des morceaux de lui-même pour les lancer."],"Perfected Zombie":["Grande hache","","Un zombie immense et musclé, à la force et à l’adresse renforcées par la magie. Sa présence est si effroyable qu’on ne peut puiser dans l’Espoir contre lui."],"Petty Noble":["Rapière","Aristocrate +3","Un aristocrate richement paré, gonflé d’orgueil. Il exige, menace et fait appel à sa garde dès que ses privilèges sont contestés."],"Pirate Captain":["Sabre d’abordage","Commandement +2, Marin +3","Un loup de mer charismatique au chapeau impressionnant, avide de pillages. Il galvanise son équipage, mène l’abordage et ne recule devant aucune ruse."],"Pirate Raiders":["Sabre d’abordage","Marin +3","Des forbans des mers qui ravagent tout en meute. Ils abordent, pillent et submergent leurs ennemis par le nombre."],"Pirate Tough":["Poings massifs","Marin +2","Un pirate massif et tatoué, aux poings gros comme des melons. Il ouvre la voie pendant l’abordage et assomme ceux qui résistent."],"Red Ooze":["Pseudopode","Camouflage +3","Un monticule mouvant de gelée rouge translucide et enflammée. Il brûle tout ce qu’il enveloppe et met le feu autour de lui. Blessé, il se divise."],"Rotted Zombie":["Morsure","","Un cadavre en décomposition qui avance vers sa proie. Seul il est lent et faible ; en nombre, il encercle et dévore."],"Royal Advisor":["Baguette","Administration +3, Courtisan +3","Un courtisan de haut rang qui a l’oreille de la noblesse locale. Il souffle des idées aux puissants, fabrique des preuves et trouve toujours un bouc émissaire."],"Secret-Keeper":["Bâton couvert de sceaux","Coercition +2, Savoir des Déchus +2","Un chef clandestin en lien direct avec les Dieux déchus. Il accumule le pouvoir, active ses fidèles au bon moment et prépare un rituel d’invocation démoniaque."],"Sellsword":["Épée longue","","Un mercenaire armé qui tente sa chance auprès du plus offrant. Il combat bien en groupe mais change de camp si la paie est meilleure ailleurs."],"Shambling Zombie":["Morsure","","Un cadavre animé à la démarche hésitante, mû par la seule faim. Il agrippe ses proies et ne lâche plus prise."],"Shark":["Gueule dentue","Odorat +3","Un grand prédateur marin, toujours en mouvement. Il sent le sang de loin, isole les blessés et déchire les armures de ses mâchoires."],"Siren":["Morsure de mâchoire distendue","Répertoire de chants +3","Un être mi-humain mi-poisson, aux écailles chatoyantes et à la voix irrésistible. Son chant envoûte les marins et les attire vers les profondeurs."],"Skeleton Archer":["Arc court","","Un squelette fragile, armé d’un arc court. Il tire depuis l’arrière, protégé par d’autres morts-vivants."],"Skeleton Dredge":["Griffes d’os","","Un tas d’os qui s’entrechoquent et se relève sans cesse. Faible seul, il submerge par le nombre."],"Skeleton Knight":["Grande épée rouillée","","Un grand squelette en armure, armé d’une lame immense. Il commande les autres squelettes et frappe avec une force terrible."],"Skeleton Warrior":["Épée","","Un squelette couvert de terre, armé d’une lame rouillée. Il garde les cryptes et les ruines, et revient souvent après avoir été abattu."],"Spectral Archer":["Arc long","Savoir ancien +2","Un combattant fantôme à l’arc éthéré, qui ne peut partir tant que son protégé est en danger. Il traverse les murs et vise ceux qui sont encerclés."],"Spectral Captain":["Arc long","Savoir ancien +3","Un commandant fantôme qui mène ses troupes au-delà de la mort. Il ramène ses soldats tombés au combat et les aide à tenir bon."],"Spectral Guardian":["Lance","Savoir ancien +2","Un combattant fantôme armé de lances et d’épées, retenu par le devoir. Il protège un trésor ou un lieu sacré et traverse les murs pour surprendre les intrus."],"Spellblade":["Épée longue enchantée","Savoir magique +2","Un mercenaire qui mêle escrime et magie avec une efficacité mortelle. Il enchante sa lame et frappe à distance comme au contact."],"Spy":["Dague","Espionnage +3","Un agent d’espionnage doué pour se trouver au bon endroit pour surprendre les secrets. Il se déguise, écoute et revend ce qu’il apprend au plus offrant."],"Stag Knight":["Épée de ronces","Savoir sylvestre +3","Un chevalier aux bois de cerf majestueux, en armure d’épines dangereuses. Il protège la forêt, frappe depuis les hauteurs et blesse ceux qui le touchent."],"Stonewraith":["Morsure et griffes","Sens de la pierre +3","Un chasseur rôdeur au corps de pierre gris ardoise, comme un puma qui se faufile. Il traverse la roche, surgit des parois et provoque des éboulements."],"Swarm of Rats":["Griffes","","Une masse grouillante de rats ordinaires qui déferle comme une vague affamée. Ils recouvrent leurs victimes et les rongent jusqu’à l’os."],"Sylvan Soldier":["Faux","Pistage +2","Un guerrier féerique en armure de feuilles et d’écorce. Il défend son bois sacré, frappe vite et disparaît entre les arbres."],"Tangle Bramble Swarm":["Épines","Camouflage +2","Un groupe de buissons roulants animés, buveurs de sang, chacun gros comme une courge. Ils roulent vers leurs proies, les enlacent et boivent leur sang."],"Tangle Bramble":["Épines","","Un buisson roulant animé, buveur de sang. Il agrippe les chevilles et s’accroche à sa victime."],"Tiny Green Ooze":["Pseudopode","","Un petit monticule mouvant de gelée verte translucide, né d’une plus grosse gelée. Il ronge ce qu’il touche."],"Tiny Red Ooze":["Pseudopode","","Un petit monticule mouvant de gelée rouge translucide et enflammée, né d’une plus grosse gelée. Il brûle ce qu’il touche."],"Treant Sapling":["Branches","","Un petit arbrisseau doué de conscience, qui se fond dans le décor. Seul il est fragile, mais il encercle ses ennemis avec ses semblables."],"Vampire":["Rapière","Chasseur nocturne +3","Un mort-vivant intelligent, aux lèvres tachées de sang et au sourire de prédateur. Il mord, draine la vie et se change en brume pour échapper aux coups."],"Vault Guardian Gaoler":["Charge corporelle","","Une créature artificielle massive et poussiéreuse, aux lourdes portes de métal sur le torse. Elle enferme les intrus dans sa cage et les emporte."],"Vault Guardian Sentinel":["Masse chargée","","Une créature artificielle dorée et poussiéreuse, aux membres carrés, avec une énorme masse en guise de main. Elle repousse les intrus et détruit tout ce qui menace le caveau."],"Vault Guardian Turret":["Canon magitech","","Une tourelle vivante massive, blindée, sur douze pattes mécaniques à pistons. Elle marque ses cibles, concentre le tir et explose quand on la détruit."],"Volcanic Dragon: Ashen Tyrant":["Griffes et dents","Chasser depuis le ciel +5","Jamais un ennemi n’avait osé blesser ainsi le dragon. Acculé, il étouffe ses adversaires sous un nuage de cendres et se débat avec l’énergie du désespoir. Dernière phase du combat contre le dragon volcanique."],"Volcanic Dragon: Molten Scourge":["Griffes couvertes de lave","Chasser depuis le ciel +5","Rendu fou par ses blessures, le dragon se change en lave en fusion. Ses écailles se fendent, il inonde le terrain de lave et crache un souffle brûlant. Deuxième phase du combat."],"Volcanic Dragon: Obsidian Predator":["Griffes d’obsidienne","Chasser depuis le ciel +5","Une créature ailée massive, aux écailles d’obsidienne et aux griffes d’un tranchant impossible. Elle défend son antre, pique depuis le ciel et balaie tout de sa queue. Première phase du combat."],"War Wizard":["Bâton","Savoir magique +2, Stratégie +2","Un mage endurci par la guerre, formé à la magie destructrice. Il se téléporte en combat, fait jaillir le sol et pilonne le champ de bataille d’artillerie arcanique."],"Weaponmaster":["Claymore","","Un maître d’armes qui manie une épée deux fois grande comme lui. Il désarme, frappe en large arc de cercle et défie les plus forts du groupe."],"Young Dryad":["Faux","Commandement +3","Un être-arbre impérieux qui mène la défense de sa forêt. Il commande les jeunes sylvaniens et fait pousser des ronces sous les pas des intrus."],"Young Ice Dragon":["Morsure et griffes","Protéger ce qui est à moi +3","Un dragon bleu glacier aux quatre pattes puissantes et aux ailes givrées. Il défend son antre et son trésor, crache un blizzard et déclenche des avalanches."],"Zombie Legion":["Mains de mort-vivant","","Une grande horde de morts-vivants, encore redoutable malgré la pourriture. Elle encercle, déchiquette et contre-attaque quand on la frappe de près."],"Zombie Pack":["Morsure","","Un groupe de cadavres titubants qui avancent ensemble par instinct. Ils submergent leurs proies par le nombre."]};

 <p class="small muted" style="margin-top:8px">Pour un adversaire maison : statistiques moyennes du rang, à ajuster.</p><button class="btn pri" data-act="addadv">Ajouter</button></section></div>

function gRules(){return `<div class="grid ref"><div class="col"><section class="box"><h2>Jets d’action</h2>
 <p>2d12 (Espoir et Peur) + trait + modificateurs contre une Difficulté. Le dé le plus haut donne la couleur du résultat.</p>
 <ul><li><b>Critique</b> (dés égaux) : succès, le PJ gagne 1 Espoir et retire 1 Stress.</li><li><b>Succès avec Espoir</b> : réussite, le PJ gagne 1 Espoir.</li><li><b>Succès avec Peur</b> : réussite avec une complication, le MJ gagne 1 Peur.</li><li><b>Échec avec Espoir</b> : échec avec conséquence légère, le PJ gagne 1 Espoir.</li><li><b>Échec avec Peur</b> : échec, le MJ gagne 1 Peur et prend la main.</li></ul>
 <h3>Difficultés</h3><p>5 très facile &middot; 10 facile &middot; 15 moyen &middot; 20 difficile &middot; 25 très difficile &middot; 30 quasi impossible.</p>
 <h3>Portées</h3><p>Mêlée &middot; Très courte &middot; Courte &middot; Longue &middot; Très longue &middot; Hors de portée.</p>
 <h3>Conditions</h3><ul><li><b>Caché</b> : hors de vue, les jets contre vous ont le désavantage. L’état prend fin si un adversaire se place là où il vous verrait, si vous entrez dans sa ligne de vue ou si vous attaquez.</li><li><b>Bloqué</b> : vous ne pouvez pas vous déplacer.</li><li><b>Vulnérable</b> : les jets contre vous ont l’avantage.</li></ul>
 <h3>Avantage et désavantage</h3><p>Ajoutez ou retirez 1d6. Ils s’annulent un pour un.</p></section>
 <section class="box"><h2>Dégâts</h2><ul><li>Sous le seuil Majeur : 1 PV.</li><li>Majeur : 2 PV. Grave : 3 PV.</li><li>Une case d’armure réduit d’un cran.</li><li>Résistance : dégâts divisés par deux. Immunité : aucun.</li><li>Règle optionnelle : dégâts supérieurs ou égaux au double du seuil Grave = 4 PV.</li><li>Stress plein : chaque Stress de plus devient 1 PV.</li></ul></section></div>
 <div class="col"><section class="box"><h2>Peur du MJ</h2><ul><li>Maximum 12. Commence la session avec la Peur restante.</li><li>Gain : chaque résultat avec Peur d’un PJ, +1d4 au court repos des PJ, +1d4 + nombre de PJ au long repos.</li><li>Dépense : interrompre pour faire un geste, activer une capacité de Peur d’adversaire, donner le projecteur à un adversaire supplémentaire.</li></ul></section>
 <section class="box"><h2>Gestes de mort</h2><ul><li><b>Éclat de gloire</b> : une dernière action en réussite critique, puis le personnage meurt.</li><li><b>Éviter la mort</b> : inconscient, puis lancez le Dé d’Espoir. Si le résultat est inférieur ou égal au niveau, le PJ gagne une cicatrice (barrez une case d’Espoir).</li><li><b>Risquer le tout</b> : Dés de dualité. Espoir plus haut : le PJ survit et retire PV ou Stress égaux au Dé d’Espoir. Peur plus haut : il meurt. Critique : il retire tout.</li></ul></section>
 <section class="box"><h2>Repos</h2><p>Deux actions par repos. Court : soigner 1d4 + rang PV, retirer 1d4 + rang Stress, réparer 1d4 + tier armure, préparer (+1 Espoir, +2 si à plusieurs). Long : versions complètes, plus travailler sur un projet. Un Après trois courts repos d’affilée, le suivant doit être un long repos.</p></section>
 <section class="box"><h2>Montée de niveau</h2><p>Paliers aux niveaux 2, 5 et 8 : +1 Compétence, nouvelle Expérience, traits marqués effacés (5 et 8). Chaque niveau : 2 améliorations, +1 aux seuils, 1 carte de domaine.</p></section></div></div>`}

  case "admtempok":ADM.temp=null;render();return true;

  case "admreset":if(!arm())return true;admDo("reset",{name:k}).then(j=>{if(j){ADM.temp={name:(ADM.d.accounts.find(x=>x.slug===k)||{}).name||k,code:j.temp};render()}});return true;
  case "admlock":admDo("lock",{name:k},null,null);return true;
  case "admdel":{const n=prompt("Supprimer le compte de "+b.dataset.n+" et toutes ses fiches ?\nTapez son nom pour confirmer :");if(n===null)return true;admDo("delete",{name:k},{confirm:n},"Compte supprimé.");return true}
  case "admdelchar":{if(!arm())return true;const[f,id]=k.split("|");admDo("delchar",{from:f,id},null,"Fiche supprimée.");return true}
  case "admpurge":if(!arm())return true;admDo("purge",{pid:k},null,"Dossier supprimé.");return true;
  case "admtable":{const t=lgv("adm-table");if(!arm("Confirmer le changement"))return true;admDo("settings",null,{tableCode:t},"Code de table changé.").then(j=>{if(j){SRV.table=t;srvSave()}});return true}
  case "admmj":{const m=lgraw("adm-mj")||"",m2=lgraw("adm-mj2");if(m.length<8){toast("Code MJ : 8 caractères minimum.");return true}if(m!==m2){toast("Les deux codes ne correspondent pas.");return true}
   admDo("settings",null,{mjCode:m,mjCode2:m2},"Code MJ changé.").then(j=>{if(j){SRV.mj=m;srvSave();setTimeout(()=>location.reload(),900)}});return true}
  case "admclearlog":if(!arm())return true;admDo("clearlog");return true;
  case "admexport":admExport();return true}
 return false}
main.addEventListener("change",e=>{const t=e.target;if(t.dataset.admmove===undefined||!t.value)return;const[f,id]=t.dataset.admmove.split("|");const to=t.value;
 admDo("movechar",{from:f,id,to},null,"Fiche transférée.")});
(async()=>{srvLoad();if(await srvDetect()){if(!SRV.pin){SRV.login=true;SRV.screen=SRV.name?"login":"create";render();return}try{await srvLogin("login");afterAuth()}catch(e){SRV.login=true;SRV.screen="login";if(e.code&&e.code!==401)SRV.err=e.message||"";render()}}else connect()})();
</script>
