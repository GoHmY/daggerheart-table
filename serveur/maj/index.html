<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#0d0a17"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Daggerheart">
<style>html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
</head><body>
<title>Table Daggerheart</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap">
<style>
/* Layout: grimoire nocturne. Fond de nébuleuse violette et turquoise, panneaux d'encre bordés d'or fin, titres en capitales gravées. Or = Espoir, violet = Peur. Univers sombre assumé (un seul thème). */
:root{
 --bg:#0d0a17;--panel:#18122a;--panel2:#211a38;--panel3:#2a2147;--line:rgba(217,173,91,.20);--line2:#3a3060;
 --fg:#efe9fb;--muted:#a79fc2;--gold:#d9ad5b;--gold2:#f3d394;
 --hope:#e8b84e;--hope-soft:rgba(232,184,78,.14);--fear:#b783ea;--fear-soft:rgba(183,131,234,.16);
 --hp:#f26b63;--stress:#4fc6cf;--armor:#aab3cc;--ok:#72d394;--head:#09070f;--head-fg:#efe7ff;
 --f-display:"Cormorant Garamond",Georgia,serif;--f-label:"Cinzel",Georgia,serif;--f-body:"Alegreya Sans",system-ui,sans-serif;--f-sc:"Cinzel",Georgia,serif;
 color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{background:radial-gradient(1100px 620px at 8% -8%,rgba(123,79,194,.30),transparent 62%),radial-gradient(900px 520px at 100% 0%,rgba(34,140,150,.18),transparent 60%),radial-gradient(800px 600px at 50% 110%,rgba(217,173,91,.08),transparent 60%),var(--bg);background-attachment:fixed;color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.5;margin:0;min-height:100%;font-variant-numeric:lining-nums}
input,select,textarea,.stat strong,.trait input,.thresh .num,.die,.result,.sumline b,.adv b{font-variant-numeric:lining-nums tabular-nums}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{background:linear-gradient(180deg,rgba(9,7,15,.95),rgba(9,7,15,.75));border-bottom:1px solid var(--line);backdrop-filter:blur(6px)}
header.top .wrap{padding-block:14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;cursor:pointer}
.brand .sigil{width:42px;height:42px;flex:none}
.brand h1{font-family:var(--f-label);font-weight:700;font-size:1.35rem;letter-spacing:.12em;margin:0;color:var(--gold2);text-transform:uppercase}
.brand small{display:block;font-family:var(--f-display);font-style:italic;color:var(--muted);font-size:.98rem;letter-spacing:.02em}
.roles{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.roles button{border:1px solid var(--line2);background:rgba(255,255,255,.03);color:var(--muted);border-radius:999px;padding:7px 16px;font:600 .78rem var(--f-label);letter-spacing:.14em;text-transform:uppercase;cursor:pointer}
.roles button.on{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#1b1305;border-color:var(--gold)}
.mode{font:600 .68rem var(--f-label);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line2);border-radius:999px;padding:4px 10px}
main{padding-block:18px 80px}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding:6px;margin-bottom:14px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(13,10,23,.88);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:999px;align-items:center;scrollbar-width:none}
nav.tabs button{flex:none;border:0;background:transparent;color:var(--muted);border-radius:999px;padding:8px 14px;font:600 .74rem var(--f-label);letter-spacing:.12em;text-transform:uppercase;cursor:pointer}
nav.tabs button:hover{color:var(--fg)}
nav.tabs button.on{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#1b1305}
.grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:860px){.grid{grid-template-columns:minmax(0,1fr)}}
.col{display:flex;flex-direction:column;gap:18px;min-width:0}
section.box{position:relative;background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,0) 40%),var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;min-width:0;box-shadow:0 1px 0 rgba(255,255,255,.04) inset,0 14px 34px rgba(0,0,0,.28)}
section.box::before{content:"";position:absolute;left:18px;right:18px;top:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.7}
h2{font-family:var(--f-display);font-weight:700;font-size:1.65rem;line-height:1.1;margin:0 0 12px;color:var(--gold2);text-wrap:balance;letter-spacing:.01em}
h3{font-family:var(--f-label);font-size:.7rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin:18px 0 8px}
p{margin:0 0 8px}
label.f{display:flex;flex-direction:column;gap:4px;font:600 .66rem var(--f-label);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);min-width:0}
input,select,textarea{font:inherit;font-family:var(--f-body);font-size:1rem;color:var(--fg);background:rgba(8,6,15,.55);border:1px solid var(--line2);border-radius:8px;padding:8px 10px;width:100%;min-width:0;text-transform:none;letter-spacing:0}
input:hover,select:hover,textarea:hover{border-color:#4d4180}
textarea{resize:vertical;min-height:70px;line-height:1.45}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,.pick:focus-visible,summary:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
fieldset{border:0;margin:0;padding:0;min-width:0}
.row{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.row.r3{grid-template-columns:repeat(auto-fit,minmax(115px,1fr))}
.btn{border:1px solid var(--line2);background:rgba(255,255,255,.045);color:var(--fg);border-radius:8px;padding:8px 13px;font:600 .9rem var(--f-body);cursor:pointer;transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--gold);background:rgba(217,173,91,.08)}
.btn.pri{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#1b1305;border-color:var(--gold);box-shadow:0 4px 14px rgba(217,173,91,.2)}
.btn.fear{background:linear-gradient(180deg,#c99af1,#8f55c9);color:#fff;border-color:#8f55c9}
.btn.danger{color:var(--hp)}
.btn.sm{padding:5px 10px;font-size:.84rem}
.btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid var(--line2);font:600 .76rem var(--f-body)}
.chip.pos{color:var(--ok);border-color:rgba(114,211,148,.35)}.chip.neg{color:var(--hp);border-color:rgba(242,107,99,.35)}
.muted{color:var(--muted)}.small{font-size:.88rem}
.warn{color:var(--hp);font-size:.88rem}.okc{color:var(--ok);font-size:.88rem}
.flexgap{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.note{background:var(--hope-soft);border:1px solid rgba(232,184,78,.3);border-radius:12px;padding:10px 14px;font-size:.93rem}
.note.fear{background:var(--fear-soft);border-color:rgba(183,131,234,.32)}
details.fold{margin-top:12px;border:1px solid var(--line2);border-radius:10px;padding:10px 12px;background:rgba(255,255,255,.02)}
details.fold.sm{margin-top:8px;padding:6px 10px}
details.fold summary{cursor:pointer;font:600 .72rem var(--f-label);letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.sumline{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;padding:10px 12px;border-radius:10px;background:rgba(255,255,255,.03);border:1px solid var(--line2);font-size:.92rem}
.sumline b{font:700 1.2rem var(--f-display);color:var(--gold2)}
/* cartes de choix */
.picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.pick{position:relative;text-align:left;border:1px solid var(--line2);background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.01)),var(--panel2);border-radius:14px;padding:14px;cursor:pointer;color:var(--fg);font:inherit;display:flex;flex-direction:column;gap:7px;min-width:0;transition:transform .15s,border-color .15s,box-shadow .15s}
.pick:hover{border-color:var(--gold);transform:translateY(-2px)}
.pick.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 10px 28px rgba(217,173,91,.18)}
.pick.on::after{content:"Choisi";position:absolute;top:10px;right:10px;font:700 .6rem var(--f-label);letter-spacing:.12em;text-transform:uppercase;background:var(--gold);color:#1b1305;padding:3px 8px;border-radius:999px}
.pick:disabled{opacity:.4;cursor:not-allowed;transform:none}
.pick .top{display:flex;gap:12px;align-items:center}
.emb{width:60px;height:60px;flex:none;filter:drop-shadow(0 4px 10px rgba(0,0,0,.4))}
.emb.sm{width:34px;height:34px}
.pick b{font:700 1.3rem var(--f-display);line-height:1.1}
.pick p{font-size:.88rem;margin:0}
.emb svg{width:100%;height:100%;display:block}
.portrait{width:100%;aspect-ratio:1;max-width:100%;border-radius:14px;overflow:hidden;background:var(--panel2);display:grid;place-items:center;border:1px solid var(--line);box-shadow:0 8px 24px rgba(0,0,0,.35)}
.portrait img,.portrait svg{width:100%;height:100%;object-fit:cover;display:block}
/* cartes de personnage */
.pcs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.pc{position:relative;border:1px solid var(--line);border-radius:16px;background:var(--panel);overflow:hidden;cursor:pointer;text-align:left;color:var(--fg);font:inherit;padding:0;display:flex;flex-direction:column;transition:transform .15s,border-color .15s,box-shadow .15s}
.pc:hover{transform:translateY(-3px);border-color:var(--gold);box-shadow:0 14px 34px rgba(0,0,0,.4)}
.pc .pimg{height:200px;position:relative;overflow:hidden}
.pc .pimg img,.pc .pimg svg{width:100%;height:100%;object-fit:cover;display:block}
.pc .pimg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(13,10,23,.95))}
.pc .pname{position:absolute;left:14px;right:14px;bottom:10px;z-index:1}
.pc .pname b{display:block;font:700 1.7rem var(--f-display);line-height:1;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.6)}
.pc .pname span{font:600 .64rem var(--f-label);letter-spacing:.12em;text-transform:uppercase;color:var(--gold2)}
.pc .pbody{padding:12px 14px 14px;display:flex;flex-direction:column;gap:7px}
.bar{height:6px;border-radius:4px;background:rgba(255,255,255,.07);overflow:hidden}
.bar i{display:block;height:100%;background:var(--c);box-shadow:0 0 10px var(--c)}
.barrow{display:grid;grid-template-columns:56px minmax(0,1fr) 40px;gap:8px;align-items:center;font-size:.76rem;font-variant-numeric:tabular-nums;color:var(--muted)}
/* traits et stats */
.traits{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
@media (max-width:640px){.traits{grid-template-columns:repeat(3,minmax(0,1fr))}}
.trait{border:1px solid var(--line2);border-radius:14px;padding:10px 6px;text-align:center;background:radial-gradient(circle at 50% 0%,rgba(217,173,91,.12),transparent 70%),var(--panel2);display:flex;flex-direction:column;gap:4px;align-items:center;min-width:0}
.trait b{font:600 .62rem var(--f-label);letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.trait input[type=number]{text-align:center;font:700 1.9rem var(--f-display);padding:0;border:0;background:transparent;width:70px;color:var(--fg)}
.trait select{text-align:center;font-weight:700;padding:4px}
.trait .verbs{font-size:.68rem;color:var(--muted);line-height:1.25}
.trait label{font-size:.7rem;color:var(--muted);display:flex;gap:4px;align-items:center}
.trait label input{width:auto}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:560px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{border:1px solid var(--line2);border-radius:12px;padding:10px 12px;background:var(--panel2);min-width:0}
.stat small{display:block;font:600 .6rem var(--f-label);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.stat strong{font:700 2rem var(--f-display);line-height:1.05;font-variant-numeric:tabular-nums;color:var(--fg)}
.thresh{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.thresh .seg{padding:5px 10px;border-radius:8px;background:var(--panel2);border:1px solid var(--line2);font-size:.82rem}
.thresh .num{font:700 1.5rem var(--f-display);padding:0 4px;color:var(--gold2)}
.track{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:10px;align-items:center;margin-bottom:12px}
@media (max-width:480px){.track{grid-template-columns:minmax(0,1fr) auto}.track .slots{grid-column:1/-1;order:3}}
.track .lab{font:600 .66rem var(--f-label);letter-spacing:.12em;text-transform:uppercase}
.slots{display:flex;flex-wrap:wrap;gap:6px}
.slot{width:26px;height:26px;border-radius:7px;border:1.5px solid var(--c);background:rgba(255,255,255,.02);cursor:pointer;padding:0;transition:background .12s,box-shadow .12s}
.slot:hover{box-shadow:0 0 0 3px rgba(255,255,255,.06)}
.slot.on{background:var(--c);box-shadow:0 0 12px var(--c)}
@media (pointer:coarse){.slot{width:32px;height:32px}.btn{padding:10px 14px}.btn.sm{padding:7px 11px}}
.slot.dia{transform:rotate(45deg) scale(.82);border-radius:5px}
.track .cnt{font:600 .85rem var(--f-body);color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.feat{border-left:2px solid var(--fear);padding:4px 0 4px 12px;margin:10px 0}
.feat.hope{border-color:var(--hope)}.feat.anc{border-color:var(--stress)}
.feat b{display:block;font:700 1.12rem var(--f-display);color:var(--fg)}.feat p{margin:2px 0 0;font-size:.93rem;color:#d6cfe9}
.tag{font:600 .6rem var(--f-label);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
/* dés */
.dice{display:flex;gap:22px;align-items:center;justify-content:center;padding:22px 0 16px}
.die{width:78px;height:78px;display:grid;place-items:center;font:700 2.2rem var(--f-display);border-radius:16px;transform:rotate(45deg)}
.die span{transform:rotate(-45deg)}
.die.h{background:radial-gradient(circle at 30% 30%,rgba(243,211,148,.35),rgba(232,184,78,.08));color:var(--gold2);border:1.5px solid var(--hope);box-shadow:0 0 26px rgba(232,184,78,.3)}
.die.f{background:radial-gradient(circle at 30% 30%,rgba(201,154,241,.35),rgba(183,131,234,.08));color:#e2c9fb;border:1.5px solid var(--fear);box-shadow:0 0 26px rgba(183,131,234,.3)}
.result{text-align:center;font:700 1.45rem var(--f-display);color:var(--fg)}
.log{max-height:220px;overflow:auto;font-size:.88rem;border-top:1px solid var(--line2);margin-top:12px;padding-top:6px}
.log div{padding:4px 0;border-bottom:1px dashed var(--line2)}
@media (prefers-reduced-motion:no-preference){.die{transition:transform .4s cubic-bezier(.3,1.6,.5,1)}.rolling .die{transform:rotate(225deg)}}
.item{border:1px solid var(--line2);border-radius:12px;padding:12px;background:var(--panel2);display:flex;flex-direction:column;gap:8px;margin-bottom:10px;min-width:0}
.itemhead{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.card{border-top:3px solid var(--dc,var(--fear))}
.adv{display:grid;grid-template-columns:70px minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:center;margin-bottom:8px}
@media (max-width:560px){.adv{grid-template-columns:minmax(0,1fr)}}
.adv b{font:700 1.15rem var(--f-display);color:var(--gold2)}
/* armes et inventaire */
.wgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.wcard{border:1px solid var(--line);border-radius:14px;padding:12px;background:radial-gradient(circle at 0% 0%,rgba(217,173,91,.10),transparent 60%),var(--panel2);min-width:0}
.wcard-top{display:flex;gap:10px;align-items:center}
.wcard-top b{font:700 1.25rem var(--f-display)}
.wstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:10px}
.wstats span{background:rgba(255,255,255,.03);border:1px solid var(--line2);border-radius:8px;padding:6px 8px;font-size:.88rem;min-width:0}
.wstats small{display:block;font:600 .56rem var(--f-label);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.inv{border:1px solid var(--line2);border-radius:12px;padding:10px 12px;background:var(--panel2);margin-bottom:8px;min-width:0}
.inv.on{border-color:rgba(217,173,91,.45);box-shadow:inset 3px 0 0 var(--gold)}
.inv-top{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.inv-name{border:0;background:transparent;font:700 1.12rem var(--f-display);padding:2px 4px;flex:1 1 140px}
.inv-name:hover{background:rgba(255,255,255,.04)}
.tagcat{font:600 .58rem var(--f-label);letter-spacing:.12em;text-transform:uppercase;color:var(--gold);border:1px solid var(--line);border-radius:999px;padding:3px 8px;flex:none}
.qty{display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
/* assistant */
.steps{display:flex;gap:4px;overflow-x:auto;padding-bottom:8px;margin-bottom:14px;scrollbar-width:none}
.steps button{flex:none;border:1px solid var(--line2);background:rgba(255,255,255,.03);color:var(--muted);border-radius:999px;padding:7px 12px;font:600 .66rem var(--f-label);letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
.steps button.on{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#1b1305;border-color:var(--gold)}
.steps button.done{color:var(--ok);border-color:rgba(114,211,148,.35)}
.wizgrid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
@media (max-width:900px){.wizgrid{grid-template-columns:minmax(0,1fr)}.preview{position:static!important}}
.preview{position:sticky;top:70px}
.wiznav{display:flex;justify-content:space-between;gap:8px;margin-top:16px;flex-wrap:wrap}
table.t{width:100%;border-collapse:collapse;font-size:.9rem;font-variant-numeric:tabular-nums}
table.t th,table.t td{text-align:left;padding:8px;border-bottom:1px solid var(--line2);vertical-align:top}
table.t th{font:600 .6rem var(--f-label);letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
table.t tr.dis{opacity:.4}
table.t tr.sel{background:var(--hope-soft)}
.scroll{overflow-x:auto}
/* MJ */
.fearbig{display:flex;flex-wrap:wrap;gap:8px}
.fearbig .slot{width:36px;height:36px;transform:rotate(45deg) scale(.8)}
.cd{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;border:1px solid var(--line2);border-radius:12px;padding:10px;margin-bottom:8px;background:var(--panel2)}
.ref p,.ref li{font-size:.94rem;color:#d6cfe9}
.ref ul{margin:4px 0 8px;padding-left:18px}
.ref b{color:var(--fg)}
.empty{text-align:center;padding:34px 10px;color:var(--muted)}
.empty .emb{width:90px;height:90px;margin:0 auto 10px}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:8px}
.gallery button{border:1px solid var(--line2);border-radius:12px;padding:4px;background:var(--panel2);cursor:pointer;aspect-ratio:1}
.gallery button.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.gallery svg{width:100%;height:100%}
::-webkit-scrollbar{height:8px;width:8px}::-webkit-scrollbar-thumb{background:#3a3060;border-radius:8px}
</style>

<header class="top"><div class="wrap">
 <div class="brand" data-act="home"><svg class="sigil" viewBox="0 0 48 48" aria-hidden="true"><rect x="6" y="14" width="20" height="20" rx="3" transform="rotate(45 16 24)" fill="none" stroke="#e8b84e" stroke-width="2"/><rect x="22" y="14" width="20" height="20" rx="3" transform="rotate(45 32 24)" fill="none" stroke="#b783ea" stroke-width="2"/><circle cx="24" cy="24" r="3" fill="#f3d394"/></svg><div><h1>Daggerheart</h1><small>Table de jeu, fiches et écran du MJ</small></div></div>
 <div class="roles"><span class="mode" id="mode">Mode local</span><button data-role="joueur" id="rj">Joueur</button><button data-role="mj" id="rm">MJ</button></div>

async function connect(){
 try{let d,u;if(SRV.on){d=makeServerDb();u={id:async()=>SRV.pid,canEdit:async()=>SRV.isMJ}}else{if(!window.claude||!window.claude.use)return;[d,u]=await Promise.all([claude.use("db"),claude.use("user")])}if(!d||!u)return;db=d;usr=u;
  const id=await u.id();if(!id)return;
  L.me={id,canEdit:!!(await u.canEdit())};L.mode="db";L.chars=[];L.table={fear:0,cds:[],adv:[],pcs:4,adj:0,note:""};
  if(L.role==="mj"&&!L.me.canEdit)L.role="joueur";
  if(L.view==="sheet")L.view="home";
  const byP={},subs={};
  const merge=()=>{const all=Object.values(byP).flat();const mine=new Map(L.chars.map(c=>[c.id,c]));
   L.chars=all.map(x=>dirty.has(x.id)&&mine.has(x.id)?mine.get(x.id):x).sort((a,b)=>(a.name||"").localeCompare(b.name||""));softRender()};
  const watch=pid=>{if(subs[pid])return;subs[pid]=db.collection("players/"+pid+"/chars").onSnapshot(s=>{byP[pid]=s.docs.map(d=>{const x=d.data();x.id=d.id;x.owner=x.owner||pid;return x});merge()},()=>{})};
  watch(id);
  if(L.me.canEdit){
   db.collection("players").onSnapshot(s=>{s.docs.forEach(d=>watch(d.id))},()=>{});
   db.collection("chars").get().then(async s=>{for(const d of s.docs){const x=d.data();x.id=d.id;x.owner=x.owner||id;try{await db.doc(charPath(x)).set(x);await db.doc("chars/"+d.id).delete();if(x.owner===id)touchIndex(id)}catch(e){}}}).catch(()=>{});
  }
  db.doc("table/state").onSnapshot(s=>{if(s.exists)L.table=Object.assign({fear:0,cds:[],adv:[],pcs:4,adj:0,note:""},s.data());softRender()},()=>{});
  db.doc("data/users/"+id+"/gm/notes").get().then(s=>{if(s.exists){L.gm=s.data().text||"";softRender()}}).catch(()=>{});
  render();
 }catch(e){}
}

 {name:"Bénédiction",src:"Bénédiction",val:1,adv:0,tgt:"all",dur:"next"},
 {name:"Maléfice",src:"Maléfice",val:-1,adv:0,tgt:"all",dur:"perm"},

function consume(c,list){list.forEach(e=>{if(e.dur==="next")e.gone=true;else if(e.dur==="uses"){e.uses=(+e.uses||1)-1;if(e.uses<=0)e.gone=true}});c.effects=(c.effects||[]).filter(e=>!e.gone)}
function expire(c,kind){const kill={scene:["scene","next"],short:["scene","next","short"],long:["scene","next","short","long"]}[kind];const n=(c.effects||[]).length;c.effects=(c.effects||[]).filter(e=>!kill.includes(e.dur));return n-c.effects.length}

/* =================== CALCULS =================== */
const tier=l=>l>=8?4:l>=5?3:l>=2?2:1;
function advCount(c,k){let n=0;for(let l=2;l<=c.level;l++)(c.adv[l]||[]).forEach(x=>{if(x===k)n++});return n}
function scTrait(c){const s=CLASSES[c.classe]?.subs[c.sub];return s?s.sc:""}
function effTraits(c){const out={};TRAITS.forEach(([k])=>out[k]=+(c.traits[k].v??0));
 [c.armor,c.prim,c.sec].forEach(o=>{if(o&&o.trm)for(const k in o.trm)out[k]+=o.trm[k]});return out}
function derive(c){
 const cl=CLASSES[c.classe];if(!cl)return null;const L_=+c.level||1;
 const prof=1+(L_>=2)+(L_>=5)+(L_>=8)+advCount(c,"prof");
 const E_=t=>effs(c,[t]).val;
 const hp=Math.min(12,E_("hp")+cl.hp+advCount(c,"hp")+(c.anc1==="geant"?1:0)+(c.classe==="magicien"&&c.sub==="war"?1:0));
 const st=Math.min(12,E_("stress")+6+advCount(c,"stress")+(c.anc1==="humain"?1:0)+(c.classe==="gardien"&&c.sub==="vengeance"?1:0));
 const wev=(c.prim?.ev||0)+(c.sec?.ev||0),warm=(c.prim?.arm||0)+(c.sec?.arm||0);
 const ev=cl.ev+(+c.armor.ev||0)+wev+advCount(c,"evasion")+(c.anc2==="simiah"?1:0)+(+c.extraEv||0)+E_("evasion");
 let major,severe;if(c.armor.preset==="none"){major=L_;severe=2*L_}else{major=(+c.armor.major||0)+L_;severe=(+c.armor.severe||0)+L_}
 const bonus=E_("thresholds")+(c.classe==="gardien"&&c.sub==="stalwart"?1:0)+(c.anc1==="galapa"?prof:0);major+=bonus;severe+=bonus;
 const armor=Math.max(0,Math.min(12,(+c.armor.score||0)+warm+E_("armor")));
 const cards=2+(L_-1)+advCount(c,"card")+(c.classe==="magicien"&&c.sub==="knowledge"?1:0);
 const exps=2+(L_>=2)+(L_>=5)+(L_>=8);
 return{hopeMax:Math.max(0,6-(+c.scars||0)),prof,hp,st,ev,major,severe,armor,cards,exps,tier:tier(L_),tr:effTraits(c)};
}
function canWrite(c){return L.mode==="local"||c.owner===L.me.id||L.me.canEdit}
function weaponOk(c,w,slot){
 if(w.dt==="mag"&&!scTrait(c))return "Arme magique : il faut une sous-classe avec un trait d’incantation.";
 if(slot==="sec"&&c.prim&&c.prim.h===2)return "Votre arme principale se tient à deux mains.";
 if(slot==="prim"&&w.h===2&&c.sec)return "Arme à deux mains : votre arme secondaire sera retirée.";
 return "";
}
function validate(c){const e=[];
 if(!c.classe)e.push("Choisissez une classe.");if(!c.sub)e.push("Choisissez une sous-classe.");
 if(!c.anc1)e.push("Choisissez une ascendance.");if(!c.comm)e.push("Choisissez une communauté.");
 const vals=TRAITS.map(([k])=>c.traits[k].v);if(vals.some(v=>v===null||v===""))e.push("Attribuez les 6 traits.");
 else{const s=[...vals].map(Number).sort((a,b)=>b-a).join();if(s!==ARRAY.join())e.push("Les traits doivent utiliser exactement +2, +1, +1, 0, 0, −1.")}
 if(!c.prim)e.push("Choisissez une arme principale.");
 if(c.exps.filter(x=>x.name.trim()).length<2)e.push("Nommez 2 Expériences.");
 if(c.cards.length!==startCards(c))e.push("Choisissez exactement "+startCards(c)+" cartes de domaine de niveau 1.");
 if(!c.name.trim())e.push("Donnez un nom à votre personnage.");
 return e}

const optsObj=(o,sel,lab=v=>v.n)=>Object.entries(o).map(([k,v])=>`<option value="${k}" ${k===sel?"selected":""}>${esc(lab(v))}</option>`).join("");
const fld=(lab,p,v,type="text",ex="")=>`<label class="f">${lab}<input type="${type}" data-p="${p}" value="${esc(v)}" ${ex}></label>`;
const area=(lab,p,v,rows=4,ex="")=>`<label class="f">${lab}<textarea data-p="${p}" rows="${rows}" ${ex}>${esc(v)}</textarea></label>`;
function slots(path,n,val,col,cls=""){let h="";for(let i=0;i<n;i++)h+=`<button class="slot ${cls} ${i<val?"on":""}" style="--c:${col}" data-slot="${path}" data-i="${i}" aria-label="${({hp:"PV",stress:"Stress",hope:"Espoir",armorUsed:"Armure"})[path]||path} ${i+1}"></button>`;return h}
const sign=v=>v>0?"+"+v:v<0?"−"+Math.abs(v):"0";
const T=()=>L.view==="wizard"?L.wiz.d:L.chars.find(c=>c.id===L.cur);
function bars(c){const d=derive(c);if(!d)return"";const r=(lab,v,m,col)=>`<div class="barrow"><span>${lab}</span><div class="bar"><i style="--c:${col};width:${m?Math.round(100*v/m):0}%"></i></div><span>${v}/${m}</span></div>`;
 return r("PV",c.hp,d.hp,"var(--hp)")+r("Stress",c.stress,d.st,"var(--stress)")+r("Espoir",c.hope,6,"var(--hope)")}

function genStory(c){const S_=STORY,cl=c.classe||"guerrier";const who=c.name||"Ce personnage";
 const anc=c.anc1?ANC[c.anc1].n.toLowerCase():"";
 const w_=pick(S_.look.wear);const look=`${c.anc1?ANC[c.anc1].n+". ":""}${w_[0].toUpperCase()+w_.slice(1)}, ${pick(S_.look.mark)}. ${who} ${pick(S_.quirk)}.`;
 const answers={};(S_.ans[cl]||[]).forEach((opts,i)=>answers[i]=pick(opts));
 const origin=c.comm?pick(S_.comm[c.comm]):"a grandi sur les routes";
 const notes=`${who} ${origin}. Tout a basculé avec ${pick(S_.event)}. Aujourd’hui, son but : ${pick(S_.goal)}.\nSecret : ${pick(S_.secret)}.\nPeur : ${pick(S_.fear)}.\nAccroche pour le MJ : ${pick(S_.hook)}`;
 const others=L.chars.filter(x=>x.id!==c.id&&x.name).map(x=>x.name);const n1=others.length?pick(others):"un autre membre du groupe";
 const links=pick(S_.link).split("{n}").join(n1);
 return{look,answers,links,notes}}
function hasStory(c){return !!(c.bg.look||c.bg.links||c.bg.notes||Object.values(c.bg.answers||{}).some(Boolean))}
function storyBtns(){return `<div class="note" style="margin-bottom:12px"><div class="flexgap" style="justify-content:space-between"><span>Pas d’inspiration ? Générez une histoire complète à partir de votre classe, ascendance et communauté. Relancez autant que vous voulez, puis modifiez ce qui vous plaît.</span><button class="btn sm pri" data-act="randstory" id="randstory">Histoire aléatoire</button></div></div>`}

function gRules(){return `<div class="grid ref"><div class="col"><section class="box"><h2>Jets d’action</h2>
 <p>2d12 (Espoir et Peur) + trait + modificateurs contre une Difficulté. Le dé le plus haut donne la couleur du résultat.</p>
 <ul><li><b>Critique</b> (dés égaux) : succès, le PJ gagne 1 Espoir et retire 1 Stress.</li><li><b>Succès avec Espoir</b> : réussite, le PJ gagne 1 Espoir.</li><li><b>Succès avec Peur</b> : réussite avec une complication, le MJ gagne 1 Peur.</li><li><b>Échec avec Espoir</b> : échec avec conséquence légère, le PJ gagne 1 Espoir.</li><li><b>Échec avec Peur</b> : échec, le MJ gagne 1 Peur et prend la main.</li></ul>
 <h3>Difficultés</h3><p>5 très facile &middot; 10 facile &middot; 15 moyen &middot; 20 difficile &middot; 25 très difficile &middot; 30 quasi impossible.</p>
 <h3>Portées</h3><p>Mêlée &middot; Très proche &middot; Proche &middot; Lointaine &middot; Très lointaine &middot; Hors de portée.</p>
 <h3>Conditions</h3><ul><li><b>Caché</b> : hors de vue, les jets contre vous ont le désavantage.</li><li><b>Entravé</b> : vous ne pouvez pas vous déplacer.</li><li><b>Vulnérable</b> : les jets contre vous ont l’avantage.</li></ul>
 <h3>Avantage et désavantage</h3><p>Ajoutez ou retirez 1d6. Ils s’annulent un pour un.</p></section>
 <section class="box"><h2>Dégâts</h2><ul><li>Sous le seuil Majeur : 1 PV.</li><li>Majeur : 2 PV. Grave : 3 PV.</li><li>Une case d’armure réduit d’un cran.</li><li>Résistance : dégâts divisés par deux. Immunité : aucun.</li><li>Règle optionnelle : dégâts supérieurs ou égaux au double du seuil Grave = 4 PV.</li><li>Stress plein : chaque Stress de plus devient 1 PV.</li></ul></section></div>
 <div class="col"><section class="box"><h2>Peur du MJ</h2><ul><li>Maximum 12. Commence la session avec la Peur restante.</li><li>Gain : chaque résultat avec Peur d’un PJ, +1d4 au repos court des PJ, +1d4 + nombre de PJ au repos long.</li><li>Dépense : interrompre pour faire un geste, activer une capacité de Peur d’adversaire, donner le projecteur à un adversaire supplémentaire.</li></ul></section>
 <section class="box"><h2>Gestes de mort</h2><ul><li><b>Éclat de gloire</b> : une dernière action en réussite critique, puis le personnage meurt.</li><li><b>Éviter la mort</b> : inconscient, puis lancez le Dé d’Espoir. Si le résultat est inférieur ou égal au niveau, le PJ gagne une cicatrice (barrez une case d’Espoir).</li><li><b>Risquer le tout</b> : Dés de dualité. Espoir plus haut : le PJ survit et retire PV ou Stress égaux au Dé d’Espoir. Peur plus haut : il meurt. Critique : il retire tout.</li></ul></section>
 <section class="box"><h2>Repos</h2><p>Deux actions par repos. Court : soigner 1d4 + tier PV, retirer 1d4 + tier Stress, réparer 1d4 + tier armure, préparer (+1 Espoir, +2 si à plusieurs). Long : versions complètes, plus travailler sur un projet. Un 3e repos court d’affilée devient un repos long.</p></section>
 <section class="box"><h2>Montée de niveau</h2><p>Paliers aux niveaux 2, 5 et 8 : +1 Maîtrise, nouvelle Expérience, traits marqués effacés (5 et 8). Chaque niveau : 2 améliorations, +1 aux seuils, 1 carte de domaine.</p></section></div></div>`}

 <section class="box"><div class="flexgap" style="justify-content:space-between"><h2 style="margin:0">Journal</h2><span class="flexgap"><button class="btn sm" data-act="admexport">Exporter toutes les fiches</button><button class="btn sm" data-act="admclearlog">Vider</button></span></div>
  <div class="scroll" style="max-height:340px;margin-top:10px"><table class="t"><thead><tr><th>Date</th><th>Évènement</th><th>Joueur</th><th>Adresse IP</th></tr></thead><tbody>
  ${d.log.map(l=>`<tr><td class="small">${dt(l.t)}</td><td${/incorrect|échou|refus|Mauvais/i.test(l.ev)?' style="color:var(--hp)"':""}>${esc(l.ev)}</td><td>${esc(l.who)}</td><td class="small muted">${esc(l.ip)}</td></tr>`).join("")||`<tr><td colspan="4" class="muted">Rien pour l’instant.</td></tr>`}
  </tbody></table></div><p class="small muted" style="margin-top:8px">Sauvegarde automatique chaque jour dans data\\sauvegardes (30 jours). Dernière : ${esc(d.backups[0]||"aucune")}.</p></section></div>`}
function admExport(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify({exportedAt:new Date().toISOString(),chars:L.chars},null,1)],{type:"application/json"}));a.download="daggerheart-fiches-"+new Date().toISOString().slice(0,10)+".json";document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
function admClick(a,b){const k=b.dataset.k;
 const arm=(lbl)=>{if(b.dataset.armed)return true;b.dataset.armed="1";const o=b.textContent;b.textContent=lbl||"Confirmer ?";setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.textContent=o}},3500);return false};
 switch(a){
  case "admrefresh":admLoad();return true;
  case "admtempok":ADM.temp=null;render();return true;
  case "admopen":admDo("settings",null,{open:!ADM.d.settings.open});return true;
  case "admreset":if(!arm())return true;admDo("reset",{name:k}).then(j=>{if(j){ADM.temp={name:(ADM.d.accounts.find(x=>x.slug===k)||{}).name||k,code:j.temp};render()}});return true;
  case "admlock":admDo("lock",{name:k},null,null);return true;
  case "admdel":{const n=prompt("Supprimer le compte de "+b.dataset.n+" et toutes ses fiches ?\nTapez son nom pour confirmer :");if(n===null)return true;admDo("delete",{name:k},{confirm:n},"Compte supprimé.");return true}
  case "admdelchar":{if(!arm())return true;const[f,id]=k.split("|");admDo("delchar",{from:f,id},null,"Fiche supprimée.");return true}
  case "admpurge":if(!arm())return true;admDo("purge",{pid:k},null,"Dossier supprimé.");return true;
  case "admtable":{const t=lgv("adm-table");if(!arm("Confirmer le changement"))return true;admDo("settings",null,{tableCode:t},"Code de table changé.").then(j=>{if(j){SRV.table=t;srvSave()}});return true}
  case "admmj":{const m=lgraw("adm-mj")||"",m2=lgraw("adm-mj2");if(m.length<8){toast("Code MJ : 8 caractères minimum.");return true}if(m!==m2){toast("Les deux codes ne correspondent pas.");return true}
   admDo("settings",null,{mjCode:m,mjCode2:m2},"Code MJ changé.").then(j=>{if(j){SRV.mj=m;srvSave();setTimeout(()=>location.reload(),900)}});return true}
  case "admclearlog":if(!arm())return true;admDo("clearlog");return true;
  case "admexport":admExport();return true}
 return false}
main.addEventListener("change",e=>{const t=e.target;if(t.dataset.admmove===undefined||!t.value)return;const[f,id]=t.dataset.admmove.split("|");const to=t.value;
 admDo("movechar",{from:f,id,to},null,"Fiche transférée.")});
(async()=>{srvLoad();if(await srvDetect()){if(!SRV.pin){SRV.login=true;SRV.screen=SRV.name?"login":"create";render();return}try{await srvLogin("login");afterAuth()}catch(e){SRV.login=true;SRV.screen="login";if(e.code&&e.code!==401)SRV.err=e.message||"";render()}}else connect()})();
</script>
<script>if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});</script>
</body></html>
