<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#0d0a17"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Daggerheart">
<style>html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<style id="sbk-css">.sbk{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0;background:var(--panel2)}.sbk-h{display:flex;flex-direction:column}.sbk-h b{font-family:var(--f-display);font-size:1.15em;letter-spacing:.02em;text-transform:uppercase}.sbk-h span{color:var(--muted);font-size:.9em}.sbk-d{margin:6px 0 4px;font-style:italic}.sbk-m{margin:0 0 8px;font-size:.92em}.sbk-s{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px 0;font-size:.92em;display:grid;gap:3px}.sbk-x{border-top:1px dashed var(--line);padding-top:4px}.sbk-c{margin:8px 0 4px;font-size:.78em;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}.sbk-f{margin:0 0 6px;font-size:.92em;line-height:1.4}details.sbx>summary{cursor:pointer;color:var(--gold);font-size:.9em;margin:2px 0}</style><style id="fix-fear">button.btn.fear,button.btn.sm.fear{background:linear-gradient(180deg,#c99af1,#8f55c9);color:#fff;border-color:#8f55c9}</style></head><body>
<title>Table Daggerheart</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap">
<style>
/* Layout: grimoire nocturne. Fond de nébuleuse violette et turquoise, panneaux d'encre bordés d'or fin, titres en capitales gravées. Or = Espoir, violet = Peur. Univers sombre assumé (un seul thème). */
:root{
 --bg:#0d0a17;--panel:#18122a;--panel2:#211a38;--panel3:#2a2147;--line:rgba(217,173,91,.20);--line2:#3a3060;
 --fg:#efe9fb;--muted:#a79fc2;--gold:#d9ad5b;--gold2:#f3d394;
 --hope:#e8b84e;--hope-soft:rgba(232,184,78,.14);--fear:#b783ea;--fear-soft:rgba(183,131,234,.16);
 --hp:#f26b63;--stress:#4fc6cf;--armor:#aab3cc;--ok:#72d394;--head:#09070f;--head-fg:#efe7ff;
 --f-display:"Cormorant Garamond",Georgia,serif;--f-label:"Cinzel",Georgia,serif;--f-body:"Alegreya Sans",system-ui,sans-serif;--f-sc:"Cinzel",Georgia,serif;
 color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{background:radial-gradient(1100px 620px at 8% -8%,rgba(123,79,194,.30),transparent 62%),radial-gradient(900px 520px at 100% 0%,rgba(34,140,150,.18),transparent 60%),radial-gradient(800px 600px at 50% 110%,rgba(217,173,91,.08),transparent 60%),var(--bg);background-attachment:fixed;color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.5;margin:0;min-height:100%;font-variant-numeric:lining-nums}
input,select,textarea,.stat strong,.trait input,.thresh .num,.die,.result,.sumline b,.adv b{font-variant-numeric:lining-nums tabular-nums}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{background:linear-gradient(180deg,rgba(9,7,15,.95),rgba(9,7,15,.75));border-bottom:1px solid var(--line);backdrop-filter:blur(6px)}
header.top .wrap{padding-block:14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;cursor:pointer}
.brand .sigil{width:42px;height:42px;flex:none}
.brand h1{font-family:var(--f-label);font-weight:700;font-size:1.35rem;letter-spacing:.12em;margin:0;color:var(--gold2);text-transform:uppercase}
.brand small{display:block;font-family:var(--f-display);font-style:italic;color:var(--muted);font-size:.98rem;letter-spacing:.02em}
.roles{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.roles button{border:1px solid var(--line2);background:rgba(255,255,255,.03);color:var(--muted);border-radius:999px;padding:7px 16px;font:600 .78rem var(--f-label);letter-spacing:.14em;text-transform:uppercase;cursor:pointer}
.roles button.on{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#1b1305;border-color:var(--gold)}
.mode{font:600 .68rem var(--f-label);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line2);border-radius:999px;padding:4px 10px}
main{padding-block:18px 80px}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding:6px;margin-bottom:14px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(13,10,23,.88);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:999px;align-items:center;scrollbar-width:none}
nav.tabs button{flex:none;border:0;background:transparent;color:var(--muted);border-radius:999px;padding:8px 14px;font:600 .74rem var(--f-label);letter-spacing:.12em;text-transform:uppercase;cursor:pointer}
nav.tabs button:hover{color:var(--fg)}
nav.tabs button.on{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#1b1305}
.grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:860px){.grid{grid-template-columns:minmax(0,1fr)}}
.col{display:flex;flex-direction:column;gap:18px;min-width:0}
section.box{position:relative;background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,0) 40%),var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;min-width:0;box-shadow:0 1px 0 rgba(255,255,255,.04) inset,0 14px 34px rgba(0,0,0,.28)}
section.box::before{content:"";position:absolute;left:18px;right:18px;top:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.7}
h2{font-family:var(--f-display);font-weight:700;font-size:1.65rem;line-height:1.1;margin:0 0 12px;color:var(--gold2);text-wrap:balance;letter-spacing:.01em}
h3{font-family:var(--f-label);font-size:.7rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin:18px 0 8px}
p{margin:0 0 8px}
label.f{display:flex;flex-direction:column;gap:4px;font:600 .66rem var(--f-label);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);min-width:0}
input,select,textarea{font:inherit;font-family:var(--f-body);font-size:1rem;color:var(--fg);background:rgba(8,6,15,.55);border:1px solid var(--line2);border-radius:8px;padding:8px 10px;width:100%;min-width:0;text-transform:none;letter-spacing:0}
input:hover,select:hover,textarea:hover{border-color:#4d4180}
textarea{resize:vertical;min-height:70px;line-height:1.45}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,.pick:focus-visible,summary:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
fieldset{border:0;margin:0;padding:0;min-width:0}
.row{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.row.r3{grid-template-columns:repeat(auto-fit,minmax(115px,1fr))}
.btn{border:1px solid var(--line2);background:rgba(255,255,255,.045);color:var(--fg);border-radius:8px;padding:8px 13px;font:600 .9rem var(--f-body);cursor:pointer;transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--gold);background:rgba(217,173,91,.08)}
.btn.pri{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#1b1305;border-color:var(--gold);box-shadow:0 4px 14px rgba(217,173,91,.2)}
.btn.fear{background:linear-gradient(180deg,#c99af1,#8f55c9);color:#fff;border-color:#8f55c9}
.btn.danger{color:var(--hp)}
.btn.sm{padding:5px 10px;font-size:.84rem}
.btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid var(--line2);font:600 .76rem var(--f-body)}
.chip.pos{color:var(--ok);border-color:rgba(114,211,148,.35)}.chip.neg{color:var(--hp);border-color:rgba(242,107,99,.35)}
.muted{color:var(--muted)}.small{font-size:.88rem}
.warn{color:var(--hp);font-size:.88rem}.okc{color:var(--ok);font-size:.88rem}
.flexgap{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.note{background:var(--hope-soft);border:1px solid rgba(232,184,78,.3);border-radius:12px;padding:10px 14px;font-size:.93rem}
.note.fear{background:var(--fear-soft);border-color:rgba(183,131,234,.32)}
details.fold{margin-top:12px;border:1px solid var(--line2);border-radius:10px;padding:10px 12px;background:rgba(255,255,255,.02)}
details.fold.sm{margin-top:8px;padding:6px 10px}
details.fold summary{cursor:pointer;font:600 .72rem var(--f-label);letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.sumline{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;padding:10px 12px;border-radius:10px;background:rgba(255,255,255,.03);border:1px solid var(--line2);font-size:.92rem}
.sumline b{font:700 1.2rem var(--f-display);color:var(--gold2)}
/* cartes de choix */
.picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.pick{position:relative;text-align:left;border:1px solid var(--line2);background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.01)),var(--panel2);border-radius:14px;padding:14px;cursor:pointer;color:var(--fg);font:inherit;display:flex;flex-direction:column;gap:7px;min-width:0;transition:transform .15s,border-color .15s,box-shadow .15s}
.pick:hover{border-color:var(--gold);transform:translateY(-2px)}
.pick.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 10px 28px rgba(217,173,91,.18)}
.pick.on::after{content:"Choisi";position:absolute;top:10px;right:10px;font:700 .6rem var(--f-label);letter-spacing:.12em;text-transform:uppercase;background:var(--gold);color:#1b1305;padding:3px 8px;border-radius:999px}
.pick:disabled{opacity:.4;cursor:not-allowed;transform:none}
.pick .top{display:flex;gap:12px;align-items:center}
.emb{width:60px;height:60px;flex:none;filter:drop-shadow(0 4px 10px rgba(0,0,0,.4))}
.emb.sm{width:34px;height:34px}
.pick b{font:700 1.3rem var(--f-display);line-height:1.1}
.pick p{font-size:.88rem;margin:0}
.emb svg{width:100%;height:100%;display:block}
.portrait{width:100%;aspect-ratio:1;max-width:100%;border-radius:14px;overflow:hidden;background:var(--panel2);display:grid;place-items:center;border:1px solid var(--line);box-shadow:0 8px 24px rgba(0,0,0,.35)}
.portrait img,.portrait svg{width:100%;height:100%;object-fit:cover;display:block}
/* cartes de personnage */
.pcs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.pc{position:relative;border:1px solid var(--line);border-radius:16px;background:var(--panel);overflow:hidden;cursor:pointer;text-align:left;color:var(--fg);font:inherit;padding:0;display:flex;flex-direction:column;transition:transform .15s,border-color .15s,box-shadow .15s}
.pc:hover{transform:translateY(-3px);border-color:var(--gold);box-shadow:0 14px 34px rgba(0,0,0,.4)}
.pc .pimg{height:200px;position:relative;overflow:hidden}
.pc .pimg img,.pc .pimg svg{width:100%;height:100%;object-fit:cover;display:block}
.pc .pimg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(13,10,23,.95))}
.pc .pname{position:absolute;left:14px;right:14px;bottom:10px;z-index:1}
.pc .pname b{display:block;font:700 1.7rem var(--f-display);line-height:1;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.6)}
.pc .pname span{font:600 .64rem var(--f-label);letter-spacing:.12em;text-transform:uppercase;color:var(--gold2)}
.pc .pbody{padding:12px 14px 14px;display:flex;flex-direction:column;gap:7px}
.bar{height:6px;border-radius:4px;background:rgba(255,255,255,.07);overflow:hidden}
.bar i{display:block;height:100%;background:var(--c);box-shadow:0 0 10px var(--c)}
.barrow{display:grid;grid-template-columns:56px minmax(0,1fr) 40px;gap:8px;align-items:center;font-size:.76rem;font-variant-numeric:tabular-nums;color:var(--muted)}
/* traits et stats */
.traits{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
@media (max-width:640px){.traits{grid-template-columns:repeat(3,minmax(0,1fr))}}
.trait{border:1px solid var(--line2);border-radius:14px;padding:10px 6px;text-align:center;background:radial-gradient(circle at 50% 0%,rgba(217,173,91,.12),transparent 70%),var(--panel2);display:flex;flex-direction:column;gap:4px;align-items:center;min-width:0}
.trait b{font:600 .62rem var(--f-label);letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.trait input[type=number]{text-align:center;font:700 1.9rem var(--f-display);padding:0;border:0;background:transparent;width:70px;color:var(--fg)}
.trait select{text-align:center;font-weight:700;padding:4px}
.trait .verbs{font-size:.68rem;color:var(--muted);line-height:1.25}
.trait label{font-size:.7rem;color:var(--muted);display:flex;gap:4px;align-items:center}
.trait label input{width:auto}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:560px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{border:1px solid var(--line2);border-radius:12px;padding:10px 12px;background:var(--panel2);min-width:0}
.stat small{display:block;font:600 .6rem var(--f-label);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.stat strong{font:700 2rem var(--f-display);line-height:1.05;font-variant-numeric:tabular-nums;color:var(--fg)}
.thresh{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.thresh .seg{padding:5px 10px;border-radius:8px;background:var(--panel2);border:1px solid var(--line2);font-size:.82rem}
.thresh .num{font:700 1.5rem var(--f-display);padding:0 4px;color:var(--gold2)}
.track{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:10px;align-items:center;margin-bottom:12px}
@media (max-width:480px){.track{grid-template-columns:minmax(0,1fr) auto}.track .slots{grid-column:1/-1;order:3}}
.track .lab{font:600 .66rem var(--f-label);letter-spacing:.12em;text-transform:uppercase}
.slots{display:flex;flex-wrap:wrap;gap:6px}
.slot{width:26px;height:26px;border-radius:7px;border:1.5px solid var(--c);background:rgba(255,255,255,.02);cursor:pointer;padding:0;transition:background .12s,box-shadow .12s}
.slot:hover{box-shadow:0 0 0 3px rgba(255,255,255,.06)}
.slot.on{background:var(--c);box-shadow:0 0 12px var(--c)}
@media (pointer:coarse){.slot{width:32px;height:32px}.btn{padding:10px 14px}.btn.sm{padding:7px 11px}}
.slot.dia{transform:rotate(45deg) scale(.82);border-radius:5px}
.track .cnt{font:600 .85rem var(--f-body);color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.feat{border-left:2px solid var(--fear);padding:4px 0 4px 12px;margin:10px 0}
.feat.hope{border-color:var(--hope)}.feat.anc{border-color:var(--stress)}
.feat b{display:block;font:700 1.12rem var(--f-display);color:var(--fg)}.feat p{margin:2px 0 0;font-size:.93rem;color:#d6cfe9}
.tag{font:600 .6rem var(--f-label);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
/* dés */
.dice{display:flex;gap:22px;align-items:center;justify-content:center;padding:22px 0 16px}
.die{width:78px;height:78px;display:grid;place-items:center;font:700 2.2rem var(--f-display);border-radius:16px;transform:rotate(45deg)}
.die span{transform:rotate(-45deg)}
.die.h{background:radial-gradient(circle at 30% 30%,rgba(243,211,148,.35),rgba(232,184,78,.08));color:var(--gold2);border:1.5px solid var(--hope);box-shadow:0 0 26px rgba(232,184,78,.3)}
.die.f{background:radial-gradient(circle at 30% 30%,rgba(201,154,241,.35),rgba(183,131,234,.08));color:#e2c9fb;border:1.5px solid var(--fear);box-shadow:0 0 26px rgba(183,131,234,.3)}
.result{text-align:center;font:700 1.45rem var(--f-display);color:var(--fg)}
.log{max-height:220px;overflow:auto;font-size:.88rem;border-top:1px solid var(--line2);margin-top:12px;padding-top:6px}
.log div{padding:4px 0;border-bottom:1px dashed var(--line2)}
@media (prefers-reduced-motion:no-preference){.die{transition:transform .4s cubic-bezier(.3,1.6,.5,1)}.rolling .die{transform:rotate(225deg)}}
.item{border:1px solid var(--line2);border-radius:12px;padding:12px;background:var(--panel2);display:flex;flex-direction:column;gap:8px;margin-bottom:10px;min-width:0}
.itemhead{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.card{border-top:3px solid var(--dc,var(--fear))}
.adv{display:grid;grid-template-columns:70px minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:center;margin-bottom:8px}
@media (max-width:560px){.adv{grid-template-columns:minmax(0,1fr)}}
.adv b{font:700 1.15rem var(--f-display);color:var(--gold2)}
/* armes et inventaire */
.wgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.wcard{border:1px solid var(--line);border-radius:14px;padding:12px;background:radial-gradient(circle at 0% 0%,rgba(217,173,91,.10),transparent 60%),var(--panel2);min-width:0}
.wcard-top{display:flex;gap:10px;align-items:center}
.wcard-top b{font:700 1.25rem var(--f-display)}
.wstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:10px}
.wstats span{background:rgba(255,255,255,.03);border:1px solid var(--line2);border-radius:8px;padding:6px 8px;font-size:.88rem;min-width:0}
.wstats small{display:block;font:600 .56rem var(--f-label);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.inv{border:1px solid var(--line2);border-radius:12px;padding:10px 12px;background:var(--panel2);margin-bottom:8px;min-width:0}
.inv.on{border-color:rgba(217,173,91,.45);box-shadow:inset 3px 0 0 var(--gold)}
.inv-top{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.inv-name{border:0;background:transparent;font:700 1.12rem var(--f-display);padding:2px 4px;flex:1 1 140px}
.inv-name:hover{background:rgba(255,255,255,.04)}
.tagcat{font:600 .58rem var(--f-label);letter-spacing:.12em;text-transform:uppercase;color:var(--gold);border:1px solid var(--line);border-radius:999px;padding:3px 8px;flex:none}
.qty{display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
/* assistant */
.steps{display:flex;gap:4px;overflow-x:auto;padding-bottom:8px;margin-bottom:14px;scrollbar-width:none}
.steps button{flex:none;border:1px solid var(--line2);background:rgba(255,255,255,.03);color:var(--muted);border-radius:999px;padding:7px 12px;font:600 .66rem var(--f-label);letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
.steps button.on{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#1b1305;border-color:var(--gold)}
.steps button.done{color:var(--ok);border-color:rgba(114,211,148,.35)}
.wizgrid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
@media (max-width:900px){.wizgrid{grid-template-columns:minmax(0,1fr)}.preview{position:static!important}}
.preview{position:sticky;top:70px}
.wiznav{display:flex;justify-content:space-between;gap:8px;margin-top:16px;flex-wrap:wrap}
table.t{width:100%;border-collapse:collapse;font-size:.9rem;font-variant-numeric:tabular-nums}
table.t th,table.t td{text-align:left;padding:8px;border-bottom:1px solid var(--line2);vertical-align:top}
table.t th{font:600 .6rem var(--f-label);letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
table.t tr.dis{opacity:.4}
table.t tr.sel{background:var(--hope-soft)}
.scroll{overflow-x:auto}
/* MJ */
.fearbig{display:flex;flex-wrap:wrap;gap:8px}
.fearbig .slot{width:36px;height:36px;transform:rotate(45deg) scale(.8)}
.cd{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;border:1px solid var(--line2);border-radius:12px;padding:10px;margin-bottom:8px;background:var(--panel2)}
.ref p,.ref li{font-size:.94rem;color:#d6cfe9}
.ref ul{margin:4px 0 8px;padding-left:18px}
.ref b{color:var(--fg)}
.empty{text-align:center;padding:34px 10px;color:var(--muted)}
.empty .emb{width:90px;height:90px;margin:0 auto 10px}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:8px}

","Arpenteur de failles","Arcane",6,"Sort",2,"Incantation (15) : posez une marque ; la prochaine incantation réussie ouvre un passage pour y revenir."],["Telekinesis","Télékinésie","Arcane",6,"Sort",0,"Incantation à longue portée : déplacez la cible par la pensée, ou lancez-la sur une autre (d12+4 physiques x Compétence)."],["Arcana-Touched","Touché par l’Arcane","Arcane",7,"Capacité",2,"Avec 4 cartes Arcane ou plus en main : +1 aux incantations et, 1 fois par repos, inversez dé d’Espoir et dé de Peur."],["Cloaking Blast","Souffle d’invisibilité","Arcane",7,"Sort",2,"Après une autre incantation réussie, 1 Espoir : vous devenez Camouflé tant que vous restez immobile et n’attaquez pas."],["Arcane Reflection","Reflet arcanique","Arcane",8,"Sort",1,"Face à des dégâts magiques, dépensez des Espoirs : 1d6 par Espoir, un 6 renvoie l’attaque à son lanceur."],["Confusing Aura","Aura troublante","Arcane",8,"Sort",2,"Incantation (14), 1 fois par long repos : couches d’illusion (+1 par Stress marqué). Chaque attaque contre vous : un 5+ sur les d6 détruit une couche et l’attaque échoue."],["Earthquake","Séisme","Arcane",9,"Sort",2,"Incantation (16), 1 fois par repos : tout ce qui ne vole pas à très longue portée fait une réaction (18) ; échec 3d10+8 physiques et Vulnérable, réussite moitié."],["Sensory Projection","Projection sensorielle","Arcane",9,"Sort",0,"Incantation (15), 1 fois par repos : voyez et entendez un lieu déjà visité comme si vous y étiez, sans être détectable."],["Adjust Reality","Ajuster la réalité","Arcane",10,"Sort",1,"Après un jet d’un allié ou de vous, dépensez 5 Espoir pour choisir le résultat (plausible avec ces dés)."],["Falling Sky","Ciel qui tombe","Arcane",10,"Sort",1,"Incantation contre tous les adversaires à longue portée : 1d20+2 magiques par Stress marqué."],["Get Back Up","Se relever","Lame",1,"Capacité",1,"Face à des dégâts Graves, marquez 1 Stress pour les réduire d’un cran."],["Not Good Enough","Pas assez bon","Lame",1,"Capacité",1,"Relancez l function beastHtml(c){if(c.classe!=="druide")return"";const t=tier(c.level);
 return `<details class="fold"><summary>Formes bestiales accessibles (rang ${t} et moins)</summary><p class="small muted" style="margin-top:6px">1 Stress pour vous transformer. En forme bestiale : bonus de trait et d’Esquive, attaque de la bête, avantage sur les actions listées ; vous ne lancez pas de sorts.</p>${BEASTS.filter(b=>b.tier<=t).map(b=>`<div class="feat"><span class="tag">Rang ${b.tier}${b.ex?" &middot; "+esc(b.ex):""}</span><b>${esc(b.n)}</b><p class="small">${[b.trait,b.ev?"Esquive "+b.ev:"",b.atk].filter(Boolean).join(" &middot; ")}${b.adv?`<br>Avantage : ${esc(b.adv)}`:""}</p>${b.f.map(f=>`<p class="small"><b>${esc(f[0])}</b> : ${esc(f[1])}</p>`).join("")}</div>`).join("")}</details>`}
function subFeats(c){const cl=CLASSES[c.classe],sb=cl&&cl.subs[c.sub];if(!sb)return[];const n=advCount(c,"sub"),x=SUBX[c.sub]||{},out=(sb.f||[]).map(f=>["Fondation",f[0],f[1]]);
 if(n>=1)(x.spec||[]).forEach(f=>out.push(["Spécialisation",f[0],f[1]]));if(n>=2)(x.mast||[]).forEach(f=>out.push(["Maîtrise",f[0],f[1]]));return out}

const partyPath=c=>"table/party/"+(c.owner||L.me.id)+"~"+c.id;const partySent={};
function publishParty(c){if(L.mode!=="db"||!db)return;if(c.owner&&c.owner!==L.me.id&&!L.me.canEdit)return;const s=partySummary(c);if(!s)return;

 dirty.add(c.id);clearTimeout(timers[c.id]);timers[c.id]=setTimeout(()=>flushChar(c.id),700)}
async function flushChar(id){if(inflight[id]){timers[id]=setTimeout(()=>flushChar(id),400);return}
 const c=L.chars.find(x=>x.id===id);if(!c){dirty.delete(id);return}
 inflight[id]=true;try{await db.doc(charPath(c)).set(clean(c));touchIndex(c.owner);publishParty(c)}catch(e){toast("Enregistrement refusé : vous n’avez pas les droits d’écriture sur cette table.")}inflight[id]=false;dirty.delete(id)}

  watch(id);

   db.collection("players").onSnapshot(s=>{s.docs.forEach(d=>watch(d.id))},()=>{});

function consume(c,list){list.forEach(e=>{if(e.dur==="next")e.gone=true;else if(e.dur==="uses"){e.uses=(+e.uses||1)-1;if(e.uses<=0)e.gone=true}});c.effects=(c.effects||[]).filter(e=>!e.gone)}

/* =================== CALCULS =================== */
const tier=l=>l>=8?4:l>=5?3:l>=2?2:1;
function advCount(c,k){let n=0;for(let l=2;l<=c.level;l++)(c.adv[l]||[]).forEach(x=>{if(x===k)n++});return n}
function scTrait(c){const s=CLASSES[c.classe]?.subs[c.sub];return s?s.sc:""}
function effTraits(c){const out={};TRAITS.forEach(([k])=>out[k]=+(c.traits[k].v??0));
 [c.armor,c.prim,c.sec].forEach(o=>{if(o&&o.trm)for(const k in o.trm)out[k]+=o.trm[k]});return out}
function derive(c){
 const cl=CLASSES[c.classe];if(!cl)return null;const L_=+c.level||1;
 const prof=1+(L_>=2)+(L_>=5)+(L_>=8)+advCount(c,"prof");
 const E_=t=>effs(c,[t]).val;
 const hp=Math.min(12,E_("hp")+cl.hp+advCount(c,"hp")+(c.anc1==="geant"?1:0)+(c.classe==="magicien"&&c.sub==="war"?1:0));
 const st=Math.min(12,E_("stress")+6+advCount(c,"stress")+(c.anc1==="humain"?1:0)+(c.classe==="gardien"&&c.sub==="vengeance"?1:0));
 const wev=(c.prim?.ev||0)+(c.sec?.ev||0),warm=(c.prim?.arm||0)+(c.sec?.arm||0);
 const ev=cl.ev+(+c.armor.ev||0)+wev+advCount(c,"evasion")+(c.anc2==="simiah"?1:0)+(+c.extraEv||0)+E_("evasion");
 const tierN=tier(L_),bareBones=c.armor.preset==="none"&&(c.cards||[]).some(x=>x.loc!=="vault"&&(x.name==="Bare Bones"||x.name==="Os à nu"));
 let major,severe;if(bareBones){[major,severe]=[[9,19],[11,24],[13,31],[15,38]][tierN-1]}else if(c.armor.preset==="none"){major=L_;severe=2*L_}else{major=(+c.armor.major||0)+L_;severe=(+c.armor.severe||0)+L_}
 const subUp=advCount(c,"sub"),stalwart=c.classe==="gardien"&&c.sub==="stalwart"?1+(subUp>=1?2:0)+(subUp>=2?3:0):0;
 const bonus=E_("thresholds")+stalwart+(c.anc1==="galapa"?prof:0);major+=bonus;severe+=bonus;
 const armor=Math.max(0,Math.min(12,(bareBones?3+(+effTraits(c).force||0):(+c.armor.score||0))+warm+E_("armor")));
 const cards=2+(L_-1)+advCount(c,"card")+(c.classe==="magicien"&&c.sub==="knowledge"?1:0);
 const exps=2+(L_>=2)+(L_>=5)+(L_>=8);
 return{hopeMax:Math.max(0,6-(+c.scars||0)),prof,hp,st,ev,major,severe,armor,cards,exps,tier:tier(L_),tr:effTraits(c)};
}

function validate(c){const e=[];
 if(!c.classe)e.push("Choisissez une classe.");if(!c.sub)e.push("Choisissez une sous-classe.");

 const vals=TRAITS.map(([k])=>c.traits[k].v);if(vals.some(v=>v===null||v===""))e.push("Attribuez les 6 traits.");
 else{const s=[...vals].map(Number).sort((a,b)=>b-a).join();if(s!==ARRAY.join())e.push("Les traits doivent utiliser exactement +2, +1, +1, 0, 0, −1.")}

function genStory(c){const S_=STORY,cl=c.classe||"guerrier";const who=c.name||"Ce personnage";

 const answers={};(S_.ans[cl]||[]).forEach((opts,i)=>answers[i]=pick(opts));
 const origin=c.comm?pick(S_.comm[c.comm]):"a grandi sur les routes";
 const notes=`${who} ${origin}. Tout a basculé avec ${pick(S_.event)}. Aujourd’hui, son but : ${pick(S_.goal)}.\nSecret : ${pick(S_.secret)}.\nPeur : ${pick(S_.fear)}.\nAccroche pour le MJ : ${pick(S_.hook)}`;
 const others=L.chars.filter(x=>x.id!==c.id&&x.name).map(x=>x.name);const n1=others.length?pick(others):"un autre membre du groupe";

 return{look,answers,links,notes}}

function wTraits(c){const cl=CLASSES[c.classe];const used=TRAITS.map(([k])=>c.traits[k].v).filter(v=>v!==null&&v!=="").map(Number);

 <div class="flexgap" style="margin-bottom:12px">${cl?`<button class="btn sm" data-act="rectraits">Répartition conseillée pour ${cl.n}</button>`:""}<button class="btn sm" data-act="cleartraits">Effacer</button><span class="small">Restant : <b>${left.length?left.map(sign).join(", "):"aucun"}</b></span></div>
 <div class="traits">${TRAITS.map(([k,n,vb])=>{const cur=c.traits[k].v;const avail=[...new Set([...left,...(cur!==null&&cur!==""?[+cur]:[])])].sort((a,b)=>b-a);

function wExp(c){return `<section class="box"><h2>Expériences</h2><p class="small muted">Deux Expériences à +2. Une Expérience est un mot ou une courte phrase qui décrit un savoir-faire, un passé ou un trait. En jeu, dépensez 1 Espoir pour ajouter son bonus à un jet où elle s’applique. Évitez les expériences trop larges comme « Chanceux » ou « Bon en combat ».</p>

const THEMES=["auto","nuit","parchemin"],THEME_N={auto:"Thème auto",nuit:"Thème Nuit",parchemin:"Thème Parchemin"};
function themePref(){try{return localStorage.getItem("dh-theme")||"auto"}catch(e){return"auto"}}

function cycleTheme(){const p=themePref(),n=THEMES[(THEMES.indexOf(p)+1)%3];try{localStorage.setItem("dh-theme",n)}catch(e){}applyTheme();toast(THEME_N[n]+(n==="auto"?" : suit le réglage de l’appareil":""))}
try{matchMedia("(prefers-color-scheme: light)").addEventListener("change",applyTheme)}catch(e){}
(function(){const r=document.querySelector("header.top .roles");if(r&&!document.getElementById("thm")){const b=document.createElement("button");b.id="thm";b.type="button";b.onclick=cycleTheme;r.appendChild(b)}applyTheme()})();

 const tab={table:gTable,rencontre:gEnc,butin:()=>`<div style="max-width:820px">${gLoot()}</div>`,regles:gRules,notes:gNotes,admin:gAdmin}[L.gtab]||gTable;
 return `<nav class="tabs">${(SRV.on?GTABS.concat([["admin","Admin"]]):GTABS).map(([k,n])=>`<button class="${L.gtab===k?"on":""}" data-gtab="${k}">${n}</button>`).join("")}</nav>${tab()}`}
function pendingFear(){const t=L.table,cnt=t.counted||{};let n=0;L.chars.forEach(c=>(c.rolls||[]).forEach(r=>{if(r.fear&&r.ts&&r.ts>(cnt[c.id]||0))n++}));return n}
function gTable(){const t=L.table;const pf=L.mode==="db"?pendingFear():0;
 return `<div class="grid"><div class="col"><section class="box"><h2>Peur : ${t.fear||0}/12</h2><div class="fearbig">${Array.from({length:12},(_,i)=>`<button class="slot ${i<(t.fear||0)?"on":""}" style="--c:var(--fear)" data-fear="${i}" aria-label="Peur ${i+1}"></button>`).join("")}</div>
 <div class="flexgap" style="margin-top:10px"><button class="btn sm" data-act="fear" data-k="-1">−1</button><button class="btn sm fear" data-act="fear" data-k="1">+1</button><button class="btn sm" data-act="fearrest" data-k="short">Court repos des PJ (+1d4)</button><button class="btn sm" data-act="fearrest" data-k="long">Long repos (+1d4 + nb PJ)</button></div>${pf?`<div class="note fear" style="margin-top:10px"><div class="flexgap" style="justify-content:space-between"><span><b>${pf}</b> jet${pf>1?"s":""} de joueur avec Peur pas encore compté${pf>1?"s":""}.</span><button class="btn sm fear" data-act="countfear">Ajouter ${pf} Peur</button></div></div>`:""}<label class="small flexgap" style="margin-top:10px"><input type="checkbox" data-tp="hideHp" ${t.hideHp?"checked":""} style="width:auto"> Masquer les PV du groupe aux joueurs</label><p class="small muted" id="fearres" style="margin-top:6px">Visible par les joueurs. La Peur se gagne quand un PJ obtient un résultat avec Peur.</p></section>
 <section class="box"><h2>Comptes à rebours</h2>${(t.cds||[]).map((x,i)=>`<div class="cd"><div style="min-width:0"><input data-tp="cds.${i}.name" value="${esc(x.name)}" aria-label="Nom"><div class="flexgap" style="margin-top:6px"><div class="slots">${Array.from({length:x.max},(_,j)=>`<button class="slot ${j<x.v?"on":""}" style="--c:var(--hope)" data-cd="${i}" data-i="${j}" aria-label="Case ${j+1}"></button>`).join("")}</div></div></div>
  <div class="flexgap" style="flex-direction:column"><label class="small flexgap"><input type="checkbox" data-tp="cds.${i}.pub" ${x.pub?"checked":""} style="width:auto">Public</label><button class="btn sm danger" data-act="delcd" data-i="${i}">✕</button></div></div>`).join("")||`<p class="small muted">Aucun compte à rebours.</p>`}
 <div class="flexgap"><input id="cdname" placeholder="Ex. : Le rituel s’achève" style="flex:1 1 180px"><input id="cdmax" type="number" value="6" min="1" max="12" style="width:70px" aria-label="Taille"><button class="btn sm" data-act="addcd">Ajouter</button></div></section></div>
 <div class="col"><section class="box"><h2>Personnages joueurs</h2>${L.chars.length?L.chars.map(c=>{const d=derive(c);if(!d)return"";return `<div class="item"><div class="itemhead"><b style="font:700 1.15rem var(--f-display)">${esc(c.name||"Sans nom")}</b><div class="flexgap"><button class="btn sm" data-act="pdfof" data-k="${esc(c.id)}">PDF</button>${SRV.on&&c.owner&&c.owner!==L.me.id?`<span class="small muted">Joueur : ${esc(c.owner.slice(2))}</span><button class="btn sm" data-act="resetpin" data-k="${esc(c.owner.slice(2))}">Code provisoire</button>`:""}<button class="btn sm" data-open="${c.id}">Fiche</button></div></div>${(c.effects||[]).filter(e=>e.on).length?`<div class="flexgap">${c.effects.filter(e=>e.on).map(e=>`<span class="chip" style="color:${+e.val<0||+e.adv<0?"var(--hp)":"var(--ok)"}">${esc(e.name)} ${effLabel(e)}</span>`).join("")}</div>`:""}<span class="small muted">${CLASSES[c.classe].n} ${c.level} &middot; Esquive ${d.ev} &middot; Seuils ${d.major}/${d.severe} &middot; Armure ${c.armorUsed}/${d.armor}</span>${bars(c)}</div>`}).join(""):`<p class="small muted">Aucun personnage à la table.</p>`}</section></div></div>`}
const BESTIARY=[["Acid Burrower","Fouisseur acide",1,"solo",14,8,15,8,3,3,"1d12+2 phys.","Très courte","Fouir, entraîner, se nourrir, se repositionner",[["Implacable (3)","P","Peut être activé jusqu’à 3 fois par tour du MJ. Dépensez de la Peur comme d’habitude pour l’activer."],["Éruption","A","**Marquez 1 Stress** : le Fouisseur jaillit du sol. Toutes les créatures à très courte portée doivent réussir un jet de réaction d’Agilité ou être renversées, ce qui les rend Vulnérables jusqu’à leur prochaine action."],["Crachat acide","A","Attaque contre toutes les cibles devant le Fouisseur à courte portée. Les cibles touchées subissent **2d6** dégâts physiques et doivent marquer une case d’armure sans en tirer d’effet (elles peuvent quand même utiliser leur armure pour réduire les dégâts). Si elles ne peuvent pas marquer de case d’armure, elles marquent 1 PV supplémentaire et vous gagnez 1 Peur."],["Bain d’acide","R","Quand le Fouisseur subit des dégâts Graves, toutes les créatures à courte portée sont aspergées de son sang acide et subissent **1d10** dégâts physiques. Le sang recouvre le sol à très courte portée : toute créature autre que le Fouisseur qui le traverse subit **1d6** dégâts physiques."]]],["Adult Flickerfly","Scintilleur adulte",3,"solo",17,20,35,12,6,3,"3d20 phys.","Très courte","Collectionner ce qui brille, chasser, nicher, piquer",[["Implacable (4)","P","Peut être activé jusqu’à 4 fois par tour du MJ. Dépensez de la Peur comme d’habitude pour l’activer."],["Jamais ne rate","P","Quand le Scintilleur attaque, l’Esquive de la cible est divisée par deux contre cette attaque."],["Vol mortel","P","En vol, le Scintilleur peut se déplacer jusqu’à longue portée (au lieu de courte) avant d’agir."],["Tourbillon","A","**Dépensez 1 Peur** : le Scintilleur tournoie et attaque toutes les cibles à très courte portée. Les cibles touchées subissent **3d8** dégâts physiques directs."],["Danse mentale","A","**Marquez 1 Stress** : le Scintilleur crée un spectacle magique éblouissant qui happe l’esprit des ennemis proches. Toutes les cibles à courte portée font un jet de réaction d’Instinct. Pour chaque échec, vous gagnez 1 Peur et le Scintilleur apprend l’une des peurs de la cible."],["Souffle hallucinogène · Compte à rebours (boucle 1d6)","R","Lancez le compte à rebours la première fois que le Scintilleur subit des dégâts. Quand il se déclenche, il souffle un gaz hallucinogène sur toutes les cibles devant lui jusqu’à longue portée. Elles font un jet de réaction d’Instinct ou sont tourmentées par des visions terrifiantes (désavantage si le Scintilleur connaît leurs peurs). En cas d’échec, elles perdent 2 Espoir et subissent **3d8+3** dégâts magiques directs."],["Réflexes surnaturels","R","Quand le Scintilleur subit des dégâts d’une attaque à courte portée, vous pouvez **marquer 1 Stress** pour qu’il n’en subisse que la moitié."]]],["Apprentice Assassin","Apprenti assassin",2,"minion",13,0,0,1,1,-1,"4 phys.","Très courte","Prendre des risques, tuer, faire ses preuves",[["Sbire (6)","P","Vaincu dès qu’il subit des dégâts. Tous les 6 dégâts qu’un PJ lui inflige, un autre sbire à portée que l’attaque aurait touché est aussi vaincu."],["Attaque groupée","A","**Dépensez 1 Peur**, choisissez une cible et activez tous les sbires de ce type à courte portée d’elle. Ils se placent au corps à corps et font un seul jet d’attaque commun. En cas de réussite, chacun inflige 4 dégâts physiques ; additionnez-les."]]],["Arch-Necromancer","Archi-nécromancien",4,"leader",21,33,66,9,8,6,"4d12+8 mag.","Longue","Corrompre, décomposer, fuir pour revenir, ressusciter",[["Danse macabre","A","**Marquez 1 Stress** pour activer **1d4** alliés. Leurs attaques pendant cette activation infligent la moitié des dégâts, ou la totalité si vous **dépensez 1 Peur**."],["Rayon de décrépitude","A","**Marquez 2 Stress** : toutes les cibles à longue portée font un jet de réaction de Force. En cas d’échec, elles subissent **2d20+12** dégâts magiques et vous gagnez 1 Peur ; en cas de réussite, la moitié. Une cible qui marque 2 PV ou plus marque aussi **2 Stress** et est Vulnérable jusqu’à son prochain résultat avec Espoir."],["Ouvrir les portes de la mort","A","**Dépensez 1 Peur** pour invoquer une Légion de zombies, qui apparaît à courte portée et est activée immédiatement."],["Pas aujourd’hui, mes chers","R","Quand le Nécromancien a marqué 7 PV ou plus, vous pouvez **dépenser 1 Peur** pour qu’il se téléporte en lieu sûr afin de récupérer. Un PJ qui réussit un jet d’Instinct peut suivre la trace de cette magie jusqu’à sa destination."],["Ta vie m’appartient · Compte à rebours (boucle 2d6)","R","Lancez le compte à rebours quand le Nécromancien a marqué 6 PV ou plus. Quand il se déclenche, infligez **2d10+6** dégâts magiques directs à une cible à courte portée. Le Nécromancien **récupère autant de Stress ou de PV** que la cible a marqué de PV avec cette attaque."]]],["Archer Guard","Garde archer",1,"ranged",10,4,8,3,2,1,"1d8+3 phys.","Longue","Arrêter, fermer les portes, tenir, clouer sur place",[["Tir handicapant","A","Attaque contre une cible à longue portée. En cas de réussite, **marquez 1 Stress** pour infliger **1d12+3** dégâts physiques. Si la cible marque des PV avec cette attaque, elle a le désavantage aux jets d’Agilité jusqu’à ce qu’elle récupère au moins 1 PV."]]],["Archer Squadron","Escouade d’archers",2,"horde",13,8,16,4,3,0,"2d6+3 phys.","Longue","Rester groupés, survivre, tirer en salve",[["Horde (1d6+3)","P","Quand la horde a marqué la moitié de ses PV ou plus, son attaque standard inflige **1d6+3** dégâts physiques à la place."],["Volée concentrée","A","**Dépensez 1 Peur** et ciblez un point à longue portée. Attaque avec avantage contre toutes les cibles à courte portée de ce point. Les cibles touchées subissent **1d10+4** dégâts physiques."],["Tir de barrage","A","**Marquez 1 Stress** et ciblez un point à longue portée. Jusqu’au prochain résultat avec Peur, toute créature qui entre à courte portée de ce point fait un jet de réaction d’Agilité. En cas d’échec, elle subit **2d6+3** dégâts physiques ; en cas de réussite, la moitié."]]],["Assassin Poisoner","Assassin empoisonneur",2,"skulk",14,8,16,4,4,3,"2d8+1 phys.","Courte","Anticiper, être payé, tuer, empoisonner",[["Venin de grincedent","P","Les cibles qui marquent des PV à cause des attaques de l’Assassin sont Vulnérables jusqu’à ce qu’elles récupèrent 1 PV."],["Surgi de nulle part","P","L’Assassin a l’avantage à ses attaques quand il est Caché."],["Fumigation","A","L’Assassin lâche une bombe fumigène qui emplit la zone à courte portée et Étourdit toutes les cibles qui s’y trouvent. Une cible Étourdie a le désavantage à son prochain jet d’action, puis l’état disparaît."]]],["Battle Box","Cube de combat",2,"solo",15,10,20,8,6,2,"2d6+3 phys.","Mêlée","Changer de tactique, piétiner, se déguiser",[["Implacable (2)","P","Peut être activé jusqu’à 2 fois par tour du MJ. Dépensez de la Peur comme d’habitude pour l’activer."],["Tactique aléatoire","A","**Marquez 1 Stress** et lancez **1d6** ; le Cube utilise la manœuvre correspondante. 1. Rayon de mana : attaque contre une cible à longue portée ; en cas de réussite, **2d10+2** dégâts magiques. 2. Jets de flammes : il s’élève en tournoyant et crache du feu ; attaque contre toutes les cibles à courte portée, **2d8** dégâts physiques aux cibles touchées. 3. Piétinement : il fuse en tous sens ; attaque contre tous les PJ à courte portée, **1d6+5** dégâts physiques aux cibles touchées, qui sont Vulnérables jusqu’à leur prochain résultat avec Espoir. 4. Gaz électrique : toutes les cibles à courte portée doivent réussir un jet de réaction de Finesse ou marquer 3 Stress. 5. Claquement étourdissant : toutes les cibles à très courte portée doivent réussir un jet de réaction de Force ou être Vulnérables jusqu’à la destruction du Cube. 6. Bourdonnement psionique : toutes les cibles à courte portée doivent réussir un jet de réaction de Présence ou subir **2d4+9** dégâts magiques directs."],["Surcharge","R","Avant de lancer les dégâts d’une attaque du Cube, vous pouvez **marquer 1 Stress** pour ajouter **1d6** aux dégâts. Vous gagnez aussi 1 Peur."],["Séisme final","R","Quand le Cube marque son dernier PV, la magie qui l’anime se rompt dans une explosion de force. Toutes les cibles à courte portée doivent réussir un jet de réaction d’Instinct ou subir **2d8+1** dégâts magiques."]]],["Bear","Ours",1,"bruiser",14,9,17,7,2,1,"1d8+3 phys.","Mêlée","Grimper, défendre son territoire, cogner, pister",[["Force écrasante","P","Les cibles qui marquent des PV à cause de l’attaque standard de l’Ours sont repoussées à très courte portée."],["Morsure","A","**Marquez 1 Stress** pour attaquer une cible au corps à corps. En cas de réussite, elle subit **3d4+10** dégâts physiques et est Bloquée jusqu’à ce qu’elle se libère avec un jet de Force réussi."],["Élan","R","Quand l’adversaire réussit une attaque contre un PJ, vous gagnez 1 Peur."]]],["Bladed Guard","Garde armé",1,"standard",12,5,9,5,2,1,"1d6+1 phys.","Mêlée","Arrêter, fermer les portes, tenir",[["Mur de boucliers","P","Une créature qui tente de s’approcher à très courte portée du Garde doit réussir un jet d’Agilité. Si d’autres Gardes armés se tiennent en ligne à côté du premier, chacun au corps à corps d’un autre garde de la ligne, la Difficulté augmente du nombre total de gardes dans cette ligne."],["Arrestation","A","Attaque contre une cible à très courte portée. En cas de réussite, **marquez 1 Stress** pour la rendre Bloquée jusqu’à ce qu’elle se libère par une attaque, un jet de Finesse ou un jet de Force réussi."]]],["Brawny Zombie","Zombie costaud",1,"bruiser",10,8,15,7,4,2,"1d12+3 phys.","Très courte","Écraser, détruire, lancer des débris",[["Lent","P","Quand vous activez le Zombie et qu’il n’a pas de jeton sur sa fiche, il ne peut pas encore agir : placez un jeton sur sa fiche et décrivez ce qu’il prépare. Quand vous l’activez et qu’il a un jeton, retirez-le : il peut agir."],["Écarteler","A","Attaque standard avec avantage contre une cible que le Zombie a Bloquée. En cas de réussite, l’attaque inflige des dégâts directs."],["Déchirer","R","Quand le Zombie réussit une attaque standard, vous pouvez **marquer 1 Stress** pour rendre temporairement la cible Bloquée et l’obliger à marquer 2 Stress."]]],["Cave Ogre","Ogre des cavernes",1,"solo",13,8,15,8,3,1,"1d10+2 phys.","Très courte","Arracher des têtes, festoyer, piétiner, lancer",[["Montée en puissance","P","Vous devez **dépenser 1 Peur** pour activer l’Ogre. Quand il est activé, il peut porter son attaque standard contre toutes les cibles à portée."],["Brise-os","P","Les attaques de l’Ogre infligent des dégâts directs."],["Pluie de rochers","A","**Marquez 1 Stress** : l’Ogre ramasse des objets lourds et les lance sur toutes les cibles devant lui à longue portée. Faites une attaque contre elles. Les cibles touchées subissent **1d10+2** dégâts physiques. S’il en touche plus d’une, vous gagnez 1 Peur."],["Furie dévastatrice","R","Quand l’Ogre marque 2 PV ou plus, il peut se déchaîner. Déplacez-le jusqu’à un point à courte portée : il inflige **2d6+3** dégâts physiques directs à toutes les cibles sur son passage."]]],["Chaos Skull","Crâne du chaos",2,"ranged",15,8,16,5,4,2,"2d8+3 mag.","Courte","Ricaner, dévorer la magie, servir",[["Lévitation","P","Le Crâne flotte à un bon mètre du sol et ne peut pas être Bloqué."],["Protections","P","Le Crâne est résistant aux dégâts magiques."],["Explosion magique","A","**Marquez 1 Stress** pour attaquer toutes les cibles à courte portée. Les cibles touchées subissent **2d6+4** dégâts magiques."],["Siphon de magie","A","**Dépensez 1 Peur** pour attaquer un PJ à très courte portée qui possède un trait d’incantation. En cas de réussite, la cible marque **1d4** Stress et le Crâne récupère autant de Stress ; il peut aussitôt être activé à nouveau."]]],["Conscript","Conscrit",2,"minion",12,0,0,1,1,0,"6 phys.","Très courte","Obéir, encercler, survivre",[["Sbire (6)","P","Vaincu dès qu’il subit des dégâts. Tous les 6 dégâts qu’un PJ lui inflige, un autre sbire à portée que l’attaque aurait touché est aussi vaincu."],["Attaque groupée","A","**Dépensez 1 Peur**, choisissez une cible et activez tous les sbires de ce type à courte portée d’elle. Ils se placent au corps à corps et font un seul jet d’attaque commun. En cas de réussite, chacun inflige 6 dégâts physiques ; additionnez-les."]]],["Construct","Golem",1,"solo",13,7,15,9,4,4,"1d20 phys.","Mêlée","Détruire, servir son créateur, piétiner",[["Implacable (2)","P","Peut être activé jusqu’à 2 fois par tour du MJ. Dépensez de la Peur comme d’habitude pour l’activer."],["Structure fragile","P","Quand le Golem marque des PV à cause de dégâts physiques, il marque 1 PV supplémentaire."],["Piétinement","A","**Marquez 1 Stress** quand le Golem se déplace pour attaquer toutes les cibles sur son passage. Les cibles touchées subissent **1d8** dégâts physiques."],["Surcharge","R","Avant de lancer les dégâts d’une attaque du Golem, vous pouvez **marquer 1 Stress** pour obtenir un bonus de +10 aux dégâts. Le Golem peut ensuite être activé une nouvelle fois."],["Séisme final","R","Quand le Golem marque son dernier PV, la magie qui l’anime se rompt dans une explosion de force. Attaque avec avantage contre toutes les cibles à très courte portée. Les cibles touchées subissent **1d12+2** dégâts magiques."]]],["Courtesan","Courtisane",2,"social",13,7,13,3,4,-3,"1d4+3 phys.","Mêlée","Séduire, manœuvrer, trouver des protecteurs",[["Regard brûlant","R","Quand un PJ à courte portée fait un jet de Présence, vous pouvez **marquer 1 Stress** : la Courtisane jette un regard lourd de sens. Si la cible échoue, elle marque 2 Stress et est Vulnérable jusqu’à la fin de la scène ou jusqu’à ce qu’elle réussisse une action sociale contre la Courtisane. Si elle réussit, elle marque 1 Stress."]]],["Courtier","Courtisan",1,"social",12,4,8,3,4,-4,"1d4+2 phys.","Mêlée","Discréditer, gagner des faveurs, intriguer",[["Moquerie","A","**Marquez 1 Stress** : le Courtisan lance une raillerie et oblige une cible à courte portée à faire un jet de réaction de Présence (14) pour sauver la face. En cas d’échec, elle marque 2 Stress et est Vulnérable jusqu’à la fin de la scène."],["Bouc émissaire","A","**Dépensez 1 Peur** et ciblez un PJ. Le Courtisan convainc une foule ou une personnalité importante que la cible est responsable de leurs problèmes ou de leur malheur actuel."]]],["Cult Adept","Adepte du culte",2,"support",14,9,18,4,6,2,"2d4+3 mag.","Longue","Plaire, gêner, découvrir des secrets",[["Décharge débilitante","A","**Dépensez 1 Peur** pour porter une attaque standard contre une cible à portée. En cas de réussite, elle marque 1 Stress."],["Linceul des Déchus","A","**Marquez 1 Stress** pour envelopper un allié à courte portée d’un linceul protecteur jusqu’à ce que l’Adepte marque son dernier PV. Tant qu’il est Protégé, l’allié a la résistance à tous les dégâts."],["Chaînes d’ombre","A","**Dépensez 1 Peur** et choisissez un point à longue portée. Toutes les cibles à courte portée de ce point sont Bloquées par des chaînes de fumée jusqu’à ce qu’elles se libèrent avec un jet de Force ou d’Instinct réussi. Une cible ainsi Bloquée doit dépenser 1 Espoir pour faire un jet d’action."],["La peur nourrit","R","Deux fois par scène, quand un PJ obtient un échec avec Peur, l’Adepte récupère 1 Stress."]]],["Cult Fang","Croc du culte",2,"skulk",15,9,17,4,4,2,"2d8+4 phys.","Mêlée","Capturer, isoler, monter en grade",[["Étreinte de l’ombre","P","Le Croc peut grimper et marcher sur les surfaces verticales. **Marquez 1 Stress** pour passer d’une ombre à une autre à longue portée."],["Isoler le traînard","A","**Marquez 1 Stress** : une cible au corps à corps fait un jet de réaction d’Instinct. En cas d’échec, elle marque 2 Stress et est téléportée avec le Croc dans une ombre à longue portée, ce qui la rend temporairement Vulnérable. En cas de réussite, elle marque 1 Stress."]]],["Cult Initiate","Initié du culte",2,"minion",13,0,0,1,1,0,"5 phys.","Mêlée","Obéir, gagner en pouvoir",[["Sbire (6)","P","Vaincu dès qu’il subit des dégâts. Tous les 6 dégâts qu’un PJ lui inflige, un autre sbire à portée que l’attaque aurait touché est aussi vaincu."],["Attaque groupée","A","**Dépensez 1 Peur**, choisissez une cible et activez tous les sbires de ce type à courte portée d’elle. Ils se placent au corps à corps et font un seul jet d’attaque commun. En cas de réussite, chacun inflige 5 dégâts physiques ; additionnez-les."]]],["Deeproot Defender","Défenseur racinaire",1,"bruiser",10,8,14,7,3,2,"1d8+3 phys.","Courte","Embusquer, saisir, protéger",[["Frappe du sol","A","Le Défenseur frappe le sol et repousse toutes les cibles à très courte portée jusqu’à longue portée. Chaque cible ainsi repoussée marque 1 Stress."],["Saisir et traîner","A","Attaque contre une cible à courte portée. En cas de réussite, **dépensez 1 Peur** pour l’attirer au corps à corps, lui infliger **1d6+2** dégâts physiques et la rendre Bloquée jusqu’à ce que le Défenseur subisse des dégâts Graves."]]],["Demon of Avarice","Démon d’avarice",3,"support",17,15,29,6,5,2,"3d6+5 mag.","Mêlée","Consommer, attiser la cupidité, semer la discorde",[["L’argent parle","P","Les attaques contre le Démon ont le désavantage, sauf si l’attaquant dépense une poignée d’or. Le Démon commence avec autant de poignées que de PJ. Quand une cible marque des PV à cause de son attaque standard, elle peut dépenser une poignée d’or au lieu de marquer chaque PV (1 poignée par PV). Ajoutez au Démon chaque poignée dépensée ainsi par les PJ."],["Toujours plus","P","Ajoutez aux jets d’attaque du Démon un bonus égal à son nombre de poignées d’or."],["Le temps, c’est de l’argent","A","**Dépensez 3 poignées d’or (ou 1 Peur)** pour activer **1d4+1** alliés."]]],["Demon of Despair","Démon du désespoir",3,"skulk",17,18,35,6,5,3,"3d6+1 mag.","Longue","Propager la peur, rester dans l’ombre, saper le moral",[["Abîme du désespoir","P","Le Démon inflige le double de dégâts aux PJ qui ont 0 Espoir."],["Votre lutte est vaine","A","**Dépensez 1 Peur** pour accabler le moral de tous les PJ à longue portée. Ils remplacent leur dé d’Espoir par un **d8** jusqu’à ce qu’ils obtiennent une réussite avec Espoir ou jusqu’à leur prochain repos."],["Vos amis vous trahiront","R","Quand un PJ obtient un échec avec Peur, vous pouvez **marquer 1 Stress** pour que tous les autres PJ à courte portée perdent 1 Espoir."],["Élan","R","Quand l’adversaire réussit une attaque contre un PJ, vous gagnez 1 Peur."]]],["Demon of Hubris","Démon de l’orgueil",3,"leader",18,18,36,7,5,4,"3d10 phys.","Très courte","Mépriser, crier victoire trop tôt, prouver sa supériorité",[["Terrifiant","P","Quand il réussit une attaque, tous les PJ à longue portée perdent 1 Espoir et vous gagnez 1 Peur."],["Quitte ou double","P","Quand un PJ à longue portée rate un jet, il peut relancer son dé de Peur et garder le nouveau résultat. S’il échoue encore, il marque 2 Stress et le Démon récupère 1 Stress."],["Talent sans égal","A","**Marquez 1 Stress** pour infliger les dégâts de l’attaque standard du Démon à une cible à courte portée."],["La racine du mal","A","**Dépensez 1 Peur** pour activer deux autres Démons à longue portée."],["Vous ne faites pas le poids","R","Quand un PJ à courte portée du Démon rate un jet, il marque 1 Stress."]]],["Demon of Jealousy","Démon de la jalousie",3,"ranged",17,17,30,6,6,4,"3d8+3 mag.","Longue","Profiter du succès d’autrui, prendre, garder rancune",[["Esprit sans défense","P","L’attaque standard du Démon inflige des dégâts directs."],["À mon tour","R","Quand le Démon marque des PV à cause d’une attaque, **dépensez autant de Peur que de PV marqués** pour que l’attaquant marque le même nombre de PV."],["Rivalité","R","Quand une créature à courte portée subit des dégâts d’un autre adversaire, vous pouvez **marquer 1 Stress** pour ajouter **1d4** aux dégâts."],["Ce qui est à toi est à moi","R","Quand un PJ subit des dégâts Graves à très courte portée du Démon, vous pouvez e-souris vole au corps à corps de l’attaquant et l’attaque avec avantage. En cas de réussite, elle inflige **2d6+2** dégâts physiques."]]],["Dire Wolf","Loup sinistre",1,"skulk",12,5,9,4,3,2,"1d6+2 phys.","Mêlée","Défendre, harceler, encercler, pister",[["Tactique de meute","P","Si le Loup réussit une attaque standard et qu’un autre Loup sinistre est au corps à corps de la cible, il inflige **1d6+5** dégâts physiques au lieu de ses dégâts standards et vous gagnez 1 Peur."],["Coup au jarret","A","**Marquez 1 Stress** pour attaquer une cible au corps à corps. En cas de réussite, elle subit **3d4+10** dégâts physiques directs et devient Vulnérable jusqu’à ce qu’elle récupère au moins 1 PV."]]],["Dryad","Dryade",3,"leader",16,24,38,8,5,4,"3d10+1 phys.","Longue","Commander, cultiver, chasser les intrus, préserver la forêt",[["Massif de ronces","A","**Marquez 1 Stress** et ciblez un point à longue portée. Un tapis d’épines couvre la zone à courte portée de ce point. Toutes les cibles dans la zone subissent **2d6+2** dégâts physiques chaque fois qu’elles agissent. Pour en sortir, une cible doit réussir un jet de Finesse ou infliger plus de 20 dégâts à la Dryade en une attaque."],["Faire pousser","A","**Dépensez 1 Peur** pour faire pousser trois Pousses de sylvanien (sbires), qui apparaissent à courte portée et sont activées immédiatement."],["Nous ne faisons qu’un","R","Quand un allié meurt à courte portée, vous pouvez **dépenser 1 Peur** : sa force vitale retourne à la forêt et la Dryade récupère 2 PV et 2 Stress."]]],["Electric Eels","Anguilles électriques",2,"horde",14,10,20,5,3,0,"2d6+4 phys.","Mêlée","Fuir les gros, électrocuter",[["Horde (2d4+1)","P","Quand la horde a marqué la moitié de ses PV ou plus, son attaque standard inflige **2d4+1** dégâts physiques à la place."],["Choc paralysant","A","**Marquez 1 Stress** pour porter une attaque standard contre toutes les cibles à très courte portée. Vous gagnez 1 Peur par cible qui marque des PV."]]],["Elemental Spark","Étincelle élémentaire",3,"minion",15,0,0,1,1,0,"5 mag.","Courte","Exploser, consumer, grossir",[["Sbire (9)","P","Vaincu dès qu’il subit des dégâts. Tous les 9 dégâts qu’un PJ lui inflige, un autre sbire à portée que l’attaque aurait touché est aussi vaincu."],["Attaque groupée","A","**Dépensez 1 Peur**, choisissez une cible et activez tous les sbires de ce type à courte portée d’elle. Ils se placent au corps à corps et font un seul jet d’attaque commun. En cas de réussite, chacun inflige 5 dégâts physiques ; additionnez-les."]]],["Elite Soldier","Soldat d’élite",2,"standard",15,9,18,4,3,1,"2d8+4 phys.","Très courte","Gloire, ordre, alliances",[["Renfort","A","**Marquez 1 Stress** : le Soldat rejoint le corps à corps d’un allié et porte une attaque standard contre une cible à très courte portée. En cas de réussite, il inflige **2d10+2** dégâts physiques et l’allié peut récupérer 1 Stress."],["Loyauté du vassal","R","Quand le Soldat est à très courte portée d’un chevalier ou d’un autre noble qui va subir des dégâts, vous pouvez **marquer 1 Stress** pour qu’il s’interpose au corps à corps et subisse les dégâts à sa place."]]],["Failed Experiment","Expérience ratée",2,"standard",13,12,23,3,3,1,"2d6+5 phys.","Mêlée","Dévorer, chasser, pister",[["Robustesse difforme","P","L’Expérience est résistante aux dégâts physiques."],["Submerger","P","Quand la cible de l’Expérience a d’autres adversaires à très courte portée, l’Expérience inflige le double de dégâts."],["Bond titubant","A","**Marquez 1 Stress** pour activer l’Expérience comme action supplémentaire du MJ, sans dépenser de Peur."]]],["Fallen Shock Troop","Troupe de choc déchue",4,"minion",18,0,0,1,1,2,"12 phys.","Très courte","Écraser, dominer, être soulagé, punir",[["Sbire (12)","P","Vaincu dès qu’il subit des dégâts. Tous les 12 dégâts qu’un PJ lui inflige, un autre sbire à portée que l’attaque aurait touché est aussi vaincu."],["Aura funeste","P","Quand un PJ marque des PV à cause d’une attaque de la Troupe de choc ur réduire ces dégâts doit marquer 2 cases d’armure."],["Rage dévorante · Compte à rebours (dégressif 8)","R","Lancez le compte à rebours la première fois que le Briseur est activé. Quand il se déclenche, un torrent de rage incarnée arrache la chair des os : toutes les cibles à longue portée font un jet de réaction de Présence. En cas d’échec, elles subissent **2d6+10** dégâts magiques directs ; en cas de réussite, la moitié. Pour chaque PV marqué ainsi, invoquez une Troupe de choc déchue à très courte portée de la cible concernée. Si la valeur maximale du compte à rebours tombe à 0, le Briseur marque tous ses PV restants et toutes les cibles à longue portée marquent tous leurs PV restants et font un choix de mort."],["Porteur de malheur","R","Quand une cible marque des PV à cause d’une attaque du Briseur, tous les PJ à longue portée de la cible perdent 1 Espoir."],["Je n’ai jamais connu la défaite (changement de phase)","R","Quand le Briseur marque son dernier PV, remplacez-le par le Champion invaincu et activez celui-ci immédiatement."]]],["Fallen Warlord: Undefeated Champion","Seigneur de guerre déchu : Champion invaincu",4,"solo",18,35,58,11,5,8,"4d12+13 phys.","Très courte","Semer la mort, punir les rebelles, vaincre à tout prix",[["Implacable (3)","P","Peut être activé jusqu’à 3 fois par tour du MJ. Dépensez de la Peur comme d’habitude pour l’activer."],["Armure défaillante","P","Quand le Champion invaincu subit des dégâts, réduisez-les de **1d10**."],["Frappe fracassante","A","**Marquez 1 Stress** pour porter une attaque standard contre toutes les cibles à très courte portée. Les PJ touchés perdent autant d’Espoir que de PV marqués avec cette attaque."],["Légions sans fin","A","**Dépensez 1 Peur** pour invoquer deux fois plus de Troupes de choc déchues que de PJ. Elles apparaissent à longue portée."],["Cercle de souillure · Compte à rebours (1d8)","R","Lancez le compte à rebours la première fois que le Champion est activé. Quand il se déclenche, un cercle magique couvre une zone à longue portée du Champion. Une cible dans cette zone est Vulnérable tant qu’elle ne quitte pas le cercle. On dissipe le cercle en infligeant des dégâts Graves au Champion."],["Élan","R","Quand l’adversaire réussit une attaque contre un PJ, vous gagnez 1 Peur."],["Porteur de malheur","R","Quand une cible marque des PV à cause d’une attaque du Champion, tous les PJ à longue portée de la cible perdent 1 Espoir."]]],["Giant Beastmaster","Maître des bêtes géant",2,"leader",16,12,24,6,5,2,"2d8+4 phys.","Longue","Commander, protéger ses bêtes",[["Deux en un","P","Quand le Maître des bêtes est activé, vous pouvez aussi activer un animal adversaire de rang 1 qu’il contrôle."],["Tir clouant","A","Attaque standard contre une cible. En cas de réussite, vous pouvez **marquer 1 Stress** pour la clouer à une surface proche : elle est Bloquée jusqu’à ce qu’elle se libère avec un jet de Finesse ou de Force réussi."],["Compagnon mortel","A","Deux fois par scène, invoque un Ours, un Loup sinistre ou un autre animal adversaire de rang 1 sous le contrôle du Maître des bêtes. Il apparaît à courte portée et est activé immédiatement."]]],["Giant Brawler","Bagarreur géant",2,"bruiser",15,14,28,7,4,2,"2d12+3 phys.","Très courte","Gagner sa vie, renverser, cogner",[["Bélier","A","**Marquez 1 Stress** : le Bagarreur charge un objet inanimé à courte portée qu’il peut raisonnablement fracasser (mur, charrette, étal…) et le détruit. Toutes les cibles à très courte portée de l’objet doivent réussir un jet de réaction d’Agilité ou subir **2d4+3** dégâts physiques à cause des débris."],["Représailles sanglantes","R","Quand le Bagarreur marque 2 PV ou plus à cause d’une attaque à très courte portée, vous pouvez porter une attaque standard contre l’attaquant. En cas de réussite, il inflige **2d6+15** dégâts physiques au lieu de ses dégâts standards."],["Élan","R","Quand l’adversaire réussit une attaque contre un PJ, vous gagnez 1 Peur."]]],["Giant Eagle","Aigle géant",2,"skulk", ue standard, la cible Luit jusqu’à la fin de la scène et ne peut pas devenir Cachée. Les jets d’attaque contre une cible qui Luit ont l’avantage."],["Couronne de serpents","A","Jet d’attaque contre une cible au corps à corps avec les serpents protecteurs de la Gorgone. En cas de réussite, **marquez 1 Stress** pour infliger **2d10+4** dégâts physiques ; la cible marque 1 Stress."],["Regard pétrifiant","R","Quand la Gorgone subit des dégâts d’une attaque à courte portée, vous pouvez **dépenser 1 Peur** pour obliger l’attaquant à faire un jet de réaction d’Instinct. En cas d’échec, il commence à se changer en pierre : il marque 1 PV et lance un compte à rebours de pétrification (4), qui diminue chaque fois que la Gorgone est attaquée. Quand il se déclenche, la cible doit faire un choix de mort. Si la Gorgone est vaincue, toutes les pétrifications en cours prennent fin."],["Élan","R","Quand l’adversaire réussit une attaque contre un PJ, vous gagnez 1 Peur."]]],["Greater Earth Elemental","Grand élémentaire de terre",3,"bruiser",17,22,40,10,4,7,"3d10+1 phys.","Très courte","Avalanche, renverser, marteler",[["Lent","P","Quand vous activez l’Élémentaire et qu’il n’a pas de jeton sur sa fiche, il ne peut pas encore agir : placez un jeton et décrivez ce qu’il prépare. Quand vous l’activez et qu’il a un jeton, retirez-le : il peut agir."],["Coups écrasants","P","Quand l’Élémentaire réussit une attaque, la cible doit marquer une case d’armure sans en tirer d’effet (elle peut quand même utiliser son armure pour réduire les dégâts). Si elle ne peut pas, elle marque 1 PV supplémentaire."],["Inébranlable","P","Une attaque qui déplacerait l’Élémentaire le déplace de deux portées de moins (par exemple, longue devient très courte). Quand il subit des dégâts physiques, réduisez-les de 7."],["Éboulement","A","**Marquez 1 Stress** : un éboulement ensevelit le terrain devant l’Élémentaire à courte portée. Toutes les cibles dans la zone font un jet de réaction d’Agilité (19). En cas d’échec, elles subissent **2d12+5** dégâts physiques et sont Vulnérables jusqu’à leur prochain résultat avec Espoir ; en cas de réussite, la moitié des dégâts."],["Élan","R","Quand l’adversaire réussit une attaque contre un PJ, vous gagnez 1 Peur."]]],["Greater Water Elemental","Grand élémentaire d’eau",3,"support",17,17,34,5,5,3,"3d4+1 mag.","Très courte","Déluge, disperser, noyer",[["Jet d’eau","A","**Marquez 1 Stress** pour attaquer une cible à très courte portée. En cas de réussite, elle subit **2d4+7** dégâts physiques et sa prochaine action a le désavantage. En cas d’échec, elle marque 1 Stress."],["Étreinte noyante","A","**Dépensez 1 Peur** pour attaquer toutes les cibles à très courte portée. Les cibles touchées commencent à se noyer : elles sont Bloquées et Vulnérables jusqu’à ce qu’elles se libèrent (fin des deux états) avec un jet de Force ou d’Instinct réussi."],["Marée haute","R","Quand l’Élémentaire réussit une attaque standard, vous pouvez **marquer 1 Stress** pour repousser la cible à courte portée."]]],["Green Ooze","Gelée verte",1,"skulk",8,5,10,5,2,1,"1d6+1 mag.","Mêlée","Se camoufler, absorber, envelopper",[["Lent","P","Quand vous activez la Gelée et qu’elle n’a pas de jeton sur sa fiche, elle ne peut pas encore agir : placez un jeton et décrivez ce qu’elle prépare. Quand vous l’activez et qu’elle a un jeton, retirez-le : elle peut agir."],["Corps acide","P","Quand la Gelée réussit une attaque, la cible doit marquer une case d’armure sans en tirer d’effet (elle peut quand même utiliser son armure pour réduire les dégâts). Si elle ne peut pas, elle marque 1 PV supplémentaire."],["Engloutir","A","Attaque standard contre une cible au corps à corps. En cas de réussite, la Gelée l’engloutit : la cible marque 2 Stress, puis 1 Stress supplémentaire à chaque jet d’action. Si la Gelée subit des dégâts Graves, la cible est libérée."],["Division","R","Quand la Gelée a 3 PV marqués ou plus, vous pouvez **dépenser 1 Peur** pour la diviser en deux Petites gelées vertes (sans PV ni Stress marqués). Activez-les immédiatement toutes les deux."]]],["Hallowed Archer","Archer sanctifié",4,"ranged",19,25,45,3,2,4,"4d8+8 phys.","Longue","Concentrer le tir, obéir, se replacer, tirer en salve",[["Punir les coupables","P","L’Archer inflige le double de dégâts aux cibles déclarées Coupables par un Haut séraphin."],["Volée divine","A","**Marquez 1 Stress** pour porter une attaque standard contre jusqu’à trois cibles."]]],["Hallowed Soldier","Soldat sanctifié",4,"minion",18,0,0,1,2,2,"10 phys.","Mêlée","Obéir, déborder, punir, submerger",[["Sbire (13)","P","Vaincu dès qu’il subit des dégâts. Tous les 13 dégâts qu’un PJ lui inflige, un autre sbire à portée que l’attaque aurait touché est aussi vaincu."],["Vol divin","P","En vol, **dépensez 1 Peur** pour que le Soldat se déplace jusqu’à longue portée (au lieu de courte) avant d’agir."],["Attaque groupée","A","**Dépensez 1 Peur**, choisissez une cible et activez tous les sbires de ce type à courte portée d’elle. Ils se placent au corps à corps et font un seul jet d’attaque commun. En cas de réussite, chacun inflige 10 dégâts physiques ; additionnez-les."]]],["Harrier","Harceleur",1,"standard",12,5,9,3,3,1,"1d6+2 phys.","Courte","Flanquer, harceler, tirer en reculant",[["Garder ses distances","P","Après une attaque standard, le Harceleur peut se déplacer n’importe où à longue portée."],["Repli","R","Quand une créature arrive au corps à corps pour l’attaquer, vous pouvez **marquer 1 Stress** avant le jet d’attaque pour déplacer le Harceleur n’importe où à courte portée et attaquer cette créature. En cas de réussite, il inflige **1d10+2** dégâts physiques."]]],["Head Guard","Chef de la garde",1,"leader",15,7,13,7,3,4,"1d10+4 phys.","Mêlée","Arrêter, fermer, clouer, gloire",[["Rassembler la garde","A","**Dépensez 2 Peur** pour activer le Chef de la garde et jusqu’à **2d4** alliés à longue portée."],["À mon signal · Compte à rebours (5)","R","Lancez le compte à rebours la première fois que le Chef ns divins","A","**Marquez 1 Stress** : le Séraphin projette un éclat de divinité sous forme de rayon brûlant qui touche jusqu’à vingt cibles à très longue portée. Elles font un jet de réaction de Présence (désavantage si elles sont Coupables). En cas d’échec, **4d6+12** dégâts magiques ; en cas de réussite, la moitié."],["Nous ne faisons qu’un","A","Une fois par scène, **dépensez 1 Peur** pour activer tous les autres adversaires à longue portée. Leurs attaques pendant cette activation infligent la moitié des dégâts."]]],["Huge Green Ooze","Énorme gelée verte",3,"skulk",15,15,30,7,4,3,"3d8+1 mag.","Mêlée","Se camoufler, approcher, envelopper, se diviser",[["Lente","P","Quand vous activez la Gelée et qu’elle n’a pas de jeton sur sa fiche, elle ne peut pas encore agir : placez un jeton et décrivez ce qu’elle prépare. Quand vous l’activez et qu’elle a un jeton, retirez-le : elle peut agir."],["Corps acide","P","Quand la Gelée réussit une attaque, la cible doit marquer une case d’armure sans en tirer d’effet (elle peut quand même utiliser son armure pour réduire les dégâts). Si elle ne peut pas, elle marque 1 PV supplémentaire."],["Engloutir","A","Attaque contre une cible au corps à corps. En cas de réussite, la Gelée l’Engloutit : la cible marque 2 Stress, puis 1 Stress supplémentaire à chaque jet d’action tant qu’elle est Engloutie. Quand la Gelée subit des dégâts Graves, toutes les cibles Englouties sont libérées."],["Division","R","Quand la Gelée a 4 PV marqués ou plus, vous pouvez **dépenser 1 Peur** pour la diviser en deux Gelées vertes (sans PV ni Stress marqués). Activez-les immédiatement toutes les deux."]]],["Hydra","Hydre",3,"solo",18,19,35,10,5,3,"2d12+2 phys.","Courte","Dévorer, se régénérer, terrifier",[["Menace à plusieurs têtes","P","L’Hydre commence avec trois têtes et peut en avoir jusqu’à cinq. Quand elle subit des dégâts Majeurs ou pire, elle perd une tête."],["Implacable (X)","P","L’Hydre peut être activée X fois par tour du MJ, X étant son nombre de
