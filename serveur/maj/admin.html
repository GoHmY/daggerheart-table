<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Contrôle du site</title><meta name="robots" content="noindex,nofollow"><link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:wght@600;700&family=Alegreya+Sans:wght@400;500;700&display=swap">
<style>
:root{--bg:#0d0a17;--panel:#18122a;--panel2:#211a38;--line:rgba(217,173,91,.20);--line2:#3a3060;--fg:#efe9fb;--muted:#a79fc2;--gold:#d9ad5b;--gold2:#f3d394;--fear:#b783ea;--hp:#f26b63;--ok:#72d394;--warn:#e8b84e;
 --f-display:"Cormorant Garamond",Georgia,serif;--f-label:"Cinzel",Georgia,serif;--f-body:"Alegreya Sans",system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}html{background:var(--bg)}
body{margin:0;background:radial-gradient(1000px 560px at 0% -10%,rgba(123,79,194,.26),transparent 62%),radial-gradient(800px 480px at 100% 0%,rgba(34,140,150,.14),transparent 60%),var(--bg);background-attachment:fixed;color:var(--fg);font:16px/1.5 var(--f-body);font-variant-numeric:lining-nums tabular-nums;min-height:100vh}
.wrap{max-width:1280px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left,0px))}
header{border-bottom:1px solid var(--line);background:rgba(9,7,15,.85);backdrop-filter:blur(6px);position:sticky;top:0;z-index:10}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px;flex-wrap:wrap}
.brand{display:flex;gap:12px;align-items:center}.brand svg{width:38px;height:38px}
.brand h1{margin:0;font:700 1.15rem var(--f-label);letter-spacing:.12em;text-transform:uppercase;color:var(--gold2)}
.brand small{display:block;color:var(--muted);font:italic 600 .95rem var(--f-display)}
.pills{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pill{font:600 .68rem var(--f-label);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line2);border-radius:999px;padding:4px 10px;white-space:nowrap}
.pill b{color:var(--fg)}.pill.live b{color:var(--ok)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding:6px;margin:16px 0;background:rgba(13,10,23,.88);border:1px solid var(--line);border-radius:999px;scrollbar-width:none;position:sticky;top:68px;z-index:9}
nav.tabs button{flex:none;border:0;background:transparent;color:var(--muted);border-radius:999px;padding:8px 14px;font:600 .74rem var(--f-label);letter-spacing:.12em;text-transform:uppercase;cursor:pointer}
nav.tabs button:hover{color:var(--fg)}nav.tabs button.on{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#1b1305}
main{padding-bottom:80px}
.box{position:relative;background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,0) 40%),var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px;min-width:0}
.box::before{content:"";position:absolute;left:18px;right:18px;top:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.6}
h2{margin:0 0 12px;font:700 1.55rem/1.1 var(--f-display);color:var(--gold2)}
h3{margin:0 0 8px;font:600 .7rem var(--f-label);letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
p{margin:0 0 8px}.muted{color:var(--muted)}.small{font-size:.86rem}.bad{color:var(--hp)}.good{color:var(--ok)}
.head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}.head h2{margin:0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stat{border:1px solid var(--line2);border-radius:10px;padding:10px 12px;background:rgba(8,6,15,.4)}
.stat small{display:block;font:600 .62rem var(--f-label);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.stat strong{font:700 1.9rem/1.1 var(--f-display);color:var(--fg)}.stat.alert strong{color:var(--hp)}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}@media(max-width:900px){.cols{grid-template-columns:minmax(0,1fr)}}
label.f{display:flex;flex-direction:column;gap:4px;font:600 .64rem var(--f-label);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);min-width:0}
input,select{font:1rem var(--f-body);color:var(--fg);background:rgba(8,6,15,.55);border:1px solid var(--line2);border-radius:8px;padding:8px 10px;width:100%;min-width:0;letter-spacing:0;text-transform:none}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.row{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));align-items:end}
.btn{border:1px solid var(--line2);background:rgba(255,255,255,.045);color:var(--fg);border-radius:8px;padding:7px 12px;font:600 .88rem var(--f-body);cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--gold);background:rgba(217,173,91,.08)}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.pri{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#1b1305;border-color:var(--gold)}
.btn.danger{color:var(--hp)}.btn.danger:hover{border-color:var(--hp);background:rgba(242,107,99,.08)}
.btn.sm{padding:4px 9px;font-size:.8rem}
.chip{display:inline-block;font:600 .74rem var(--f-body);border:1px solid currentColor;border-radius:999px;padding:1px 8px;margin:1px 3px 1px 0;white-space:nowrap}
.flex{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:.93rem}
th{font:600 .62rem var(--f-label);letter-spacing:.14em;text-transform:uppercase;color:var(--gold);text-align:left;padding:8px;border-bottom:1px solid var(--line2);white-space:nowrap}
td{padding:8px;border-bottom:1px solid rgba(58,48,96,.6);vertical-align:top}
tr.off td{opacity:.55}
.tcard{border:1px solid var(--line2);border-radius:12px;padding:14px;background:rgba(8,6,15,.35);margin-bottom:12px}
.tcard.locked{border-color:rgba(242,107,99,.5)}
.tname{font:700 1.3rem var(--f-display);color:var(--gold2)}
code{font-family:ui-monospace,Consolas,monospace;background:rgba(255,255,255,.06);border-radius:5px;padding:1px 6px}
.note{border:1px solid rgba(183,131,234,.45);background:rgba(183,131,234,.10);border-radius:10px;padding:12px;margin-bottom:14px}
.note.warn{border-color:rgba(242,107,99,.5);background:rgba(242,107,99,.08)}
.big{font:700 1.5rem var(--f-label);letter-spacing:.14em}
details>summary{cursor:pointer;color:var(--gold);font:600 .72rem var(--f-label);letter-spacing:.12em;text-transform:uppercase;list-style:none}
details>summary::before{content:"▸ "}details[open]>summary::before{content:"▾ "}
.auth{max-width:460px;margin:48px auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:50;max-width:92vw;font-size:.92rem}
.empty{color:var(--muted);padding:12px 8px}
@media(max-width:700px){header{position:static}nav.tabs{top:0}}
</style></head><body>
<header><div class="wrap"><div class="brand"><svg viewBox="0 0 48 48" aria-hidden="true"><rect x="6" y="14" width="20" height="20" rx="3" transform="rotate(45 16 24)" fill="none" stroke="#e8b84e" stroke-width="2"/><rect x="22" y="14" width="20" height="20" rx="3" transform="rotate(45 32 24)" fill="none" stroke="#b783ea" stroke-width="2"/><circle cx="24" cy="24" r="3" fill="#f3d394"/></svg><div><h1>Contrôle du site</h1><small>Toutes les tables Daggerheart</small></div></div>
<div class="pills" id="pills"></div></div></header>
<div class="wrap"><main id="main"><p class="muted" style="padding:30px 0">Chargement…</p></main></div>
<script>
"use strict";
const $=s=>document.querySelector(s),esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const CLS={barde:"Barde",druide:"Druide",gardien:"Gardien",rodeur:"Rôdeur",voleur:"Voleur",seraphin:"Séraphin",sorcier:"Sorcier",guerrier:"Guerrier",magicien:"Magicien"};
const cls=k=>CLS[k]||(k?k[0].toUpperCase()+k.slice(1):"?");
const A={tk:"",d:null,tab:"apercu",temp:null,q:"",ft:"",fails:false,setup:null,err:"",busy:false,t:0};
try{A.tk=sessionStorage.getItem("dh-admin")||"";A.tab=localStorage.getItem("dh-admin-tab")||"apercu"}catch(e){}
const ago=t=>{if(!t)return"jamais";const s=(Date.now()-t)/1e3;if(s<90)return"à l’instant";if(s<3600)return"il y a "+Math.round(s/60)+" min";if(s<86400)return"il y a "+Math.round(s/3600)+" h";if(s<86400*30)return"il y a "+Math.round(s/86400)+" j";return new Date(t).toLocaleDateString("fr-FR")};
const dt=t=>t?new Date(t).toLocaleString("fr-FR",{day:"2-digit",month:"2-digit",year:"2-digit",hour:"2-digit",minute:"2-digit"}):"";
const BAD=/incorrect|échou|refus|Mauvais|Échec/i;
function toast(m){const t=document.createElement("div");t.className="toast";t.setAttribute("role","status");t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),3400)}
async function call(method,op,q,body){const r=await fetch("api/site/"+op+(q?"?"+new URLSearchParams(q):""),{method,headers:{"Content-Type":"application/json","X-Admin":A.tk},body:body===undefined?undefined:JSON.stringify(body),cache:"no-store"});
 const j=await r.json().catch(()=>null);if(r.status===401&&op!=="login"&&op!=="setup"){A.tk="";save();A.d=null;render()}if(!r.ok)throw new Error((j&&j.error)||"Erreur "+r.status);return j}
function save(){try{A.tk?sessionStorage.setItem("dh-admin",A.tk):sessionStorage.removeItem("dh-admin");localStorage.setItem("dh-admin-tab",A.tab)}catch(e){}}
async function load(){if(!A.tk||A.busy)return;A.busy=true;try{A.d=await call("GET","overview");A.t=Date.now()}catch(e){A.err=e.message}finally{A.busy=false}
 const a=document.activeElement;if(a&&/INPUT|SELECT/.test(a.tagName)&&a.closest("main")){pills();return}render()}
async function act(op,q,body,msg){try{const j=await call("POST",op,q,body);if(msg)toast(msg);await load();return j}catch(e){toast(e.message);return null}}
setInterval(()=>{if(A.tk&&document.visibilityState==="visible")load()},15e3);
const val=id=>{const e=document.getElementById(id);return e?e.value:""};
/* ---------- Données dérivées ---------- */
function all(){const d=A.d,acc=[],chars=[];
 d.tables.forEach(t=>{t.accounts.forEach(a=>{acc.push(Object.assign({tid:t.tid,tname:t.name},a));a.chars.forEach(c=>chars.push(Object.assign({tid:t.tid,tname:t.name,owner:a.name,from:"p_"+a.slug},c)))});
  t.orphans.forEach(o=>o.chars.forEach(c=>chars.push(Object.assign({tid:t.tid,tname:t.name,owner:"",from:o.pid},c))))});
 return{acc,chars}}
function pills(){const p=$("#pills");if(!A.tk||!A.d){p.innerHTML="";return}const d=A.d,x=all();
 p.innerHTML=`<span class="pill live">En ligne <b>${d.online}</b></span><span class="pill">Tables <b>${d.tables.length}</b></span><span class="pill">Joueurs <b>${x.acc.length}</b></span><span class="pill">Fiches <b>${x.chars.length}</b></span><button class="btn sm" data-a="logout">Déconnexion</button>`}
/* ---------- Écrans ---------- */
function renderAuth(){const s=A.setup;
 return `<div class="auth"><section class="box"><h2>${s?"Connexion admin":"Créer le mot de passe admin"}</h2>
 ${s?`<label class="f">Mot de passe admin<input id="pw" type="password" autocomplete="current-password" autofocus></label><button class="btn pri" data-a="login" style="margin-top:12px">Entrer</button>`
 :`<p class="small muted">Première ouverture. Pour prouver que vous êtes le propriétaire du serveur, entrez le <b>mjCode</b> écrit dans config.json, puis choisissez le mot de passe de cette page (10 caractères minimum, différent des codes MJ).</p>
 <label class="f">Code de mise en place (mjCode de config.json)<input id="setup" type="password" autocomplete="off"></label>
 <div class="row" style="margin-top:10px"><label class="f">Mot de passe admin<input id="pw" type="password" autocomplete="new-password"></label><label class="f">Confirmer<input id="pw2" type="password" autocomplete="new-password"></label></div>
 <button class="btn pri" data-a="setup" style="margin-top:12px">Créer et entrer</button>`}
 ${A.err?`<p class="bad" style="margin-top:10px">${esc(A.err)}</p>`:""}</section></div>`}
const TABS=[["apercu","Aperçu"],["tables","Tables"],["joueurs","Joueurs"],["fiches","Fiches"],["journal","Journal"],["systeme","Système"]];
function render(){pills();const m=$("#main");
 if(!A.tk){m.innerHTML=A.setup===null?`<p class="muted" style="padding:30px 0">Chargement…</p>`:renderAuth();A.err="";return}
 if(!A.d){m.innerHTML=`<p class="muted" style="padding:30px 0">${A.err?esc(A.err):"Chargement…"}</p>`;return}
 const body={apercu:vApercu,tables:vTables,joueurs:vJoueurs,fiches:vFiches,journal:vJournal,systeme:vSysteme}[A.tab]||vApercu;
 m.innerHTML=`<nav class="tabs">${TABS.map(([k,n])=>`<button class="${A.tab===k?"on":""}" data-tab="${k}">${n}</button>`).join("")}</nav>${A.temp?tempNote():""}${body()}`}
function tempNote(){return `<div class="note"><div class="head" style="margin:0"><span>Code provisoire de <b>${esc(A.temp.name)}</b> (${esc(A.temp.table)}) : <span class="big">${esc(A.temp.code)}</span><br><span class="small muted">Donnez-le au joueur. Il choisira un nouveau mot de passe à sa connexion.</span></span><button class="btn sm" data-a="tempok">Fermer</button></div></div>`}
function vApercu(){const d=A.d,x=all(),day=Date.now()-864e5;
 const f24=d.log.filter(l=>l.t>day&&BAD.test(l.ev)),noMail=x.acc.filter(a=>!a.email).length,locked=x.acc.filter(a=>a.locked).length,on=x.acc.filter(a=>a.online);
 const ips={};f24.forEach(l=>{if(l.ip)ips[l.ip]=(ips[l.ip]||0)+1});const topIp=Object.entries(ips).sort((a,b)=>b[1]-a[1]).slice(0,5);
 return `<section class="box"><div class="stats">
  <div class="stat"><small>Tables</small><strong>${d.tables.length}</strong></div><div class="stat"><small>Joueurs</small><strong>${x.acc.length}</strong></div>
  <div class="stat"><small>En ligne</small><strong class="good">${d.online}</strong></div><div class="stat"><small>Fiches</small><strong>${x.chars.length}</strong></div>
  <div class="stat ${f24.length>=10?"alert":""}"><small>Échecs (24 h)</small><strong>${f24.length}</strong></div><div class="stat"><small>Sans adresse mail</small><strong>${noMail}</strong></div></div></section>
 <div class="cols"><section class="box"><h3>Connectés maintenant</h3>${on.length?`<table><tbody>${on.map(a=>`<tr><td><b>${esc(a.name)}</b></td><td class="muted">${esc(a.tname)}</td><td class="small muted">${ago(a.last)}</td></tr>`).join("")}</tbody></table>`:`<p class="empty">Personne pour l’instant.</p>`}
  <h3 style="margin-top:16px">Tables</h3><table><tbody>${d.tables.map(t=>`<tr${t.locked?' class="off"':""}><td><b>${esc(t.name)}</b>${t.locked?' <span class="chip bad">Suspendue</span>':""}</td><td class="small">${t.accounts.length} joueur${t.accounts.length>1?"s":""}, ${t.nchars} fiche${t.nchars>1?"s":""}</td><td class="small muted">${ago(t.last)}</td></tr>`).join("")}</tbody></table></section>
 <section class="box"><h3>Sécurité</h3>
  ${f24.length?`<p>${f24.length} tentative${f24.length>1?"s":""} refusée${f24.length>1?"s":""} sur les dernières 24 h.</p>${topIp.length?`<table><thead><tr><th>Adresse IP</th><th>Échecs</th></tr></thead><tbody>${topIp.map(([ip,n])=>`<tr><td><code>${esc(ip)}</code></td><td>${n}</td></tr>`).join("")}</tbody></table>`:""}`:`<p class="good">Aucune tentative refusée sur les dernières 24 h.</p>`}
  ${locked?`<p class="small" style="margin-top:8px">${locked} compte${locked>1?"s":""} bloqué${locked>1?"s":""}.</p>`:""}
  <p class="small muted" style="margin-top:8px">Chaque adresse IP est bloquée 10 minutes après 10 échecs.</p>
  <h3 style="margin-top:16px">Dernière activité</h3><table><tbody>${d.log.slice(0,8).map(l=>`<tr><td class="small muted">${ago(l.t)}</td><td class="${BAD.test(l.ev)?"bad":""}">${esc(l.ev)}</td><td class="small">${esc(l.who)}</td></tr>`).join("")||`<tr><td class="empty">Rien.</td></tr>`}</tbody></table></section></div>`}
function vTables(){const d=A.d;
 return `<section class="box"><div class="head"><h2>Tables</h2></div>
 ${d.tables.map(t=>`<div class="tcard ${t.locked?"locked":""}"><div class="head"><div><span class="tname">${esc(t.name)}</span> ${t.locked?'<span class="chip bad">Suspendue</span>':""} ${t.open?'<span class="chip good">Inscriptions ouvertes</span>':'<span class="chip" style="color:var(--muted)">Inscriptions fermées</span>'}<div class="small muted">Code de table <code>${esc(t.code)}</code> · ${t.accounts.length} joueur${t.accounts.length>1?"s":""} · ${t.nchars} fiche${t.nchars>1?"s":""} · ${t.online} en ligne · créée ${dt(t.created)} · activité ${ago(t.last)}</div></div>
  <div class="flex"><button class="btn sm" data-a="copy" data-v="${esc(t.code)}">Copier le code</button><button class="btn sm" data-a="topen" data-t="${t.tid}" data-v="${t.open?0:1}">${t.open?"Fermer les inscriptions":"Ouvrir les inscriptions"}</button><button class="btn sm ${t.locked?"pri":""}" data-a="tlock" data-t="${t.tid}" data-v="${t.locked?0:1}">${t.locked?"Réactiver":"Suspendre"}</button><button class="btn sm" data-a="texport" data-t="${t.tid}">Exporter les fiches</button></div></div>
  <details><summary>Modifier</summary><div class="row" style="margin-top:10px"><label class="f">Nom<input id="tn-${t.tid}" value="${esc(t.name)}"></label><label class="f">Code de table<input id="tc-${t.tid}" value="${esc(t.code)}" autocomplete="off"></label><button class="btn" data-a="tsave" data-t="${t.tid}">Enregistrer</button></div>
   <div class="row" style="margin-top:10px"><label class="f">Nouveau code MJ<input id="tm-${t.tid}" type="password" autocomplete="new-password" placeholder="8 caractères minimum"></label><label class="f">Confirmer<input id="tm2-${t.tid}" type="password" autocomplete="new-password"></label><button class="btn" data-a="tmj" data-t="${t.tid}">Changer le code MJ</button></div>
   <div class="row" style="margin-top:14px"><label class="f">Supprimer la table : tapez « ${esc(t.name)} »<input id="td-${t.tid}" autocomplete="off"></label><button class="btn danger" data-a="tdel" data-t="${t.tid}" ${d.tables.length<2?"disabled":""}>Supprimer la table et tout son contenu</button></div>
   <p class="small muted" style="margin-top:6px">Une copie complète est gardée dans data\\sauvegardes avant toute suppression.</p></details></div>`).join("")}</section>
 <section class="box"><h2>Nouvelle table</h2><p class="small muted">Pour un autre groupe d’amis : il aura son propre code de table, son MJ, ses comptes et ses fiches, sans rien voir des autres tables.</p>
  <div class="row"><label class="f">Nom de la table<input id="nt-name" placeholder="Ex. : Campagne du jeudi"></label><label class="f">Code de table<input id="nt-code" autocomplete="off" placeholder="Ex. : jeudi2026"></label></div>
  <div class="row" style="margin-top:10px"><label class="f">Code MJ<input id="nt-mj" type="password" autocomplete="new-password" placeholder="8 caractères minimum"></label><label class="f">Confirmer le code MJ<input id="nt-mj2" type="password" autocomplete="new-password"></label><button class="btn pri" data-a="tcreate">Créer la table</button></div></section>`}
function filters(){const d=A.d;return `<div class="row" style="margin-bottom:12px"><label class="f">Rechercher<input id="q" value="${esc(A.q)}" placeholder="Nom, mail, personnage…" data-filter></label><label class="f">Table<select id="ft" data-filter><option value="">Toutes les tables</option>${d.tables.map(t=>`<option value="${t.tid}" ${A.ft===t.tid?"selected":""}>${esc(t.name)}</option>`).join("")}</select></label></div>`}
const match=(...s)=>!A.q||s.join(" ").toLowerCase().includes(A.q.toLowerCase());
function vJoueurs(){const x=all(),mail=!!A.d.mail;
 const list=x.acc.filter(a=>(!A.ft||a.tid===A.ft)&&match(a.name,a.email,a.tname,a.chars.map(c=>c.name).join(" ")));
 return `<section class="box"><div class="head"><h2>Joueurs</h2><span class="small muted">${list.length} sur ${x.acc.length}</span></div>${filters()}
 <div class="scroll"><table><thead><tr><th>Joueur</th><th>Table</th><th>Statut</th><th>Inscrit</th><th>Activité</th><th>Fiches</th><th>Actions</th></tr></thead><tbody>
 ${list.map(a=>`<tr${a.locked?' class="off"':""}><td><b>${esc(a.name)}</b><br><span class="small muted">${a.email?esc(a.email):"pas d’adresse mail"}</span></td><td>${esc(a.tname)}</td>
  <td>${a.online?'<span class="chip good">En ligne</span>':""}${a.locked?'<span class="chip bad">Bloqué</span>':""}${a.tmp?'<span class="chip" style="color:var(--fear)">Code provisoire</span>':""}${!a.recovery?'<span class="chip" style="color:var(--muted)">Sans code récup.</span>':""}${mail&&!a.email?'<span class="chip" style="color:var(--muted)">Sans mail</span>':""}</td>
  <td class="small">${dt(a.created)}</td><td class="small">${ago(a.last)}</td><td class="small">${a.chars.map(c=>esc(c.name)).join(", ")||'<span class="muted">aucune</span>'}</td>
  <td><div class="flex"><button class="btn sm" data-a="reset" data-t="${a.tid}" data-n="${esc(a.slug)}" data-l="${esc(a.name)}">Code provisoire</button><button class="btn sm" data-a="lock" data-t="${a.tid}" data-n="${esc(a.slug)}">${a.locked?"Débloquer":"Bloquer"}</button><button class="btn sm" data-a="mail" data-t="${a.tid}" data-n="${esc(a.slug)}" data-v="${esc(a.email)}">Mail</button><button class="btn sm danger" data-a="del" data-t="${a.tid}" data-n="${esc(a.slug)}" data-l="${esc(a.name)}">Supprimer</button></div>
  ${A.edit===a.tid+"/"+a.slug?`<div class="row" style="margin-top:8px"><label class="f">Adresse mail<input id="em" type="email" value="${esc(a.email)}" placeholder="vide pour retirer"></label><button class="btn sm pri" data-a="mailsave" data-t="${a.tid}" data-n="${esc(a.slug)}">Enregistrer</button></div>`:""}
  ${A.del===a.tid+"/"+a.slug?`<div class="row" style="margin-top:8px"><label class="f">Tapez « ${esc(a.name)} » pour confirmer<input id="delc" autocomplete="off"></label><button class="btn sm danger" data-a="delok" data-t="${a.tid}" data-n="${esc(a.slug)}">Supprimer le compte et ses fiches</button></div>`:""}</td></tr>`).join("")||`<tr><td colspan="7" class="empty">Aucun joueur.</td></tr>`}
 </tbody></table></div></section>`}
function vFiches(){const d=A.d,x=all();
 const list=x.chars.filter(c=>(!A.ft||c.tid===A.ft)&&match(c.name,c.owner,c.tname,cls(c.classe)));
 const dest=c=>d.tables.map(t=>`<optgroup label="${esc(t.name)}">${t.accounts.filter(a=>!(t.tid===c.tid&&"p_"+a.slug===c.from)).map(a=>`<option value="${t.tid}|${esc(a.slug)}">${esc(a.name)}</option>`).join("")}</optgroup>`).join("");
 return `<section class="box"><div class="head"><h2>Fiches</h2><span class="small muted">${list.length} sur ${x.chars.length}</span></div>${filters()}
 <div class="scroll"><table><thead><tr><th>Personnage</th><th>Classe</th><th>Joueur</th><th>Table</th><th>Modifiée</th><th>Actions</th></tr></thead><tbody>
 ${list.map(c=>`<tr><td><b>${esc(c.name)}</b></td><td>${esc(cls(c.classe))} niv. ${c.level}</td><td>${c.owner?esc(c.owner):'<span class="chip bad">Sans compte</span>'}</td><td>${esc(c.tname)}</td><td class="small">${ago(c.updatedAt)}</td>
  <td><div class="flex"><select data-move="${c.tid}|${esc(c.from)}|${esc(c.id)}" style="width:auto;padding:4px 8px"><option value="">Transférer à…</option>${dest(c)}</select><button class="btn sm danger" data-a="delchar" data-t="${c.tid}" data-f="${esc(c.from)}" data-i="${esc(c.id)}">Supprimer</button></div></td></tr>`).join("")||`<tr><td colspan="6" class="empty">Aucune fiche.</td></tr>`}
 </tbody></table></div><p class="small muted" style="margin-top:8px">Le transfert vers une autre table déplace la fiche avec tout son contenu (équipement, effets, historique de jets).</p></section>`}
function vJournal(){const d=A.d;
 const list=d.log.filter(l=>(!A.ft||l.table===(d.tables.find(t=>t.tid===A.ft)||{}).name)&&(!A.fails||BAD.test(l.ev))&&match(l.ev,l.who,l.ip,l.table));
 return `<section class="box"><div class="head"><h2>Journal</h2><div class="flex"><label class="flex small" style="cursor:pointer"><input type="checkbox" id="fails" ${A.fails?"checked":""} data-filter style="width:18px;height:18px"> Échecs seulement</label><button class="btn sm" data-a="clearlog">Vider le journal du site</button></div></div>${filters()}
 <div class="scroll"><table><thead><tr><th>Date</th><th>Table</th><th>Évènement</th><th>Qui</th><th>Adresse IP</th></tr></thead><tbody>
 ${list.map(l=>`<tr><td class="small">${dt(l.t)}</td><td class="small">${esc(l.table)}</td><td class="${BAD.test(l.ev)?"bad":""}">${esc(l.ev)}</td><td>${esc(l.who)}</td><td class="small muted"><code>${esc(l.ip)}</code></td></tr>`).join("")||`<tr><td colspan="5" class="empty">Rien.</td></tr>`}
 </tbody></table></div><p class="small muted" style="margin-top:8px">Les 250 derniers évènements, toutes tables confondues.</p></section>`}
function vSysteme(){const d=A.d,up=d.uptime,h=Math.floor(up/3600),mn=Math.floor(up%3600/60);
 return `<div class="cols"><section class="box"><h2>Serveur</h2><table><tbody>
  <tr><td class="muted">Mails de récupération</td><td>${d.mail?`<span class="good">activés</span>, envoyés depuis ${esc(d.mail)}`:'<span class="bad">désactivés</span>'}</td></tr>
  <tr><td class="muted">En ligne depuis</td><td>${h} h ${mn} min</td></tr><tr><td class="muted">Node.js</td><td>${esc(d.node)}</td></tr>
  <tr><td class="muted">Base de données</td><td>${(d.dbSize/1024).toFixed(0)} Ko</td></tr><tr><td class="muted">Connexions temps réel</td><td>${d.online}</td></tr>
  <tr><td class="muted">Sessions admin ouvertes</td><td>${d.sessions}</td></tr></tbody></table>
  <h3 style="margin-top:16px">Sauvegardes quotidiennes</h3><p class="small">${d.backups.length} fichier${d.backups.length>1?"s":""} dans data\\sauvegardes (30 jours gardés).</p><p class="small muted">${d.backups.slice(0,6).map(esc).join(", ")}</p></section>
 <section class="box"><h2>Accès admin</h2><div class="row"><label class="f">Mot de passe actuel<input id="op" type="password" autocomplete="current-password"></label></div>
  <div class="row" style="margin-top:10px"><label class="f">Nouveau mot de passe<input id="np" type="password" autocomplete="new-password" placeholder="10 caractères minimum"></label><label class="f">Confirmer<input id="np2" type="password" autocomplete="new-password"></label></div>
  <button class="btn pri" data-a="pass" style="margin-top:10px">Changer le mot de passe admin</button>
  <h3 style="margin-top:18px">Sessions</h3><p class="small muted">Une session dure 12 heures sans activité. Fermez-les toutes si vous pensez qu’un appareil est resté connecté.</p><button class="btn danger" data-a="logoutall">Fermer toutes les sessions admin</button></section></div>`}
/* ---------- Actions ---------- */
function arm(b,label){if(b.dataset.armed)return true;b.dataset.armed="1";const o=b.textContent;b.textContent=label||"Confirmer ?";setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.textContent=o}},3500);return false}
function dl(name,obj){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(obj,null,1)],{type:"application/json"}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
document.addEventListener("click",async e=>{const b=e.target.closest("button");if(!b)return;
 if(b.dataset.tab){A.tab=b.dataset.tab;save();render();scrollTo({top:0});return}
 const a=b.dataset.a,t=b.dataset.t,n=b.dataset.n;if(!a)return;
 switch(a){
  case "login":try{const j=await call("POST","login",null,{pass:val("pw")});A.tk=j.token;save();await load()}catch(x){A.err=x.message;render()}return;
  case "setup":{if(val("pw")!==val("pw2")){A.err="Les deux mots de passe ne correspondent pas.";render();return}try{const j=await call("POST","setup",null,{setup:val("setup"),pass:val("pw"),pass2:val("pw2")});A.tk=j.token;A.setup=true;save();await load()}catch(x){A.err=x.message;render()}return}
  case "logout":try{await call("POST","logout")}catch(x){}A.tk="";A.d=null;A.setup=true;save();render();return;
  case "tempok":A.temp=null;render();return;
  case "copy":try{await navigator.clipboard.writeText(b.dataset.v);toast("Code copié.")}catch(x){toast(b.dataset.v)}return;
  case "topen":act("tablesettings",{table:t},{open:b.dataset.v==="1"});return;
  case "tlock":if(b.dataset.v==="1"&&!arm(b,"Confirmer la suspension"))return;act("tablesettings",{table:t},{locked:b.dataset.v==="1"},b.dataset.v==="1"?"Table suspendue : plus personne ne peut s’y connecter.":"Table réactivée.");return;
  case "texport":try{const j=await call("GET","export",{table:t});dl("daggerheart-"+t+"-"+new Date().toISOString().slice(0,10)+".json",j)}catch(x){toast(x.message)}return;
  case "tsave":act("tablesettings",{table:t},{name:val("tn-"+t),code:val("tc-"+t)},"Table enregistrée.");return;
  case "tmj":{const m=val("tm-"+t);if(m.length<8){toast("Code MJ : 8 caractères minimum.");return}if(m!==val("tm2-"+t)){toast("Les deux codes ne correspondent pas.");return}act("tablesettings",{table:t},{mjCode:m,mjCode2:val("tm2-"+t)},"Code MJ changé.");return}
  case "tdel":if(!arm(b,"Confirmer la suppression définitive"))return;act("deletetable",{table:t},{confirm:val("td-"+t)},"Table supprimée.");return;
  case "tcreate":{const m=val("nt-mj");if(m!==val("nt-mj2")){toast("Les deux codes MJ ne correspondent pas.");return}act("createtable",null,{name:val("nt-name"),code:val("nt-code"),mjCode:m,mjCode2:val("nt-mj2")},"Table créée.");return}
  case "reset":{if(!arm(b))return;const j=await act("reset",{table:t,name:n});if(j){A.temp={name:b.dataset.l,table:(A.d.tables.find(x=>x.tid===t)||{}).name||t,code:j.temp};render();scrollTo({top:0})}return}
  case "lock":act("lock",{table:t,name:n});return;
  case "mail":A.edit=A.edit===t+"/"+n?null:t+"/"+n;A.del=null;render();return;
  case "mailsave":A.edit=null;act("email",{table:t,name:n},{email:val("em")},"Adresse enregistrée.");return;
  case "del":A.del=A.del===t+"/"+n?null:t+"/"+n;A.edit=null;render();return;
  case "delok":A.del=null;act("delete",{table:t,name:n},{confirm:val("delc")},"Compte supprimé.");return;
  case "delchar":if(!arm(b))return;act("delchar",{table:t,from:b.dataset.f,id:b.dataset.i},null,"Fiche supprimée.");return;
  case "clearlog":if(!arm(b))return;act("clearlog",null,null,"Journal du site vidé.");return;
  case "pass":{if(val("np")!==val("np2")){toast("Les deux mots de passe ne correspondent pas.");return}act("password",null,{old:val("op"),pass:val("np"),pass2:val("np2")},"Mot de passe admin changé.");return}
  case "logoutall":if(!arm(b))return;try{await call("POST","logoutall")}catch(x){}A.tk="";A.d=null;save();render();return}
});
document.addEventListener("input",e=>{const t=e.target;if(t.dataset.filter===undefined||t.tagName==="SELECT"||t.type==="checkbox")return;A.q=t.value;const pos=t.selectionStart;render();const q=$("#q");if(q){q.focus();try{q.setSelectionRange(pos,pos)}catch(x){}}});
document.addEventListener("change",e=>{const t=e.target;
 if(t.dataset.filter!==undefined&&t.tagName==="SELECT"){A.ft=t.value;render();return}
 if(t.id==="fails"){A.fails=t.checked;render();return}
 if(t.dataset.move!==undefined&&t.value){const[tid,from,id]=t.dataset.move.split("|"),[to,who]=t.value.split("|");act("movechar",{table:tid,from,id,to:who,totable:to},null,"Fiche transférée.")}});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.tagName==="INPUT"&&!A.tk){const b=document.querySelector('[data-a="login"],[data-a="setup"]');if(b)b.click()}});
(async()=>{try{const r=await fetch("api/site/status",{cache:"no-store"});const j=await r.json();A.setup=!!j.setup}catch(e){A.setup=true;A.err="Serveur injoignable."}
 if(A.tk)await load();render()})();
</script></body></html>
